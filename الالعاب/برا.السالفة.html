<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>برا السالفة | اللعبة المطورة</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel -->

    <!-- Google Fonts -->

    <!-- Tailwind Config & Custom Styles -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            light: '#3b82f6',
                            dark: '#60a5fa',
                        },
                        accent: {
                            light: '#8b5cf6',
                            dark: '#a78bfa',
                        }
                    },
                    animation: {
                        'fade-scale': 'fadeScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'bounce-soft': 'bounceSoft 2s infinite',
                        'scan': 'scan 1.5s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeScale: {
                            '0%': { opacity: 0, transform: 'scale(0.9)' },
                            '100%': { opacity: 1, transform: 'scale(1)' },
                        },
                        fadeIn: {
                            '0%': { opacity: 0, transform: 'translateY(10px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' },
                        },
                        bounceSoft: {
                            '0%, 100%': { transform: 'translateY(-5%)' },
                            '50%': { transform: 'translateY(0)' },
                        },
                        scan: {
                            '0%': { top: '0%', opacity: 0 },
                            '10%': { opacity: 1 },
                            '90%': { opacity: 1 },
                            '100%': { top: '100%', opacity: 0 },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        body {
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.5s ease;
        }

        /* Glassmorphism utility classes */
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        .dark .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .glass-btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: all 0.2s ease;
        }

        .glass-btn:active {
            transform: scale(0.95);
        }

        /* شاشة ما قبل اللعب الموحدة (Pro Arena Pre-Game Lobby) */
        #pa-lobby-root {
            position: fixed; inset: 0; z-index: 9999; overflow-y: auto; overflow-x: hidden; touch-action: pan-y;
            background-color: #FFF7EB;
            background-image:
                radial-gradient(circle at 10% 12%, rgba(255, 167, 38, 0.2), transparent 34%),
                radial-gradient(circle at 90% 88%, rgba(107, 139, 255, 0.14), transparent 36%),
                radial-gradient(#FF980018 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 24px 24px;
            color: #0F172A; font-family: 'Cairo', sans-serif;
            transition: opacity 0.3s ease, background-color 0.35s ease, color 0.35s ease;
            -webkit-user-select: none; user-select: none;
        }
        #pa-lobby-root.pa-hidden { opacity: 0; pointer-events: none; visibility: hidden; }
        #pa-lobby-root.pa-dark {
            background-color: #0B1120;
            background-image:
                radial-gradient(circle at 12% 12%, rgba(255, 152, 0, 0.14), transparent 36%),
                radial-gradient(circle at 88% 85%, rgba(107, 139, 255, 0.12), transparent 36%),
                radial-gradient(rgba(148, 163, 184, 0.1) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 24px 24px;
            color: #F8FAFC;
        }
        .pa-hero-stage-rect { position: relative; border-radius: 30px; background: linear-gradient(135deg, #1E293B 0%, #0F172A 65%, #1A1F35 100%); border: 2px solid rgba(255, 255, 255, 0.12); box-shadow: 0 6px 0 #090E1A, 0 22px 42px -12px rgba(15, 23, 42, 0.35); overflow: hidden; }
        #pa-lobby-root.pa-dark .pa-hero-stage-rect { background: linear-gradient(135deg, #17233B 0%, #0F172A 65%, #1C2640 100%); border-color: rgba(255, 183, 77, 0.24); box-shadow: 0 6px 0 #050811, 0 24px 44px -12px rgba(0, 0, 0, 0.65); }
        .pa-hero-stage-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px); background-size: 22px 22px; mask-image: radial-gradient(circle at 80% 30%, black 20%, transparent 78%); -webkit-mask-image: radial-gradient(circle at 80% 30%, black 20%, transparent 78%); pointer-events: none; }
        .pa-game-thumb-frame { position: relative; border-radius: 22px; border: 3px solid rgba(255, 255, 255, 0.92); box-shadow: 0 12px 24px rgba(0, 0, 0, 0.38), 0 0 0 4px rgba(255, 152, 0, 0.22); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .pa-hero-stage-rect:hover .pa-game-thumb-frame { transform: rotate(-2deg) scale(1.03); }
        .pa-tactile-exit-btn { background: linear-gradient(180deg, #F87171 0%, #EF4444 100%); color: #FFFFFF; border-radius: 16px; border: 1.5px solid rgba(255, 255, 255, 0.28); box-shadow: 0 4px 0 #991B1B, 0 8px 16px rgba(239, 68, 68, 0.35); transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.14s ease; cursor: pointer; }
        .pa-tactile-exit-btn:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 5px 0 #991B1B, 0 10px 20px rgba(239, 68, 68, 0.42); }
        .pa-tactile-exit-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #991B1B; }
        .pa-arcade-option-rect { position: relative; width: 100%; text-align: right; border-radius: 24px; background: #FFFFFF; border: 2px solid #E2E8F0; box-shadow: 0 5px 0 #CBD5E1, 0 14px 26px -12px rgba(15, 23, 42, 0.12); transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s ease, border-color 0.2s ease, background-color 0.2s ease; overflow: hidden; cursor: pointer; }
        .pa-arcade-option-rect:hover { transform: translateY(-2px); border-color: #FDBA74; box-shadow: 0 7px 0 #FDBA74, 0 18px 30px -10px rgba(255, 123, 0, 0.22); }
        .pa-arcade-option-rect:active, .pa-arcade-option-rect.pa-is-pressed { transform: translateY(4px) !important; box-shadow: 0 1px 0 #CBD5E1 !important; }
        .pa-arcade-option-rect.pa-is-featured { background: linear-gradient(135deg, #FFB03A 0%, #FF7B00 100%); border-color: #FFD180; box-shadow: 0 6px 0 #C2410C, 0 18px 32px -10px rgba(255, 123, 0, 0.46); }
        .pa-arcade-option-rect.pa-is-featured:hover { border-color: #FFE0B2; box-shadow: 0 8px 0 #C2410C, 0 22px 36px -10px rgba(255, 123, 0, 0.56); }
        .pa-arcade-option-rect.pa-is-featured:active, .pa-arcade-option-rect.pa-is-featured.pa-is-pressed { transform: translateY(5px) !important; box-shadow: 0 1px 0 #C2410C !important; }
        #pa-lobby-root.pa-dark .pa-arcade-option-rect:not(.pa-is-featured) { background: #162033; border-color: #293852; box-shadow: 0 5px 0 #0A101D, 0 16px 28px -12px rgba(0, 0, 0, 0.55); }
        #pa-lobby-root.pa-dark .pa-arcade-option-rect:not(.pa-is-featured):hover { background: #1B2840; border-color: #FF9800; box-shadow: 0 7px 0 #9A3412, 0 18px 32px -10px rgba(255, 152, 0, 0.24); }
        #pa-lobby-root.pa-dark .pa-arcade-option-rect:not(.pa-is-featured):active, #pa-lobby-root.pa-dark .pa-arcade-option-rect:not(.pa-is-featured).pa-is-pressed { box-shadow: 0 1px 0 #0A101D !important; }
        .pa-arcade-option-rect:hover .pa-opt-icon { transform: scale(1.05) rotate(-3deg); }
        .pa-arcade-option-rect:not(.pa-is-featured):hover .pa-opt-title { color: #FF9800; }
        .pa-arcade-option-rect:not(.pa-is-featured):hover .pa-enter-pill { background: #FF9800; color: #FFFFFF; }
        .pa-arcade-option-rect:not(.pa-is-featured):hover .pa-enter-pill i { transform: translateX(-2px); }
        .pa-arcade-option-rect.pa-is-featured:hover .pa-featured-pill { transform: scale(1.05); }
        .pa-rect-watermark { position: absolute; left: 68px; bottom: -14px; font-size: 4.2rem; font-weight: 900; line-height: 1; opacity: 0.055; pointer-events: none; font-family: 'Nunito', 'Cairo', sans-serif; color: #0F172A; }
        #pa-lobby-root.pa-dark .pa-rect-watermark { color: #F8FAFC; }
        .pa-arcade-option-rect.pa-is-featured .pa-rect-watermark { opacity: 0.14; color: #FFFFFF; }
        .pa-text-primary { color: #0F172A; }
        .pa-text-secondary { color: #64748B; }
        #pa-lobby-root.pa-dark .pa-text-primary { color: #F8FAFC; }
        #pa-lobby-root.pa-dark .pa-text-secondary { color: #94A3B8; }
        .pa-hint-pill { background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(226, 232, 240, 0.8); color: #64748B; }
        #pa-lobby-root.pa-dark .pa-hint-pill { background: rgba(30, 41, 59, 0.8); border-color: #334155; color: #94A3B8; }
        .pa-opt-tag { background: #FFF7ED; border: 1px solid #FFEDD5; color: #FF9800; }
        #pa-lobby-root.pa-dark .pa-opt-tag { background: #1E293B; border-color: #334155; color: #FFB74D; }
        .pa-enter-pill { background: #F1F5F9; color: #64748B; }
        #pa-lobby-root.pa-dark .pa-enter-pill { background: #1E293B; color: #94A3B8; }
        .pa-modal-card { background: #FFFFFF; border: 2px solid #F1F5F9; border-radius: 30px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        #pa-lobby-root.pa-dark .pa-modal-card { background: #162033; border-color: #293852; }
        .pa-progress-track { background: #E2E8F0; }
        #pa-lobby-root.pa-dark .pa-progress-track { background: #334155; }
        @keyframes paPopSlideIn { from { opacity: 0; transform: translateY(18px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .pa-animate-pop { opacity: 0; animation: paPopSlideIn 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        @keyframes paProgressFill { 0% { width: 8%; } 100% { width: 100%; } }
        .pa-progress-anim { animation: paProgressFill 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    </style>
</head>

<body
    class="bg-blue-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 font-sans m-0 min-h-screen selection:bg-brand-light selection:text-white">

    <!-- ==================== شاشة ما قبل اللعب (Pro Arena Lobby) ==================== -->
    <div id="pa-lobby-root" dir="rtl">
        <div class="min-h-[100dvh] flex flex-col">
            <div class="w-full max-w-xl mx-auto px-4 sm:px-6 pt-5 sm:pt-8 pb-10 flex-1 flex flex-col gap-6">
                <section id="pa-game-header-rect" class="pa-animate-pop pa-hero-stage-rect" style="animation-delay: 0.02s;">
                    <div class="pa-hero-stage-grid"></div>
                    <div class="absolute -top-14 -right-14 w-48 h-48 rounded-full blur-3xl pointer-events-none" style="background: rgba(255, 152, 0, 0.3);"></div>
                    <div class="absolute -bottom-16 -left-12 w-44 h-44 rounded-full blur-3xl pointer-events-none" style="background: rgba(16, 185, 129, 0.25);"></div>
                    <img id="pa-hero-cover-img" alt="" class="hidden absolute inset-0 w-full h-full object-cover opacity-20 mix-blend-luminosity pointer-events-none">

                    <div class="relative z-10 p-4 sm:p-5">
                        <div class="flex items-center justify-between gap-3.5 sm:gap-4">
                            <div class="flex items-center gap-3.5 sm:gap-4 min-w-0 flex-1">
                                <div id="pa-game-image-box" class="pa-game-thumb-frame w-20 h-20 sm:w-[88px] sm:h-[88px] shrink-0 overflow-hidden flex items-center justify-center" style="background: linear-gradient(135deg, #10B981, #0D9488);">
                                    <img id="pa-game-image" src="" alt="برا السالفة" class="hidden w-full h-full object-cover relative z-10" onerror="paHandleGameImageError()">
                                    <div id="pa-game-image-placeholder" class="w-full h-full flex items-center justify-center relative z-10">
                                        <i id="pa-game-icon" class="fa-solid fa-masks-theater text-4xl sm:text-5xl text-white drop-shadow-md"></i>
                                    </div>
                                </div>
                                <div class="min-w-0 flex-1">
                                    <span class="inline-flex items-center gap-1.5 text-[10px] sm:text-[11px] font-black px-2.5 py-0.5 rounded-lg mb-1.5" style="background: rgba(255, 152, 0, 0.2); color: #FCD34D; border: 1px solid rgba(255, 152, 0, 0.3);">
                                        <i class="fa-solid fa-sparkles text-[9px]"></i>
                                        <span id="pa-game-badge-text">لعبة جماعية</span>
                                    </span>
                                    <h1 id="pa-game-name" class="text-xl sm:text-2xl md:text-3xl font-black text-white leading-tight truncate">برا السالفة</h1>
                                    <p id="pa-game-desc" class="text-[11px] sm:text-xs font-bold text-slate-300 mt-1 line-clamp-1">واحد منكم ما يعرف السالفة.. اكتشفوا المخادع!</p>
                                </div>
                            </div>
                            <button type="button" onclick="proArenaExitToApp()" class="pa-tactile-exit-btn h-12 px-3.5 sm:px-4 flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2 shrink-0" aria-label="خروج" title="خروج والعودة للقائمة">
                                <i class="fa-solid fa-right-from-bracket text-base"></i>
                                <span class="text-[11px] sm:text-xs font-black leading-none">خروج</span>
                            </button>
                        </div>
                    </div>
                </section>

                <section class="flex-1 flex flex-col gap-3.5">
                    <div class="pa-animate-pop flex items-center justify-between px-1" style="animation-delay: 0.08s;">
                        <div class="flex items-center gap-2">
                            <div class="w-7 h-7 rounded-xl flex items-center justify-center text-xs shadow-sm" style="background: rgba(255, 152, 0, 0.15); color: #FF9800;">
                                <i class="fa-solid fa-layer-group"></i>
                            </div>
                            <h2 class="text-base sm:text-lg font-black pa-text-primary">خيارات اللعب</h2>
                        </div>
                        <span class="pa-hint-pill text-[11px] font-black px-3 py-1 rounded-full">انقر للدخول مباشرة</span>
                    </div>
                    <div id="pa-play-options-container" class="flex flex-col gap-4"></div>
                </section>
            </div>
        </div>

        <div id="pa-launch-overlay" class="fixed inset-0 z-[10050] bg-slate-950/70 backdrop-blur-md flex items-center justify-center p-5 opacity-0 pointer-events-none transition-opacity duration-300">
            <div id="pa-launch-card" class="pa-modal-card w-full max-w-sm p-7 text-center transform scale-95 transition-transform duration-300">
                <div id="pa-launch-icon-box" class="w-20 h-20 rounded-[24px] mx-auto mb-4 flex items-center justify-center text-white text-3xl shadow-xl" style="background: linear-gradient(135deg, #FFB347, #FF7B00);">
                    <i id="pa-launch-icon" class="fa-solid fa-play"></i>
                </div>
                <h3 id="pa-launch-title" class="text-xl font-black pa-text-primary mb-1">جاري الدخول للعب...</h3>
                <p id="pa-launch-subtitle" class="text-xs font-bold pa-text-secondary mb-5">يتم تجهيز الجولة الآن</p>
                <div class="pa-progress-track w-full h-3 rounded-full overflow-hidden p-0.5">
                    <div id="pa-launch-progress" class="h-full rounded-full w-0" style="background: linear-gradient(to left, #FFB347, #FF7B00);"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="root"></div>

    <script>
        const PA_GAME_TEMPLATE = {
            name: 'برا السالفة',
            description: 'واحد منكم ما يعرف السالفة.. اكتشفوا المخادع بالأسئلة والتصويت!',
            badge: 'لعبة جماعية',
            image: '',
            icon: 'fa-solid fa-masks-theater',
            accentGradient: 'linear-gradient(135deg, #10B981, #0D9488)',
            options: [
                {
                    id: 'random',
                    title: 'موضوع عشوائي (دخول سريع)',
                    desc: 'اختيار موضوع عشوائي تلقائياً والانتقال فوراً لتحديد عدد اللاعبين',
                    tag: 'مقترح',
                    featured: true,
                    icon: 'fa-solid fa-shuffle',
                    iconBg: 'linear-gradient(135deg, #FBBF24, #F97316)'
                },
                {
                    id: 'choose',
                    title: 'اختيار الموضوع يدوياً',
                    desc: 'تصفح 6 مواضيع: أفلام، أماكن، شخصيات، أكلات، حيوانات، وألعاب',
                    tag: '6 مواضيع',
                    featured: false,
                    icon: 'fa-solid fa-layer-group',
                    iconBg: 'linear-gradient(135deg, #10B981, #0D9488)'
                },
                {
                    id: 'food-places',
                    title: 'جولة أكلات وأماكن',
                    desc: 'مواضيع خفيفة وممتعة مثالية لكل الجلسات العائلية والأصدقاء',
                    tag: 'الأكثر لعباً',
                    featured: false,
                    icon: 'fa-solid fa-utensils',
                    iconBg: 'linear-gradient(135deg, #3B82F6, #4F46E5)'
                },
                {
                    id: 'movies-games',
                    title: 'جولة أفلام وألعاب',
                    desc: 'تحدي الحماس لعشاق السينما وألعاب الفيديو الشهيرة',
                    tag: 'تحدي',
                    featured: false,
                    icon: 'fa-solid fa-film',
                    iconBg: 'linear-gradient(135deg, #A855F7, #C026D3)'
                }
            ]
        };

        let paIsEntering = false;
        let paCurrentDark = null;
        let paSoundEnabled = true;
        let paAudioCtx = null;
        window.__PA_PENDING_OPTION = null;

        function paApplyThemeState(isDark) {
            paCurrentDark = !!isDark;
            const root = document.getElementById('pa-lobby-root');
            if (root) root.classList.toggle('pa-dark', paCurrentDark);
            if (typeof window.PA_ON_THEME_CHANGE === 'function') {
                window.PA_ON_THEME_CHANGE(paCurrentDark);
            }
        }

        function paApplySoundState(enabled) {
            paSoundEnabled = !!enabled;
        }

        function paSyncTheme() {
            if (paCurrentDark !== null) {
                paApplyThemeState(paCurrentDark);
                return;
            }
            let isDark = false;
            let isSoundOn = true;
            try {
                const params = new URLSearchParams(window.location.search);
                const pTheme = params.get('paTheme') || params.get('theme');
                if (pTheme === 'dark' || pTheme === 'light') isDark = pTheme === 'dark';
                else isDark = localStorage.getItem('pro-arena-darkmode') === 'true';
                const pSound = params.get('paSound');
                if (pSound === '0' || pSound === '1') isSoundOn = pSound === '1';
                else isSoundOn = localStorage.getItem('pro-arena-sound') !== 'false';
            } catch (e) { }
            paApplyThemeState(isDark);
            paApplySoundState(isSoundOn);
        }

        function paPlaySound(type = 'click') {
            if (!paSoundEnabled) return;
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!paAudioCtx) paAudioCtx = new Ctx();
                if (paAudioCtx.state === 'suspended') paAudioCtx.resume();
                const osc = paAudioCtx.createOscillator();
                const gain = paAudioCtx.createGain();
                osc.connect(gain); gain.connect(paAudioCtx.destination);
                const now = paAudioCtx.currentTime;
                if (type === 'enter') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(420, now);
                    osc.frequency.exponentialRampToValueAtTime(840, now + 0.14);
                    gain.gain.setValueAtTime(0.09, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
                    osc.start(now); osc.stop(now + 0.22);
                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(240, now + 0.06);
                    gain.gain.setValueAtTime(0.07, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
                    osc.start(now); osc.stop(now + 0.06);
                }
            } catch (e) { }
        }

        function paEscapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function paHandleGameImageError() {
            const img = document.getElementById('pa-game-image');
            const ph = document.getElementById('pa-game-image-placeholder');
            if (img) img.classList.add('hidden');
            if (ph) ph.classList.remove('hidden');
        }

        function renderProArenaLobby() {
            document.getElementById('pa-game-name').textContent = PA_GAME_TEMPLATE.name;
            document.getElementById('pa-game-desc').textContent = PA_GAME_TEMPLATE.description;
            document.getElementById('pa-game-badge-text').textContent = PA_GAME_TEMPLATE.badge;
            const container = document.getElementById('pa-play-options-container');
            container.innerHTML = PA_GAME_TEMPLATE.options.map((opt, idx) => {
                const isFeatured = Boolean(opt.featured);
                const orderNum = String(idx + 1).padStart(2, '0');
                if (isFeatured) {
                    return `
                        <button type="button" onclick="paEnterGameWithOption('${paEscapeHtml(opt.id)}', this)"
                            class="pa-animate-pop pa-arcade-option-rect pa-is-featured p-4 sm:p-5 flex items-center justify-between gap-3.5 sm:gap-4"
                            style="animation-delay: ${0.12 + idx * 0.06}s;">
                            <span class="pa-rect-watermark" aria-hidden="true">${orderNum}</span>
                            <div class="pa-opt-icon w-14 h-14 sm:w-[60px] sm:h-[60px] rounded-2xl bg-white/20 backdrop-blur-sm border-2 border-white/40 text-white flex items-center justify-center shrink-0 shadow-inner transition-transform relative z-10">
                                <i class="${opt.icon} text-2xl drop-shadow-sm"></i>
                            </div>
                            <div class="flex-1 min-w-0 relative z-10">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <h3 class="font-black text-base sm:text-lg text-white leading-snug">${paEscapeHtml(opt.title)}</h3>
                                    ${opt.tag ? `<span class="text-[10px] font-black px-2.5 py-0.5 rounded-lg bg-black/20 text-white border border-white/25">${paEscapeHtml(opt.tag)}</span>` : ''}
                                </div>
                                <p class="text-xs font-bold text-white/90 mt-1 truncate">${paEscapeHtml(opt.desc)}</p>
                            </div>
                            <div class="pa-featured-pill h-11 px-4 rounded-2xl bg-white font-black text-xs sm:text-sm flex items-center gap-1.5 shrink-0 shadow-md transition-transform relative z-10" style="color: #EA580C;">
                                <span>العب</span>
                                <i class="fa-solid fa-play text-[10px] rotate-180"></i>
                            </div>
                        </button>`;
                }
                return `
                    <button type="button" onclick="paEnterGameWithOption('${paEscapeHtml(opt.id)}', this)"
                        class="pa-animate-pop pa-arcade-option-rect p-4 sm:p-5 flex items-center justify-between gap-3.5 sm:gap-4"
                        style="animation-delay: ${0.12 + idx * 0.06}s;">
                        <span class="pa-rect-watermark" aria-hidden="true">${orderNum}</span>
                        <div class="pa-opt-icon w-14 h-14 rounded-2xl text-white flex items-center justify-center shrink-0 shadow-md border-2 border-white/40 transition-transform relative z-10" style="background: ${opt.iconBg};">
                            <i class="${opt.icon} text-xl drop-shadow-sm"></i>
                        </div>
                        <div class="flex-1 min-w-0 relative z-10">
                            <div class="flex items-center gap-2 flex-wrap">
                                <h3 class="pa-opt-title font-black text-sm sm:text-base pa-text-primary transition-colors leading-snug">${paEscapeHtml(opt.title)}</h3>
                                ${opt.tag ? `<span class="pa-opt-tag text-[10px] font-black px-2.5 py-0.5 rounded-lg">${paEscapeHtml(opt.tag)}</span>` : ''}
                            </div>
                            <p class="text-[11px] sm:text-xs font-bold pa-text-secondary mt-1 truncate">${paEscapeHtml(opt.desc)}</p>
                        </div>
                        <div class="pa-enter-pill h-10 px-3.5 rounded-2xl font-black text-xs flex items-center gap-1.5 shrink-0 transition-all relative z-10">
                            <span class="hidden sm:inline">دخول</span>
                            <i class="fa-solid fa-chevron-left text-[11px] transition-transform"></i>
                        </div>
                    </button>`;
            }).join('');
        }

        function paEnterGameWithOption(optionId, cardEl) {
            if (paIsEntering) return;
            const option = PA_GAME_TEMPLATE.options.find(item => item.id === optionId);
            if (!option) return;
            paIsEntering = true;
            paPlaySound('enter');
            if (cardEl) cardEl.classList.add('pa-is-pressed');

            const overlay = document.getElementById('pa-launch-overlay');
            const card = document.getElementById('pa-launch-card');
            const iconBox = document.getElementById('pa-launch-icon-box');
            const icon = document.getElementById('pa-launch-icon');
            const progress = document.getElementById('pa-launch-progress');
            iconBox.style.background = option.iconBg;
            icon.className = option.icon;
            document.getElementById('pa-launch-title').textContent = 'جاري الدخول للعب...';
            document.getElementById('pa-launch-subtitle').textContent = option.title;
            progress.classList.remove('pa-progress-anim');
            void progress.offsetWidth;
            progress.classList.add('pa-progress-anim');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-95'); card.classList.add('scale-100');

            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'PRO_ARENA_ENTER_GAME', gameName: PA_GAME_TEMPLATE.name, optionId: option.id, optionTitle: option.title }, '*');
                }
            } catch (e) { }

            setTimeout(() => {
                if (typeof window.PA_ON_SELECT_OPTION === 'function') window.PA_ON_SELECT_OPTION(optionId);
                else window.__PA_PENDING_OPTION = optionId;

                overlay.classList.add('opacity-0', 'pointer-events-none');
                card.classList.add('scale-95'); card.classList.remove('scale-100');
                document.getElementById('pa-lobby-root').classList.add('pa-hidden');
                paIsEntering = false;
                document.querySelectorAll('.pa-is-pressed').forEach(el => el.classList.remove('pa-is-pressed'));
            }, 430);
        }

        function showProArenaLobby() {
            paIsEntering = false;
            paSyncTheme();
            const root = document.getElementById('pa-lobby-root');
            if (root) { root.scrollTop = 0; root.classList.remove('pa-hidden'); }
        }

        function proArenaExitToApp() {
            paPlaySound('click');
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'PRO_ARENA_EXIT_GAME' }, '*');
                    if (typeof window.parent.confirmExit === 'function') window.parent.confirmExit(true);
                    return;
                }
            } catch (e) { return; }
            if (window.history.length > 1) window.history.back();
            else window.location.href = '../index.html';
        }

        paSyncTheme();
        renderProArenaLobby();
        window.addEventListener('storage', (e) => {
            if (e.key === 'pro-arena-darkmode') paApplyThemeState(e.newValue === 'true');
            if (e.key === 'pro-arena-sound') paApplySoundState(e.newValue !== 'false');
        });
        window.addEventListener('message', (e) => {
            if (!e || !e.data || typeof e.data !== 'object') return;
            if (e.data.type === 'PRO_ARENA_THEME_CHANGE') {
                paApplyThemeState(!!e.data.isDark);
            } else if (e.data.type === 'set_theme') {
                paApplyThemeState(e.data.theme === 'dark');
            } else if (e.data.type === 'PRO_ARENA_SOUND_CHANGE') {
                paApplySoundState(!!e.data.enabled);
            }
        });
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- البيانات الأساسية ---
        const CATEGORIES = {
            "أفلام": { icon: "fa-film", color: "text-blue-500", items: ["إنترستيلر", "الجوكر", "باراسايت", "العراب", "المصفوفة", "حرب النجوم", "تايتانيك", "الفيل الأزرق", "هاري بوتر", "سبايدرمان"] },
            "أماكن": { icon: "fa-plane-departure", color: "text-green-500", items: ["باريس", "الأهرامات", "برج خليفة", "سور الصين", "مكة المكرمة", "الشفق القطبي", "جزر المالديف", "نهر النيل", "طوكيو"] },
            "شخصيات": { icon: "fa-user-tie", color: "text-purple-500", items: ["ابن بطوطة", "صلاح الدين", "آينشتاين", "ستيف جوبز", "غاندي", "شكسبير", "كليوباترا", "إيلون ماسك", "ميسي"] },
            "أكلات": { icon: "fa-utensils", color: "text-orange-500", items: ["بيتزا", "سوشي", "شاورما", "برجر", "كبسة", "فلافل", "كشري", "منسف", "باستا", "كنافة"] },
            "حيوانات": { icon: "fa-paw", color: "text-yellow-500", items: ["أسد", "نمر", "فيل", "زرافة", "باندا", "ذئب", "صقر", "بطريق", "دلفين", "قرش"] },
            "ألعاب": { icon: "fa-gamepad", color: "text-red-500", items: ["ماينكرافت", "GTA", "فيفا", "فورتنايت", "كود", "ماريو", "زيلدا", "ببجي", "روكيت ليج"] }
        };

        function App() {
            // --- State Management ---
            const [gameState, setGameState] = useState('category'); // category, setup, names, assignment, game, voting, result
            const [theme, setTheme] = useState(() => {
                if (typeof paCurrentDark === 'boolean') return paCurrentDark ? 'dark' : 'light';
                try {
                    const urlParams = new URLSearchParams(window.location.search);
                    const pTheme = urlParams.get('paTheme') || urlParams.get('theme');
                    if (pTheme === 'dark' || pTheme === 'light') return pTheme;
                    return localStorage.getItem('pro-arena-darkmode') === 'true' ? 'dark' : 'light';
                } catch (e) {
                    return 'light';
                }
            });

            const [players, setPlayers] = useState([]);
            const [numPlayers, setNumPlayers] = useState(5);

            const [gameData, setGameData] = useState({
                category: "",
                secretWord: "",
                liarIndex: -1,
                round: 1,
            });

            const [turnData, setTurnData] = useState({
                currentPlayerIndex: 0,
                votes: {},
                votingPlayerIndex: 0
            });
            const [exitExpanded, setExitExpanded] = useState(false);

            // ربط خيارات شاشة ما قبل اللعب مع حالة React
            useEffect(() => {
                const applyOption = (optId) => {
                    setExitExpanded(false);
                    const keys = Object.keys(CATEGORIES);
                    if (optId === 'choose') {
                        setGameState('category');
                    } else if (optId === 'food-places') {
                        const pool = ['أكلات', 'أماكن'];
                        const pick = pool[Math.floor(Math.random() * pool.length)];
                        const items = CATEGORIES[pick].items;
                        setGameData({ category: pick, secretWord: items[Math.floor(Math.random() * items.length)], liarIndex: -1, round: 1 });
                        setGameState('setup');
                    } else if (optId === 'movies-games') {
                        const pool = ['أفلام', 'ألعاب'];
                        const pick = pool[Math.floor(Math.random() * pool.length)];
                        const items = CATEGORIES[pick].items;
                        setGameData({ category: pick, secretWord: items[Math.floor(Math.random() * items.length)], liarIndex: -1, round: 1 });
                        setGameState('setup');
                    } else {
                        const pick = keys[Math.floor(Math.random() * keys.length)];
                        const items = CATEGORIES[pick].items;
                        setGameData({ category: pick, secretWord: items[Math.floor(Math.random() * items.length)], liarIndex: -1, round: 1 });
                        setGameState('setup');
                    }
                };
                window.PA_ON_SELECT_OPTION = applyOption;
                if (window.__PA_PENDING_OPTION) {
                    const pending = window.__PA_PENDING_OPTION;
                    window.__PA_PENDING_OPTION = null;
                    applyOption(pending);
                }
            }, []);

            // --- Theme Sync (متزامن تلقائياً مع صفحة حسابي في برو أرينا) ---
            useEffect(() => {
                const root = window.document.documentElement;
                root.classList.remove('light', 'dark');
                root.classList.add(theme);
            }, [theme]);

            useEffect(() => {
                window.PA_ON_THEME_CHANGE = (isDark) => {
                    setTheme(isDark ? 'dark' : 'light');
                };
                if (typeof paCurrentDark === 'boolean') {
                    setTheme(paCurrentDark ? 'dark' : 'light');
                }
                return () => {
                    window.PA_ON_THEME_CHANGE = null;
                };
            }, []);

            // --- Background Gradient based on theme ---
            const bgClass = theme === 'light'
                ? "bg-gradient-to-br from-blue-100 via-indigo-50 to-purple-100"
                : "bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900";

            // --- Handlers ---
            const selectCategory = (catName) => {
                const items = CATEGORIES[catName].items;
                const randomItem = items[Math.floor(Math.random() * items.length)];
                setGameData({ ...gameData, category: catName, secretWord: randomItem });
                setGameState('setup');
            };

            const startNamesPhase = (count) => {
                setNumPlayers(count);
                // Keep existing players if any, pad with empty names
                let newPlayers = [...players];
                if (newPlayers.length > count) newPlayers = newPlayers.slice(0, count);
                while (newPlayers.length < count) {
                    newPlayers.push({ id: Date.now() + Math.random(), name: '', score: 0 });
                }
                setPlayers(newPlayers);
                setGameState('names');
            };

            const startRound = (updatedPlayers) => {
                setPlayers(updatedPlayers);
                setGameData({
                    ...gameData,
                    liarIndex: Math.floor(Math.random() * updatedPlayers.length)
                });
                setTurnData({ currentPlayerIndex: 0, votes: {}, votingPlayerIndex: 0 });
                setGameState('assignment');
            };

            const nextRound = () => {
                const categoriesKeys = Object.keys(CATEGORIES);
                const randomCat = categoriesKeys[Math.floor(Math.random() * categoriesKeys.length)];
                const items = CATEGORIES[randomCat].items;

                setGameData({
                    category: randomCat,
                    secretWord: items[Math.floor(Math.random() * items.length)],
                    liarIndex: Math.floor(Math.random() * players.length),
                    round: gameData.round + 1
                });
                setTurnData({ currentPlayerIndex: 0, votes: {}, votingPlayerIndex: 0 });
                setGameState('assignment');
            };

            const resetGame = () => {
                if (window.confirm('هل أنت متأكد من العودة لخيارات اللعب وإنهاء الجولة؟')) {
                    setPlayers([]);
                    setGameData({ category: "", secretWord: "", liarIndex: -1, round: 1 });
                    setGameState('category');
                    if (window.showProArenaLobby) window.showProArenaLobby();
                }
            };

            return (
                <div className={`min-h-[100dvh] flex justify-center ${bgClass} transition-colors duration-500`} onClick={() => exitExpanded && setExitExpanded(false)}>
                    {/* Floating Decorative Elements */}
                    <div className="fixed top-20 left-10 w-32 h-32 bg-blue-400/20 rounded-full blur-3xl pointer-events-none"></div>
                    <div className="fixed bottom-20 right-10 w-40 h-40 bg-purple-400/20 rounded-full blur-3xl pointer-events-none"></div>

                    <div className="w-full max-w-[500px] min-h-[100dvh] relative flex flex-col z-10">

                        {/* Header */}
                        <header className="px-6 pt-6 pb-4 flex items-center justify-between gap-2 z-20">
                            <div className="min-w-0">
                                <h1 className="text-xl sm:text-2xl font-black flex items-center gap-2 truncate">
                                    برا السالفة <i className="fa-solid fa-masks-theater text-brand-light animate-bounce-soft text-lg sm:text-xl"></i>
                                </h1>
                                {gameData.round > 1 && gameState !== 'category' && (
                                    <span className="text-xs font-bold text-accent-light">الجولة {gameData.round}</span>
                                )}
                            </div>
                            <div className="flex items-center gap-2 shrink-0" onClick={(e) => e.stopPropagation()}>
                                {/* زر الخروج الموحد بالنمط الزجاجي للعبة */}
                                <div className={`glass-panel rounded-full h-10 flex items-center overflow-hidden transition-all duration-300 border border-red-400/40 ${exitExpanded ? 'w-[148px] pl-1.5' : 'w-10'}`}>
                                    <button type="button" onClick={() => setExitExpanded(!exitExpanded)}
                                        className="w-10 h-10 shrink-0 flex items-center justify-center text-red-500 dark:text-red-400 hover:scale-105 transition-transform"
                                        aria-label="خروج من اللعبة" title="خروج من اللعبة">
                                        <i className={`fa-solid ${exitExpanded ? 'fa-times' : 'fa-door-open'} text-base`}></i>
                                    </button>
                                    {exitExpanded && (
                                        <div className="flex items-center gap-1.5 whitespace-nowrap">
                                            <span className="text-xs font-black text-red-500 dark:text-red-400">خروج؟</span>
                                            <button type="button" onClick={() => {
                                                setExitExpanded(false);
                                                setPlayers([]);
                                                setGameData({ category: "", secretWord: "", liarIndex: -1, round: 1 });
                                                setGameState('category');
                                                if (window.showProArenaLobby) window.showProArenaLobby();
                                            }}
                                                className="px-2.5 py-1 rounded-full bg-gradient-to-l from-red-500 to-rose-600 text-white text-[11px] font-black shadow-sm hover:brightness-110 transition">
                                                نعم
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </header>

                        {/* Main Content Area */}
                        <main className="flex-1 overflow-y-auto px-6 pb-24 scrollbar-hide relative">
                            {gameState === 'category' && <CategoryPhase onSelect={selectCategory} />}
                            {gameState === 'setup' && <SetupPhase currentNum={numPlayers} onNext={startNamesPhase} />}
                            {gameState === 'names' && <NamesPhase players={players} onStart={startRound} />}

                            {gameState === 'assignment' && (
                                <AssignmentPhase
                                    player={players[turnData.currentPlayerIndex]}
                                    gameData={gameData}
                                    isLast={turnData.currentPlayerIndex === players.length - 1}
                                    onNext={() => {
                                        if (turnData.currentPlayerIndex < players.length - 1) {
                                            setTurnData({ ...turnData, currentPlayerIndex: turnData.currentPlayerIndex + 1 });
                                        } else {
                                            setGameState('game');
                                        }
                                    }}
                                    currentIndex={turnData.currentPlayerIndex}
                                    totalPlayers={players.length}
                                />
                            )}

                            {gameState === 'game' && <GamePhase players={players} onFinish={() => setGameState('voting')} />}

                            {gameState === 'voting' && (
                                <VotingPhase
                                    players={players}
                                    turnData={turnData}
                                    setTurnData={setTurnData}
                                    onComplete={(finalVotes) => {
                                        setTurnData({ ...turnData, votes: finalVotes });
                                        setGameState('result');
                                    }}
                                />
                            )}

                            {gameState === 'result' && (
                                <ResultPhase
                                    players={players}
                                    setPlayers={setPlayers}
                                    gameData={gameData}
                                    votes={turnData.votes}
                                    onNextRound={nextRound}
                                    onEndGame={() => { setPlayers([]); setGameState('category'); if (window.showProArenaLobby) window.showProArenaLobby(); }}
                                />
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        // --- Phases Components ---

        function CategoryPhase({ onSelect }) {
            return (
                <div className="animate-fade-in pt-4">
                    <div className="text-center mb-8">
                        <h2 className="text-3xl font-black mb-2">اختر <span className="text-brand-light">الموضوع</span> 🎭</h2>
                        <p className="text-sm font-bold opacity-70">واحد منكم راح يكون برا السالفة!</p>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                        {Object.entries(CATEGORIES).map(([name, data]) => (
                            <button
                                key={name}
                                onClick={() => onSelect(name)}
                                className="glass-panel p-6 rounded-3xl flex flex-col items-center justify-center gap-3 hover:scale-105 hover:shadow-xl transition-all group overflow-hidden relative"
                            >
                                <div className={`w-14 h-14 rounded-2xl bg-slate-100/50 dark:bg-slate-800/50 flex items-center justify-center text-3xl ${data.color} shadow-sm group-hover:scale-110 transition-transform z-10`}>
                                    <i className={`fa-solid ${data.icon}`}></i>
                                </div>
                                <span className="font-black text-lg z-10">{name}</span>
                                <i className={`fa-solid ${data.icon} absolute -bottom-4 -right-4 text-7xl opacity-5 dark:opacity-10 transform -rotate-12`}></i>
                            </button>
                        ))}
                    </div>
                </div>
            );
        }

        function SetupPhase({ currentNum, onNext }) {
            const [num, setNum] = useState(currentNum);
            return (
                <div className="animate-fade-scale flex flex-col h-[70vh] justify-center max-w-sm mx-auto">
                    <div className="glass-panel p-8 rounded-[2.5rem] text-center relative overflow-hidden">
                        <div className="w-20 h-20 mx-auto bg-blue-100 dark:bg-blue-900/30 rounded-full flex items-center justify-center text-4xl text-brand-light mb-6 shadow-inner">
                            <i className="fa-solid fa-users"></i>
                        </div>
                        <h2 className="text-2xl font-black mb-2">كم عددكم؟</h2>
                        <p className="text-sm opacity-70 font-bold mb-8">اللعبة تحتاج من 3 إلى 8 لاعبين</p>

                        <div className="flex items-center justify-between glass-panel rounded-2xl p-2 mb-8">
                            <button onClick={() => setNum(Math.max(3, num - 1))} className="w-12 h-12 rounded-xl bg-slate-100/50 dark:bg-slate-700/50 hover:bg-slate-200 dark:hover:bg-slate-600 flex items-center justify-center font-bold text-xl transition-colors">-</button>
                            <span className="text-4xl font-black w-16">{num}</span>
                            <button onClick={() => setNum(Math.min(8, num + 1))} className="w-12 h-12 rounded-xl bg-slate-100/50 dark:bg-slate-700/50 hover:bg-slate-200 dark:hover:bg-slate-600 flex items-center justify-center font-bold text-xl transition-colors">+</button>
                        </div>

                        <button onClick={() => onNext(num)} className="glass-btn w-full py-4 rounded-2xl font-black text-lg flex items-center justify-center gap-2">
                            التالي <i className="fa-solid fa-arrow-left"></i>
                        </button>
                    </div>
                </div>
            );
        }

        function NamesPhase({ players, onStart }) {
            const [localPlayers, setLocalPlayers] = useState(players);

            const updateName = (index, name) => {
                const newPlayers = [...localPlayers];
                newPlayers[index].name = name;
                setLocalPlayers(newPlayers);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (localPlayers.some(p => p.name.trim() === '')) {
                    alert('يرجى إدخال جميع الأسماء!');
                    return;
                }
                onStart(localPlayers);
            };

            return (
                <div className="animate-fade-in pt-4 pb-8 max-w-sm mx-auto">
                    <div className="text-center mb-6">
                        <h2 className="text-2xl font-black mb-1">عرفونا عليكم ✍️</h2>
                        <p className="text-sm opacity-70 font-bold">عشان نعرف مين الفايز بالنهاية</p>
                    </div>

                    <form onSubmit={handleSubmit} className="space-y-4">
                        <div className="glass-panel p-6 rounded-[2rem] space-y-3">
                            {localPlayers.map((player, idx) => (
                                <div key={player.id} className="flex items-center glass-panel rounded-2xl overflow-hidden focus-within:ring-2 focus-within:ring-brand-light/50 transition-all">
                                    <div className="w-12 h-12 flex items-center justify-center bg-black/5 dark:bg-white/5 font-bold opacity-50 border-l border-black/10 dark:border-white/10">
                                        {idx + 1}
                                    </div>
                                    <input
                                        type="text"
                                        placeholder={`اسم اللاعب`}
                                        value={player.name}
                                        onChange={(e) => updateName(idx, e.target.value)}
                                        className="flex-1 bg-transparent px-4 py-3 font-bold focus:outline-none placeholder-slate-400"
                                        required
                                    />
                                </div>
                            ))}
                        </div>
                        <button type="submit" className="glass-btn w-full py-4 rounded-2xl font-black text-lg flex items-center justify-center gap-2 mt-4 shadow-xl">
                            توزيع الأدوار <i className="fa-solid fa-shuffle"></i>
                        </button>
                    </form>
                </div>
            );
        }

        function AssignmentPhase({ player, gameData, isLast, onNext, currentIndex, totalPlayers }) {
            const [isScanning, setIsScanning] = useState(false);
            const [hasScanned, setHasScanned] = useState(false);

            const isLiar = gameData.liarIndex === currentIndex;

            useEffect(() => {
                setIsScanning(false);
                setHasScanned(false);
            }, [player.id]);

            const handleScan = () => {
                setIsScanning(true);
                setTimeout(() => {
                    setIsScanning(false);
                    setHasScanned(true);
                }, 2000);
            };

            return (
                <div className="flex flex-col h-[75vh] animate-fade-in">
                    {/* Progress indicator */}
                    <div className="flex gap-1 justify-center mb-8 mx-auto w-3/4">
                        {Array.from({ length: totalPlayers }).map((_, idx) => (
                            <div key={idx} className={`h-1.5 rounded-full transition-all duration-500 ${idx === currentIndex ? 'w-8 bg-brand-light' : idx < currentIndex ? 'w-2 bg-brand-light/50' : 'w-2 bg-slate-300 dark:bg-slate-700'}`} />
                        ))}
                    </div>

                    <div className="flex-1 flex flex-col items-center justify-center w-full max-w-sm mx-auto">
                        <div className="text-center mb-8 w-full">
                            <p className="text-sm font-bold opacity-70 mb-1">دورك يا</p>
                            <h2 className="text-4xl font-black text-brand-light drop-shadow-sm">{player.name}</h2>
                        </div>

                        <div className={`w-full aspect-[4/5] rounded-[2.5rem] transition-all duration-500 relative overflow-hidden flex flex-col items-center justify-center p-6 shadow-2xl
                            ${!hasScanned && !isScanning ? 'glass-panel' :
                                isScanning ? 'bg-cyan-50 dark:bg-cyan-900/30 border-2 border-cyan-400' :
                                    isLiar ? 'bg-red-50 dark:bg-red-900/40 border-2 border-red-400' : 'bg-blue-50 dark:bg-blue-900/40 border-2 border-blue-400'}`}>

                            {isScanning && (
                                <div className="absolute left-0 right-0 h-2 bg-cyan-400/80 shadow-[0_0_20px_rgba(34,211,238,0.8)] animate-scan z-20"></div>
                            )}

                            {!isScanning && !hasScanned ? (
                                <div className="flex flex-col items-center opacity-40">
                                    <i className="fa-solid fa-fingerprint text-7xl mb-4"></i>
                                    <p className="font-bold">السالفة مخفية</p>
                                </div>
                            ) : isScanning ? (
                                <div className="flex flex-col items-center animate-pulse text-cyan-600 dark:text-cyan-400">
                                    <i className="fa-solid fa-spinner fa-spin text-6xl mb-4"></i>
                                    <p className="font-black text-xl tracking-widest">جاري الكشف...</p>
                                </div>
                            ) : (
                                <div className="flex flex-col items-center text-center z-10 w-full animate-fade-scale">
                                    {isLiar ? (
                                        <>
                                            <i className="fa-solid fa-user-ninja text-7xl text-red-500 mb-6 drop-shadow-md"></i>
                                            <h3 className="text-4xl font-black text-red-500 mb-2">أنت برا السالفة!</h3>
                                            <p className="font-bold opacity-80 bg-white/50 dark:bg-black/20 px-4 py-2 rounded-xl mt-2">حاول تخدعهم وتعرف السالفة 😉</p>
                                        </>
                                    ) : (
                                        <>
                                            <i className="fa-solid fa-lightbulb text-6xl text-amber-400 mb-6 drop-shadow-md"></i>
                                            <p className="font-bold opacity-70 mb-2">السالفة هي:</p>
                                            <h3 className="text-4xl font-black text-brand-light bg-white/80 dark:bg-slate-800/80 w-full py-4 rounded-2xl shadow-sm">{gameData.secretWord}</h3>
                                        </>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="mt-8 max-w-sm mx-auto w-full">
                        {!isScanning && !hasScanned ? (
                            <button onClick={handleScan} className="glass-btn w-full py-4 rounded-2xl font-black text-lg flex items-center justify-center gap-2">
                                اكشف لي الدور 👁️
                            </button>
                        ) : hasScanned ? (
                            <button onClick={onNext} className="w-full bg-slate-800 text-white dark:bg-white dark:text-slate-900 py-4 rounded-2xl font-black text-lg shadow-lg hover:scale-[1.02] transition-transform flex items-center justify-center gap-2">
                                {isLast ? 'ابدأ التحقيق 🕵️‍♂️' : 'فهمت، اخفي ومرر الجوال'}
                                {!isLast && <i className="fa-solid fa-check ml-2"></i>}
                            </button>
                        ) : null}
                    </div>
                </div>
            );
        }

        function GamePhase({ players, onFinish }) {
            const [timeLeft, setTimeLeft] = useState(120); // 2 minutes
            const [turnIndex, setTurnIndex] = useState(0);

            useEffect(() => {
                if (timeLeft <= 0) return;
                const timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                return () => clearInterval(timer);
            }, [timeLeft]);

            const asker = players[turnIndex % players.length].name;
            const target = players[(turnIndex + 1) % players.length].name;

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60);
                const s = secs % 60;
                return `0${m}:${s < 10 ? '0' : ''}${s}`;
            };

            const isWarning = timeLeft <= 30 && timeLeft > 10;
            const isDanger = timeLeft <= 10;

            return (
                <div className="animate-fade-in pt-8 max-w-sm mx-auto flex flex-col items-center">
                    <h2 className="text-3xl font-black mb-8 text-center">وقت التحقيق 🔍</h2>

                    {/* Timer Circle */}
                    <div className="relative w-48 h-48 mb-10 flex items-center justify-center">
                        <svg className="absolute inset-0 w-full h-full transform -rotate-90">
                            <circle cx="96" cy="96" r="88" className="stroke-slate-200 dark:stroke-slate-700" strokeWidth="12" fill="none" />
                            <circle cx="96" cy="96" r="88"
                                className={`transition-all duration-1000 ease-linear ${isDanger ? 'stroke-red-500' : isWarning ? 'stroke-yellow-500' : 'stroke-brand-light'}`}
                                strokeWidth="12" fill="none" strokeDasharray="553" strokeDashoffset={553 - (553 * timeLeft) / 120} strokeLinecap="round"
                            />
                        </svg>
                        <span className={`text-5xl font-black relative z-10 ${isDanger ? 'text-red-500 animate-pulse' : ''}`}>{formatTime(timeLeft)}</span>
                    </div>

                    {/* Turn Info */}
                    <div className="glass-panel w-full p-4 rounded-2xl mb-8 flex items-center justify-center gap-3 text-lg font-bold shadow-md">
                        <span className="text-brand-light font-black">{asker}</span>
                        <i className="fa-solid fa-arrow-left text-slate-400"></i>
                        <span>يسأل</span>
                        <span className="text-accent-light font-black">{target}</span>
                    </div>

                    {/* Controls */}
                    <div className="w-full space-y-3">
                        <button onClick={() => setTurnIndex(prev => prev + 1)} className="w-full bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 py-3 rounded-2xl font-black text-lg hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                            السؤال التالي <i className="fa-solid fa-forward-step ml-1"></i>
                        </button>
                        <button onClick={() => setTimeLeft(prev => prev + 30)} className="w-full bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 py-2 rounded-xl font-bold text-sm">
                            وقت إضافي (+30ث) <i className="fa-solid fa-plus"></i>
                        </button>
                        <div className="h-px bg-slate-200 dark:bg-slate-700 my-4"></div>
                        <button onClick={onFinish} className="glass-btn w-full py-4 rounded-2xl font-black text-lg flex items-center justify-center gap-2">
                            إنهاء وبدء التصويت 🗳️
                        </button>
                    </div>
                </div>
            );
        }

        function VotingPhase({ players, turnData, setTurnData, onComplete }) {
            const voterIndex = turnData.votingPlayerIndex;
            const voter = players[voterIndex];
            const [selectedVote, setSelectedVote] = useState(null);

            const handleVoteSubmit = () => {
                if (selectedVote === null) return;

                const newVotes = { ...turnData.votes };
                const votedName = players[selectedVote].name;
                newVotes[votedName] = (newVotes[votedName] || 0) + 1;

                if (voterIndex < players.length - 1) {
                    setTurnData({
                        ...turnData,
                        votes: newVotes,
                        votingPlayerIndex: voterIndex + 1
                    });
                    setSelectedVote(null);
                } else {
                    onComplete(newVotes);
                }
            };

            return (
                <div className="animate-fade-in pt-8 max-w-sm mx-auto">
                    <div className="text-center mb-6">
                        <div className="w-16 h-16 mx-auto bg-accent-light/20 text-accent-light rounded-full flex items-center justify-center text-3xl mb-4">
                            <i className="fa-solid fa-gavel"></i>
                        </div>
                        <h2 className="text-3xl font-black mb-2">من هو المخادع؟ 🤔</h2>
                        <p className="inline-block glass-panel px-4 py-2 rounded-xl text-sm font-bold mt-2">
                            دور <span className="text-brand-light text-lg mx-1">{voter.name}</span> في التصويت
                        </p>
                    </div>

                    <div className="space-y-3 mb-8">
                        {players.map((p, idx) => {
                            if (idx === voterIndex) return null;
                            const isSelected = selectedVote === idx;
                            return (
                                <button
                                    key={p.id}
                                    onClick={() => setSelectedVote(idx)}
                                    className={`w-full flex items-center justify-between p-4 rounded-2xl transition-all duration-200 border-2 
                                        ${isSelected ? 'bg-brand-light/10 border-brand-light shadow-md transform translate-x-1' : 'glass-panel border-transparent hover:border-slate-300'}`}
                                >
                                    <span className="font-black text-lg">{p.name}</span>
                                    <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors
                                        ${isSelected ? 'border-brand-light' : 'border-slate-400'}`}>
                                        {isSelected && <div className="w-3 h-3 rounded-full bg-brand-light"></div>}
                                    </div>
                                </button>
                            )
                        })}
                    </div>

                    <button
                        onClick={handleVoteSubmit}
                        disabled={selectedVote === null}
                        className={`w-full py-4 rounded-2xl font-black text-lg transition-all shadow-lg flex items-center justify-center gap-2
                            ${selectedVote === null ? 'bg-slate-300 dark:bg-slate-700 opacity-50 cursor-not-allowed text-slate-500' : 'glass-btn'}`}
                    >
                        تأكيد التصويت <i className="fa-solid fa-check-circle"></i>
                    </button>
                </div>
            );
        }

        function ResultPhase({ players, setPlayers, gameData, votes, onNextRound, onEndGame }) {
            // Logic for calculating winner
            let maxVotes = 0;
            let mostVotedPlayer = null;
            let tie = false;

            for (const pName in votes) {
                if (votes[pName] > maxVotes) {
                    maxVotes = votes[pName];
                    mostVotedPlayer = pName;
                    tie = false;
                } else if (votes[pName] === maxVotes) {
                    tie = true;
                }
            }

            const liarName = players[gameData.liarIndex].name;
            const detectivesWin = (mostVotedPlayer === liarName && !tie);

            // Calculate Scores only once
            const [finalPlayers, setFinalPlayers] = useState([]);

            useEffect(() => {
                const updatedPlayers = players.map(p => ({ ...p }));
                if (detectivesWin) {
                    updatedPlayers.forEach((p, i) => {
                        if (i !== gameData.liarIndex) p.score += 100;
                    });
                } else {
                    updatedPlayers[gameData.liarIndex].score += 200;
                }
                setFinalPlayers(updatedPlayers.sort((a, b) => b.score - a.score));
                setPlayers(updatedPlayers); // sync with app state
            }, []);

            return (
                <div className="animate-fade-scale pt-6 max-w-md mx-auto">
                    <h2 className="text-3xl font-black text-center mb-6">النتيجة 🏁</h2>

                    <div className={`p-6 rounded-[2rem] border-4 shadow-xl mb-8 relative overflow-hidden text-center
                        ${detectivesWin ? 'bg-emerald-50 dark:bg-emerald-900/30 border-emerald-400' : 'bg-red-50 dark:bg-red-900/30 border-red-400'}`}>

                        <div className="text-6xl mb-4 relative z-10">{detectivesWin ? '🕵️‍♂️✅' : '😎🏆'}</div>
                        <h3 className={`text-2xl font-black mb-3 relative z-10 ${detectivesWin ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-600 dark:text-red-400'}`}>
                            {detectivesWin ? 'كفو! كشفتوا المخادع' : 'أفاا.. فاز المخادع عليكم!'}
                        </h3>
                        <div className="glass-panel inline-block px-4 py-2 rounded-xl relative z-10">
                            <span className="font-bold opacity-80">المخادع كان: </span>
                            <span className="font-black text-lg text-red-500 mx-1">{liarName}</span>
                        </div>

                        {/* Background decor */}
                        <div className={`absolute -right-10 -bottom-10 w-40 h-40 rounded-full blur-2xl opacity-20 ${detectivesWin ? 'bg-emerald-500' : 'bg-red-500'}`}></div>
                    </div>

                    {/* Scoreboard */}
                    <div className="glass-panel p-5 rounded-3xl mb-8">
                        <h3 className="font-black text-sm uppercase opacity-60 tracking-wider mb-4 border-b border-black/10 dark:border-white/10 pb-2">لوحة الشرف</h3>
                        <div className="space-y-3">
                            {finalPlayers.map((p, idx) => {
                                const maxScore = Math.max(...finalPlayers.map(x => x.score)) || 1;
                                const pct = (p.score / maxScore) * 100;
                                const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '';

                                return (
                                    <div key={p.id} className="flex items-center gap-3 bg-white/50 dark:bg-slate-800/50 p-2 rounded-2xl">
                                        <div className="w-10 h-10 rounded-xl bg-slate-200 dark:bg-slate-700 flex items-center justify-center font-black shrink-0">{p.name.charAt(0)}</div>
                                        <div className="flex-1">
                                            <div className="flex justify-between items-center mb-1">
                                                <span className="font-bold text-sm">{p.name} {medal}</span>
                                                <span className="font-black text-brand-light">{p.score}</span>
                                            </div>
                                            <div className="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                                                <div className="h-full bg-brand-light rounded-full transition-all duration-1000" style={{ width: `${pct}%` }}></div>
                                            </div>
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>

                    <div className="flex flex-col gap-3">
                        <button onClick={onNextRound} className="glass-btn w-full py-4 rounded-2xl font-black text-lg flex items-center justify-center gap-2">
                            جولة جديدة بنفس اللاعبين 🔄
                        </button>
                        <button onClick={onEndGame} className="w-full bg-transparent border-2 border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300 py-3 rounded-2xl font-bold hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                            إنهاء والعودة للرئيسية <i className="fa-solid fa-house ml-1"></i>
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
