<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050505">
    <title>لعبة المافيا - بروتوكول التحقيق</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#ef4444', /* Red-500 */
                            light: '#f87171',   /* Red-400 */
                            dark: '#dc2626',    /* Red-600 */
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts: Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

    <!-- React & ReactDOM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #050505;
            color: #f4f4f5;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Custom Glass & Glow Utilities */
        .glass-panel {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .neon-border-brand {
            border: 1px solid rgba(239, 68, 68, 0.5);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
        }

        .neon-border-blue {
            border: 1px solid rgba(56, 189, 248, 0.5);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .neon-border-emerald {
            border: 1px solid rgba(52, 211, 153, 0.5);
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.2);
        }

        /* Animations */
        @keyframes floatUpFade {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            100% { opacity: 0; transform: translate(-50%, -150%) scale(1.5); }
        }
        .animate-float-up {
            animation: floatUpFade 0.6s ease-out forwards;
        }

        @keyframes floatDownFade {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            100% { opacity: 0; transform: translate(-50%, 50%) scale(1.5); }
        }
        .animate-float-down {
            animation: floatDownFade 0.6s ease-out forwards;
        }

        @keyframes fadeDown {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-down {
            animation: fadeDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-fade-up {
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Scanner Effect */
        .scanner-container {
            position: relative;
            overflow: hidden;
        }

        .scanner-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 4px;
            background: #ef4444;
            box-shadow: 0 0 20px 5px rgba(239, 68, 68, 0.6);
            z-index: 20;
            animation: scanSweeper 2s ease-in-out infinite;
            opacity: 0;
        }

        @keyframes scanSweeper {
            0% {
                top: -10%;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                top: 110%;
                opacity: 0;
            }
        }

        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(239, 68, 68, 0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(239, 68, 68, 0.15) 1px, transparent 1px);
        }

        /* شاشة ما قبل اللعب الموحدة (Pro Arena Pre-Game Lobby) */
        #pa-lobby-root {
            position: fixed; inset: 0; z-index: 9999; overflow-y: auto; overflow-x: hidden; touch-action: pan-y;
            background-color: #FFF7EB;
            background-image:
                radial-gradient(circle at 10% 12%, rgba(255, 167, 38, 0.2), transparent 34%),
                radial-gradient(circle at 90% 88%, rgba(107, 139, 255, 0.14), transparent 36%),
                radial-gradient(#FF980018 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 24px 24px;
            color: #0F172A; font-family: 'Cairo', sans-serif;
            transition: opacity 0.3s ease, background-color 0.35s ease, color 0.35s ease;
            -webkit-user-select: none; user-select: none;
        }
        #pa-lobby-root.pa-hidden { opacity: 0; pointer-events: none; visibility: hidden; }
        #pa-lobby-root.pa-dark {
            background-color: #0B1120;
            background-image:
                radial-gradient(circle at 12% 12%, rgba(255, 152, 0, 0.14), transparent 36%),
                radial-gradient(circle at 88% 85%, rgba(107, 139, 255, 0.12), transparent 36%),
                radial-gradient(rgba(148, 163, 184, 0.1) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 24px 24px;
            color: #F8FAFC;
        }
        .pa-hero-stage-rect { position: relative; border-radius: 30px; background: linear-gradient(135deg, #1E293B 0%, #0F172A 65%, #1A1F35 100%); border: 2px solid rgba(255, 255, 255, 0.12); box-shadow: 0 6px 0 #090E1A, 0 22px 42px -12px rgba(15, 23, 42, 0.35); overflow: hidden; }
        #pa-lobby-root.pa-dark .pa-hero-stage-rect { background: linear-gradient(135deg, #17233B 0%, #0F172A 65%, #1C2640 100%); border-color: rgba(255, 183, 77, 0.24); box-shadow: 0 6px 0 #050811, 0 24px 44px -12px rgba(0, 0, 0, 0.65); }
        .pa-hero-stage-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px); background-size: 22px 22px; mask-image: radial-gradient(circle at 80% 30%, black 20%, transparent 78%); -webkit-mask-image: radial-gradient(circle at 80% 30%, black 20%, transparent 78%); pointer-events: none; }
        .pa-game-thumb-frame { position: relative; border-radius: 22px; border: 3px solid rgba(255, 255, 255, 0.92); box-shadow: 0 12px 24px rgba(0, 0, 0, 0.38), 0 0 0 4px rgba(255, 152, 0, 0.22); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .pa-hero-stage-rect:hover .pa-game-thumb-frame { transform: rotate(-2deg) scale(1.03); }
        .pa-tactile-exit-btn { background: linear-gradient(180deg, #F87171 0%, #EF4444 100%); color: #FFFFFF; border-radius: 16px; border: 1.5px solid rgba(255, 255, 255, 0.28); box-shadow: 0 4px 0 #991B1B, 0 8px 16px rgba(239, 68, 68, 0.35); transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.14s ease; cursor: pointer; }
        .pa-tactile-exit-btn:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 5px 0 #991B1B, 0 10px 20px rgba(239, 68, 68, 0.42); }
        .pa-tactile-exit-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #991B1B; }
        .pa-arcade-option-rect { position: relative; width: 100%; text-align: right; border-radius: 24px; background: #FFFFFF; border: 2px solid #E2E8F0; box-shadow: 0 5px 0 #CBD5E1, 0 14px 26px -12px rgba(15, 23, 42, 0.12); transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s ease, border-color 0.2s ease, background-color 0.2s ease; overflow: hidden; cursor: pointer; }
        .pa-arcade-option-rect:hover { transform: translateY(-2px); border-color: #FDBA74; box-shadow: 0 7px 0 #FDBA74, 0 18px 30px -10px rgba(255, 123, 0, 0.22); }
        .pa-arcade-option-rect:active, .pa-arcade-option-rect.pa-is-pressed { transform: translateY(4px) !important; box-shadow: 0 1px 0 #CBD5E1 !important; }
        .pa-arcade-option-rect.pa-is-featured { background: linear-gradient(135deg, #FFB03A 0%, #FF7B00 100%); border-color: #FFD180; box-shadow: 0 6px 0 #C2410C, 0 18px 32px -10px rgba(255, 123, 0, 0.46); }
        .pa-arcade-option-rect.pa-is-featured:hover { border-color: #FFE0B2; box-shadow: 0 8px 0 #C2410C, 0 22px 36px -10px rgba(255, 123, 0, 0.56); }
        .pa-arcade-option-rect.pa-is-featured:active, .pa-arcade-option-rect.pa-is-featured.pa-is-pressed { transform: translateY(5px) !important; box-shadow: 0 1px 0 #C2410C !important; }
        #pa-lobby-root.pa-dark .pa-arcade-option-rect:not(.pa-is-featured) { background: #162033; border-color: #293852; box-shadow: 0 5px 0 #0A101D, 0 16px 28px -12px rgba(0, 0, 0, 0.55); }
        #pa-lobby-root.pa-dark .pa-arcade-option-rect:not(.pa-is-featured):hover { background: #1B2840; border-color: #FF9800; box-shadow: 0 7px 0 #9A3412, 0 18px 32px -10px rgba(255, 152, 0, 0.24); }
        #pa-lobby-root.pa-dark .pa-arcade-option-rect:not(.pa-is-featured):active, #pa-lobby-root.pa-dark .pa-arcade-option-rect:not(.pa-is-featured).pa-is-pressed { box-shadow: 0 1px 0 #0A101D !important; }
        .pa-arcade-option-rect:hover .pa-opt-icon { transform: scale(1.05) rotate(-3deg); }
        .pa-arcade-option-rect:not(.pa-is-featured):hover .pa-opt-title { color: #FF9800; }
        .pa-arcade-option-rect:not(.pa-is-featured):hover .pa-enter-pill { background: #FF9800; color: #FFFFFF; }
        .pa-arcade-option-rect:not(.pa-is-featured):hover .pa-enter-pill i { transform: translateX(-2px); }
        .pa-arcade-option-rect.pa-is-featured:hover .pa-featured-pill { transform: scale(1.05); }
        .pa-rect-watermark { position: absolute; left: 68px; bottom: -14px; font-size: 4.2rem; font-weight: 900; line-height: 1; opacity: 0.055; pointer-events: none; font-family: 'Nunito', 'Cairo', sans-serif; color: #0F172A; }
        #pa-lobby-root.pa-dark .pa-rect-watermark { color: #F8FAFC; }
        .pa-arcade-option-rect.pa-is-featured .pa-rect-watermark { opacity: 0.14; color: #FFFFFF; }
        .pa-text-primary { color: #0F172A; }
        .pa-text-secondary { color: #64748B; }
        #pa-lobby-root.pa-dark .pa-text-primary { color: #F8FAFC; }
        #pa-lobby-root.pa-dark .pa-text-secondary { color: #94A3B8; }
        .pa-hint-pill { background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(226, 232, 240, 0.8); color: #64748B; }
        #pa-lobby-root.pa-dark .pa-hint-pill { background: rgba(30, 41, 59, 0.8); border-color: #334155; color: #94A3B8; }
        .pa-opt-tag { background: #FFF7ED; border: 1px solid #FFEDD5; color: #FF9800; }
        #pa-lobby-root.pa-dark .pa-opt-tag { background: #1E293B; border-color: #334155; color: #FFB74D; }
        .pa-enter-pill { background: #F1F5F9; color: #64748B; }
        #pa-lobby-root.pa-dark .pa-enter-pill { background: #1E293B; color: #94A3B8; }
        .pa-modal-card { background: #FFFFFF; border: 2px solid #F1F5F9; border-radius: 30px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        #pa-lobby-root.pa-dark .pa-modal-card { background: #162033; border-color: #293852; }
        .pa-progress-track { background: #E2E8F0; }
        #pa-lobby-root.pa-dark .pa-progress-track { background: #334155; }
        @keyframes paPopSlideIn { from { opacity: 0; transform: translateY(18px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .pa-animate-pop { opacity: 0; animation: paPopSlideIn 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        @keyframes paProgressFill { 0% { width: 8%; } 100% { width: 100%; } }
        .pa-progress-anim { animation: paProgressFill 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    </style>
</head>

<body class="m-0 h-[100dvh] overflow-hidden">

    <!-- ==================== شاشة ما قبل اللعب (Pro Arena Lobby) ==================== -->
    <div id="pa-lobby-root" dir="rtl">
        <div class="min-h-[100dvh] flex flex-col">
            <div class="w-full max-w-xl mx-auto px-4 sm:px-6 pt-5 sm:pt-8 pb-10 flex-1 flex flex-col gap-6">
                <section id="pa-game-header-rect" class="pa-animate-pop pa-hero-stage-rect" style="animation-delay: 0.02s;">
                    <div class="pa-hero-stage-grid"></div>
                    <div class="absolute -top-14 -right-14 w-48 h-48 rounded-full blur-3xl pointer-events-none" style="background: rgba(239, 68, 68, 0.32);"></div>
                    <div class="absolute -bottom-16 -left-12 w-44 h-44 rounded-full blur-3xl pointer-events-none" style="background: rgba(147, 51, 234, 0.25);"></div>
                    <img id="pa-hero-cover-img" alt="" class="hidden absolute inset-0 w-full h-full object-cover opacity-20 mix-blend-luminosity pointer-events-none">

                    <div class="relative z-10 p-4 sm:p-5">
                        <div class="flex items-center justify-between gap-3.5 sm:gap-4">
                            <div class="flex items-center gap-3.5 sm:gap-4 min-w-0 flex-1">
                                <div id="pa-game-image-box" class="pa-game-thumb-frame w-20 h-20 sm:w-[88px] sm:h-[88px] shrink-0 overflow-hidden flex items-center justify-center" style="background: linear-gradient(135deg, #DC2626, #9333EA);">
                                    <img id="pa-game-image" src="" alt="لعبة المافيا" class="hidden w-full h-full object-cover relative z-10" onerror="paHandleGameImageError()">
                                    <div id="pa-game-image-placeholder" class="w-full h-full flex items-center justify-center relative z-10">
                                        <i id="pa-game-icon" class="fa-solid fa-user-secret text-4xl sm:text-5xl text-white drop-shadow-md"></i>
                                    </div>
                                </div>
                                <div class="min-w-0 flex-1">
                                    <span class="inline-flex items-center gap-1.5 text-[10px] sm:text-[11px] font-black px-2.5 py-0.5 rounded-lg mb-1.5" style="background: rgba(255, 152, 0, 0.2); color: #FCD34D; border: 1px solid rgba(255, 152, 0, 0.3);">
                                        <i class="fa-solid fa-sparkles text-[9px]"></i>
                                        <span id="pa-game-badge-text">جماعية • غموض</span>
                                    </span>
                                    <h1 id="pa-game-name" class="text-xl sm:text-2xl md:text-3xl font-black text-white leading-tight truncate">لعبة المافيا</h1>
                                    <p id="pa-game-desc" class="text-[11px] sm:text-xs font-bold text-slate-300 mt-1 line-clamp-1">اكشف المافيا قبل فوات الأوان في بروتوكول التحقيق</p>
                                </div>
                            </div>
                            <button type="button" onclick="proArenaExitToApp()" class="pa-tactile-exit-btn h-12 px-3.5 sm:px-4 flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2 shrink-0" aria-label="خروج" title="خروج والعودة للقائمة">
                                <i class="fa-solid fa-right-from-bracket text-base"></i>
                                <span class="text-[11px] sm:text-xs font-black leading-none">خروج</span>
                            </button>
                        </div>
                    </div>
                </section>

                <section class="flex-1 flex flex-col gap-3.5">
                    <div class="pa-animate-pop flex items-center justify-between px-1" style="animation-delay: 0.08s;">
                        <div class="flex items-center gap-2">
                            <div class="w-7 h-7 rounded-xl flex items-center justify-center text-xs shadow-sm" style="background: rgba(255, 152, 0, 0.15); color: #FF9800;">
                                <i class="fa-solid fa-layer-group"></i>
                            </div>
                            <h2 class="text-base sm:text-lg font-black pa-text-primary">خيارات اللعب</h2>
                        </div>
                        <span class="pa-hint-pill text-[11px] font-black px-3 py-1 rounded-full">انقر للدخول مباشرة</span>
                    </div>
                    <div id="pa-play-options-container" class="flex flex-col gap-4"></div>
                </section>
            </div>
        </div>

        <div id="pa-launch-overlay" class="fixed inset-0 z-[10050] bg-slate-950/70 backdrop-blur-md flex items-center justify-center p-5 opacity-0 pointer-events-none transition-opacity duration-300">
            <div id="pa-launch-card" class="pa-modal-card w-full max-w-sm p-7 text-center transform scale-95 transition-transform duration-300">
                <div id="pa-launch-icon-box" class="w-20 h-20 rounded-[24px] mx-auto mb-4 flex items-center justify-center text-white text-3xl shadow-xl" style="background: linear-gradient(135deg, #DC2626, #9333EA);">
                    <i id="pa-launch-icon" class="fa-solid fa-play"></i>
                </div>
                <h3 id="pa-launch-title" class="text-xl font-black pa-text-primary mb-1">جاري الدخول للعب...</h3>
                <p id="pa-launch-subtitle" class="text-xs font-bold pa-text-secondary mb-5">يتم تجهيز الجولة الآن</p>
                <div class="pa-progress-track w-full h-3 rounded-full overflow-hidden p-0.5">
                    <div id="pa-launch-progress" class="h-full rounded-full w-0" style="background: linear-gradient(to left, #FFB347, #FF7B00);"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="root" class="h-full"></div>

    <script>
        const PA_GAME_TEMPLATE = {
            name: 'لعبة المافيا',
            description: 'اكشف المافيا قبل فوات الأوان في بروتوكول التحقيق السري',
            badge: 'جماعية • غموض',
            image: '',
            icon: 'fa-solid fa-user-secret',
            accentGradient: 'linear-gradient(135deg, #DC2626, #9333EA)',
            options: [
                {
                    id: 'classic',
                    title: 'الجلسة الكلاسيكية (4–6 لاعبين)',
                    desc: '1 مافيا، 1 محقق، 1 طبيب — إعداد متوازن ومثالي لبداية سريعة',
                    tag: 'مقترح',
                    featured: true,
                    icon: 'fa-solid fa-user-secret',
                    iconBg: 'linear-gradient(135deg, #FBBF24, #F97316)'
                },
                {
                    id: 'large',
                    title: 'جلسة جماعية كبيرة (7+ لاعبين)',
                    desc: '2 مافيا، 1 محقق، 1 طبيب — إثارة مضاعفة للجلسات الكبيرة',
                    tag: 'جماعية',
                    featured: false,
                    icon: 'fa-solid fa-users',
                    iconBg: 'linear-gradient(135deg, #9333EA, #4F46E5)'
                },
                {
                    id: 'quick',
                    title: 'جولة سريعة (مافيا ضد المواطنين)',
                    desc: '1 مافيا بدون أدوار خاصة — تركيز كامل على التحقيق والإقناع',
                    tag: 'سريع',
                    featured: false,
                    icon: 'fa-solid fa-bolt',
                    iconBg: 'linear-gradient(135deg, #EF4444, #B91C1C)'
                },
                {
                    id: 'custom',
                    title: 'إعداد مخصص للأدوار',
                    desc: 'تحكم بالكامل في عدد المافيا والمحققين والأطباء وأفراد الجلسة',
                    tag: 'مخصص',
                    featured: false,
                    icon: 'fa-solid fa-sliders',
                    iconBg: 'linear-gradient(135deg, #0EA5E9, #2563EB)'
                }
            ]
        };

        let paIsEntering = false;
        let paCurrentDark = null;
        let paSoundEnabled = true;
        let paAudioCtx = null;
        window.__PA_PENDING_OPTION = null;

        function paApplyThemeState(isDark) {
            paCurrentDark = !!isDark;
            const root = document.getElementById('pa-lobby-root');
            if (root) root.classList.toggle('pa-dark', paCurrentDark);
        }

        function paApplySoundState(enabled) {
            paSoundEnabled = !!enabled;
        }

        function paSyncTheme() {
            if (paCurrentDark !== null) {
                paApplyThemeState(paCurrentDark);
                return;
            }
            let isDark = false;
            let isSoundOn = true;
            try {
                const params = new URLSearchParams(window.location.search);
                const pTheme = params.get('paTheme') || params.get('theme');
                if (pTheme === 'dark' || pTheme === 'light') isDark = pTheme === 'dark';
                else isDark = localStorage.getItem('pro-arena-darkmode') === 'true';
                const pSound = params.get('paSound');
                if (pSound === '0' || pSound === '1') isSoundOn = pSound === '1';
                else isSoundOn = localStorage.getItem('pro-arena-sound') !== 'false';
            } catch (e) { }
            paApplyThemeState(isDark);
            paApplySoundState(isSoundOn);
        }

        function paPlaySound(type = 'click') {
            if (!paSoundEnabled) return;
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!paAudioCtx) paAudioCtx = new Ctx();
                if (paAudioCtx.state === 'suspended') paAudioCtx.resume();
                const osc = paAudioCtx.createOscillator();
                const gain = paAudioCtx.createGain();
                osc.connect(gain); gain.connect(paAudioCtx.destination);
                const now = paAudioCtx.currentTime;
                if (type === 'enter') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(420, now);
                    osc.frequency.exponentialRampToValueAtTime(840, now + 0.14);
                    gain.gain.setValueAtTime(0.09, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
                    osc.start(now); osc.stop(now + 0.22);
                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(240, now + 0.06);
                    gain.gain.setValueAtTime(0.07, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
                    osc.start(now); osc.stop(now + 0.06);
                }
            } catch (e) { }
        }

        function paEscapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function paHandleGameImageError() {
            const img = document.getElementById('pa-game-image');
            const ph = document.getElementById('pa-game-image-placeholder');
            if (img) img.classList.add('hidden');
            if (ph) ph.classList.remove('hidden');
        }

        function renderProArenaLobby() {
            document.getElementById('pa-game-name').textContent = PA_GAME_TEMPLATE.name;
            document.getElementById('pa-game-desc').textContent = PA_GAME_TEMPLATE.description;
            document.getElementById('pa-game-badge-text').textContent = PA_GAME_TEMPLATE.badge;
            const container = document.getElementById('pa-play-options-container');
            container.innerHTML = PA_GAME_TEMPLATE.options.map((opt, idx) => {
                const isFeatured = Boolean(opt.featured);
                const orderNum = String(idx + 1).padStart(2, '0');
                if (isFeatured) {
                    return `
                        <button type="button" onclick="paEnterGameWithOption('${paEscapeHtml(opt.id)}', this)"
                            class="pa-animate-pop pa-arcade-option-rect pa-is-featured p-4 sm:p-5 flex items-center justify-between gap-3.5 sm:gap-4"
                            style="animation-delay: ${0.12 + idx * 0.06}s;">
                            <span class="pa-rect-watermark" aria-hidden="true">${orderNum}</span>
                            <div class="pa-opt-icon w-14 h-14 sm:w-[60px] sm:h-[60px] rounded-2xl bg-white/20 backdrop-blur-sm border-2 border-white/40 text-white flex items-center justify-center shrink-0 shadow-inner transition-transform relative z-10">
                                <i class="${opt.icon} text-2xl drop-shadow-sm"></i>
                            </div>
                            <div class="flex-1 min-w-0 relative z-10">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <h3 class="font-black text-base sm:text-lg text-white leading-snug">${paEscapeHtml(opt.title)}</h3>
                                    ${opt.tag ? `<span class="text-[10px] font-black px-2.5 py-0.5 rounded-lg bg-black/20 text-white border border-white/25">${paEscapeHtml(opt.tag)}</span>` : ''}
                                </div>
                                <p class="text-xs font-bold text-white/90 mt-1 truncate">${paEscapeHtml(opt.desc)}</p>
                            </div>
                            <div class="pa-featured-pill h-11 px-4 rounded-2xl bg-white font-black text-xs sm:text-sm flex items-center gap-1.5 shrink-0 shadow-md transition-transform relative z-10" style="color: #EA580C;">
                                <span>العب</span>
                                <i class="fa-solid fa-play text-[10px] rotate-180"></i>
                            </div>
                        </button>`;
                }
                return `
                    <button type="button" onclick="paEnterGameWithOption('${paEscapeHtml(opt.id)}', this)"
                        class="pa-animate-pop pa-arcade-option-rect p-4 sm:p-5 flex items-center justify-between gap-3.5 sm:gap-4"
                        style="animation-delay: ${0.12 + idx * 0.06}s;">
                        <span class="pa-rect-watermark" aria-hidden="true">${orderNum}</span>
                        <div class="pa-opt-icon w-14 h-14 rounded-2xl text-white flex items-center justify-center shrink-0 shadow-md border-2 border-white/40 transition-transform relative z-10" style="background: ${opt.iconBg};">
                            <i class="${opt.icon} text-xl drop-shadow-sm"></i>
                        </div>
                        <div class="flex-1 min-w-0 relative z-10">
                            <div class="flex items-center gap-2 flex-wrap">
                                <h3 class="pa-opt-title font-black text-sm sm:text-base pa-text-primary transition-colors leading-snug">${paEscapeHtml(opt.title)}</h3>
                                ${opt.tag ? `<span class="pa-opt-tag text-[10px] font-black px-2.5 py-0.5 rounded-lg">${paEscapeHtml(opt.tag)}</span>` : ''}
                            </div>
                            <p class="text-[11px] sm:text-xs font-bold pa-text-secondary mt-1 truncate">${paEscapeHtml(opt.desc)}</p>
                        </div>
                        <div class="pa-enter-pill h-10 px-3.5 rounded-2xl font-black text-xs flex items-center gap-1.5 shrink-0 transition-all relative z-10">
                            <span class="hidden sm:inline">دخول</span>
                            <i class="fa-solid fa-chevron-left text-[11px] transition-transform"></i>
                        </div>
                    </button>`;
            }).join('');
        }

        function paEnterGameWithOption(optionId, cardEl) {
            if (paIsEntering) return;
            const option = PA_GAME_TEMPLATE.options.find(item => item.id === optionId);
            if (!option) return;
            paIsEntering = true;
            paPlaySound('enter');
            if (cardEl) cardEl.classList.add('pa-is-pressed');

            const overlay = document.getElementById('pa-launch-overlay');
            const card = document.getElementById('pa-launch-card');
            const iconBox = document.getElementById('pa-launch-icon-box');
            const icon = document.getElementById('pa-launch-icon');
            const progress = document.getElementById('pa-launch-progress');
            iconBox.style.background = option.iconBg;
            icon.className = option.icon;
            document.getElementById('pa-launch-title').textContent = 'جاري الدخول للعب...';
            document.getElementById('pa-launch-subtitle').textContent = option.title;
            progress.classList.remove('pa-progress-anim');
            void progress.offsetWidth;
            progress.classList.add('pa-progress-anim');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-95'); card.classList.add('scale-100');

            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'PRO_ARENA_ENTER_GAME', gameName: PA_GAME_TEMPLATE.name, optionId: option.id, optionTitle: option.title }, '*');
                }
            } catch (e) { }

            setTimeout(() => {
                if (typeof window.PA_ON_SELECT_OPTION === 'function') window.PA_ON_SELECT_OPTION(optionId);
                else window.__PA_PENDING_OPTION = optionId;

                overlay.classList.add('opacity-0', 'pointer-events-none');
                card.classList.add('scale-95'); card.classList.remove('scale-100');
                document.getElementById('pa-lobby-root').classList.add('pa-hidden');
                paIsEntering = false;
                document.querySelectorAll('.pa-is-pressed').forEach(el => el.classList.remove('pa-is-pressed'));
            }, 430);
        }

        function showProArenaLobby() {
            paIsEntering = false;
            paSyncTheme();
            const root = document.getElementById('pa-lobby-root');
            if (root) { root.scrollTop = 0; root.classList.remove('pa-hidden'); }
        }

        function proArenaExitToApp() {
            paPlaySound('click');
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'PRO_ARENA_EXIT_GAME' }, '*');
                    if (typeof window.parent.confirmExit === 'function') window.parent.confirmExit(true);
                    return;
                }
            } catch (e) { return; }
            if (window.history.length > 1) window.history.back();
            else window.location.href = '../index.html';
        }

        paSyncTheme();
        renderProArenaLobby();
        window.addEventListener('storage', (e) => {
            if (e.key === 'pro-arena-darkmode') paApplyThemeState(e.newValue === 'true');
            if (e.key === 'pro-arena-sound') paApplySoundState(e.newValue !== 'false');
        });
        window.addEventListener('message', (e) => {
            if (!e || !e.data || typeof e.data !== 'object') return;
            if (e.data.type === 'PRO_ARENA_THEME_CHANGE') {
                paApplyThemeState(!!e.data.isDark);
            } else if (e.data.type === 'set_theme') {
                paApplyThemeState(e.data.theme === 'dark');
            } else if (e.data.type === 'PRO_ARENA_SOUND_CHANGE') {
                paApplySoundState(!!e.data.enabled);
            }
        });
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const shuffleArray = (array) => {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        };

        const ROLES = {
            MAFIA: { id: 'mafia', name: 'المافيا', icon: 'fa-user-secret', color: 'text-brand', style: 'neon-border-brand bg-brand/10' },
            DETECTIVE: { id: 'detective', name: 'المحقق', icon: 'fa-shield-halved', color: 'text-sky-400', style: 'neon-border-blue bg-sky-500/10' },
            DOCTOR: { id: 'doctor', name: 'الطبيب', icon: 'fa-heart-pulse', color: 'text-emerald-400', style: 'neon-border-emerald bg-emerald-500/10' },
            CITIZEN: { id: 'citizen', name: 'مواطن عادي', icon: 'fa-user', color: 'text-zinc-400', style: 'border border-zinc-700 bg-zinc-800/30' }
        };

        function App() {
            const [isGlassMode, setIsGlassMode] = useState(true);
            const [gameState, setGameState] = useState('setup');
            const [players, setPlayers] = useState([
                { id: 1, name: '', role: null, isAlive: true, isMarked: false },
                { id: 2, name: '', role: null, isAlive: true, isMarked: false },
                { id: 3, name: '', role: null, isAlive: true, isMarked: false },
                { id: 4, name: '', role: null, isAlive: true, isMarked: false }
            ]);
            const [roleCounts, setRoleCounts] = useState({ mafia: 1, detective: 1, doctor: 1 });
            const [errorMsg, setErrorMsg] = useState('');

            const [currentPlayerIndex, setCurrentPlayerIndex] = useState(0);
            const [eliminatedPlayer, setEliminatedPlayer] = useState(null);
            const [gameWinner, setGameWinner] = useState(null);
            const [exitExpanded, setExitExpanded] = useState(false);
            const [openRoleSettingsTrigger, setOpenRoleSettingsTrigger] = useState(0);

            useEffect(() => {
                const applyOption = (optId) => {
                    setExitExpanded(false);
                    setErrorMsg('');
                    setGameState('setup');
                    const makeSlots = (count) => Array.from({ length: count }, (_, idx) => ({
                        id: Date.now() + idx,
                        name: '',
                        role: null,
                        isAlive: true,
                        isMarked: false
                    }));
                    if (optId === 'large') {
                        setPlayers(makeSlots(7));
                        setRoleCounts({ mafia: 2, detective: 1, doctor: 1 });
                    } else if (optId === 'quick') {
                        setPlayers(makeSlots(4));
                        setRoleCounts({ mafia: 1, detective: 0, doctor: 0 });
                    } else if (optId === 'custom') {
                        setPlayers(makeSlots(5));
                        setRoleCounts({ mafia: 1, detective: 1, doctor: 1 });
                        setOpenRoleSettingsTrigger(t => t + 1);
                    } else {
                        setPlayers(makeSlots(4));
                        setRoleCounts({ mafia: 1, detective: 1, doctor: 1 });
                    }
                };
                window.PA_ON_SELECT_OPTION = applyOption;
                if (window.__PA_PENDING_OPTION) {
                    const pending = window.__PA_PENDING_OPTION;
                    window.__PA_PENDING_OPTION = null;
                    applyOption(pending);
                }
            }, []);

            useEffect(() => {
                if (gameState === 'moderator') {
                    const alive = players.filter(p => p.isAlive);
                    if (alive.length > 0) {
                        const mafiaCount = alive.filter(p => p.role?.id === 'mafia').length;
                        const othersCount = alive.length - mafiaCount;
                        if (mafiaCount === 0) {
                            setGameWinner('citizens');
                            setTimeout(() => setGameState('game-over'), 800);
                        } else if (mafiaCount >= othersCount) {
                            setGameWinner('mafia');
                            setTimeout(() => setGameState('game-over'), 800);
                        }
                    }
                }
            }, [gameState, players]);

            useEffect(() => {
                if (errorMsg) {
                    const timer = setTimeout(() => setErrorMsg(''), 3000);
                    return () => clearTimeout(timer);
                }
            }, [errorMsg]);

            const handleAddPlayer = () => {
                setPlayers([...players, { id: Date.now(), name: '', role: null, isAlive: true, isMarked: false }]);
            };

            const handleRemovePlayer = (id) => {
                if (players.length <= 3) return;
                setPlayers(players.filter(p => p.id !== id));
            };

            const handleNameChange = (id, newName) => {
                setPlayers(players.map(p => p.id === id ? { ...p, name: newName } : p));
            };

            const startGame = () => {
                const emptyNames = players.some(p => p.name.trim() === '');
                if (emptyNames) {
                    setErrorMsg('النظام يرفض الهويات المجهولة. أدخل جميع الأسماء.');
                    return;
                }

                const specialRolesCount = roleCounts.mafia + roleCounts.detective + roleCounts.doctor;
                if (players.length < specialRolesCount) {
                    setErrorMsg(`عدد الأدوار (${specialRolesCount}) أكبر من عدد الأفراد (${players.length}).`);
                    return;
                }

                let rolePool = [];
                for (let i = 0; i < roleCounts.mafia; i++) rolePool.push(ROLES.MAFIA);
                for (let i = 0; i < roleCounts.detective; i++) rolePool.push(ROLES.DETECTIVE);
                for (let i = 0; i < roleCounts.doctor; i++) rolePool.push(ROLES.DOCTOR);

                const citizensCount = players.length - specialRolesCount;
                for (let i = 0; i < citizensCount; i++) rolePool.push(ROLES.CITIZEN);

                rolePool = shuffleArray(rolePool);

                const assignedPlayers = players.map((p, index) => ({
                    ...p,
                    role: rolePool[index]
                }));

                setPlayers(assignedPlayers);
                setCurrentPlayerIndex(0);
                setErrorMsg('');
                setGameState('assignment');
            };

            const resetGame = () => {
                if (window.confirm('إلغاء العملية والعودة للمربع الأول؟')) {
                    setGameState('setup');
                    setPlayers(players.map(p => ({ ...p, role: null, isAlive: true, isMarked: false })));
                    setCurrentPlayerIndex(0);
                }
            };

            return (
                <div className={`h-full w-full flex justify-center relative overflow-hidden transition-colors duration-700 ${isGlassMode ? 'bg-[#140a05]' : 'bg-[#050505]'}`} onClick={() => exitExpanded && setExitExpanded(false)}>
                    {isGlassMode && (
                        <div className="absolute inset-0 z-0 opacity-60 pointer-events-none" style={{ backgroundImage: 'radial-gradient(at 20% 20%, rgba(239, 68, 68, 0.15) 0px, transparent 50%), radial-gradient(at 80% 80%, rgba(14, 165, 233, 0.15) 0px, transparent 50%)' }}></div>
                    )}
                    <div className="absolute inset-0 bg-grid opacity-80 z-0 pointer-events-none" style={{ backgroundPosition: 'center' }}></div>
                    <div className="absolute top-[-20%] left-[-10%] w-[70%] h-[50%] bg-blue-900/10 blur-[120px] rounded-full pointer-events-none z-0"></div>
                    <div className="absolute bottom-[-20%] right-[-10%] w-[70%] h-[50%] bg-brand/10 blur-[120px] rounded-full pointer-events-none z-0"></div>

                    <div className={`w-full max-w-md md:max-w-xl h-full relative z-10 flex flex-col border-x shadow-2xl transition-all duration-700 ${isGlassMode ? 'bg-black/20 backdrop-blur-xl border-white/10' : 'bg-black/40 backdrop-blur-sm border-white/5'}`}>

                        {/* شريط التحكم العلوي: زر الخروج الموحد والمنسق بطابع المافيا */}
                        <div className="px-4 pt-3.5 pb-1 flex items-center justify-end shrink-0 z-30" onClick={(e) => e.stopPropagation()}>
                            <div className={`glass-panel neon-border-brand rounded-xl h-10 flex items-center overflow-hidden transition-all duration-300 ${exitExpanded ? 'w-[154px] pl-1.5' : 'w-10'}`}>
                                <button
                                    type="button"
                                    onClick={() => setExitExpanded(!exitExpanded)}
                                    className="w-10 h-10 shrink-0 flex items-center justify-center text-brand hover:bg-brand/10 transition-colors"
                                    aria-label="خروج من اللعبة"
                                    title="خروج من اللعبة"
                                >
                                    <i className={`fa-solid ${exitExpanded ? 'fa-times' : 'fa-door-open'} text-base`}></i>
                                </button>
                                {exitExpanded && (
                                    <div className="flex items-center gap-2 whitespace-nowrap">
                                        <span className="text-xs font-black text-zinc-200">خروج؟</span>
                                        <button
                                            type="button"
                                            onClick={() => {
                                                setExitExpanded(false);
                                                setErrorMsg('');
                                                setGameState('setup');
                                                setPlayers(players.map(p => ({ ...p, role: null, isAlive: true, isMarked: false })));
                                                setCurrentPlayerIndex(0);
                                                if (window.showProArenaLobby) window.showProArenaLobby();
                                            }}
                                            className="px-2.5 py-1 rounded-lg bg-brand hover:bg-brand-light text-white text-[11px] font-black shadow-[0_0_12px_rgba(239,68,68,0.45)] transition-colors"
                                        >
                                            نعم
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>

                        {(gameState === 'setup' || gameState === 'moderator') && (
                            <header className="px-6 pt-2 pb-5 shrink-0 w-full flex justify-center relative min-h-[82px] items-center">
                                {errorMsg && gameState === 'setup' ? (
                                    <div className="absolute inset-0 flex items-center justify-center px-6 animate-pop z-20">
                                        <div className="glass-panel border border-brand/50 bg-[#050505]/90 text-brand py-3 px-4 rounded-2xl text-sm flex items-center justify-center gap-3 shadow-[0_0_30px_rgba(239,68,68,0.3)] w-full">
                                            <i className="fa-solid fa-circle-exclamation text-lg animate-pulse"></i>
                                            <p className="font-bold tracking-wide">{errorMsg}</p>
                                        </div>
                                    </div>
                                ) : (
                                    <h1 className="text-4xl md:text-5xl font-black text-brand drop-shadow-[0_0_20px_rgba(239,68,68,0.8)] w-full text-center animate-fade-up">
                                        الــــمــــافــــيــــا
                                    </h1>
                                )}
                            </header>
                        )}

                        <main className="flex-1 overflow-y-auto scrollbar-hide relative pb-6">
                            {gameState === 'setup' && (
                                <SetupPhase
                                    players={players}
                                    roleCounts={roleCounts}
                                    setRoleCounts={setRoleCounts}
                                    handleAddPlayer={handleAddPlayer}
                                    handleRemovePlayer={handleRemovePlayer}
                                    handleNameChange={handleNameChange}
                                    startGame={startGame}
                                    errorMsg={errorMsg}
                                    isGlassMode={isGlassMode}
                                    setIsGlassMode={setIsGlassMode}
                                    openRoleSettingsTrigger={openRoleSettingsTrigger}
                                />
                            )}

                            {gameState === 'assignment' && (
                                <AssignmentPhase
                                    player={players[currentPlayerIndex]}
                                    onNext={() => {
                                        if (currentPlayerIndex < players.length - 1) {
                                            setCurrentPlayerIndex(prev => prev + 1);
                                        } else {
                                            setGameState('moderator');
                                        }
                                    }}
                                    onCancel={resetGame}
                                    isLast={currentPlayerIndex === players.length - 1}
                                    totalPlayers={players.length}
                                    currentIndex={currentPlayerIndex}
                                />
                            )}

                            {gameState === 'moderator' && (
                                <ModeratorPhase
                                    players={players}
                                    onGoToElimination={() => setGameState('elimination')}
                                    onReset={resetGame}
                                    onManualEnd={(winner) => {
                                        setGameWinner(winner);
                                        setGameState('game-over');
                                    }}
                                    onRevive={(id) => {
                                        if (window.confirm('تصريح بالإنعاش؟')) {
                                            setPlayers(players.map(p => p.id === id ? { ...p, isAlive: true, isMarked: false } : p));
                                        }
                                    }}
                                    onToggleMark={(id) => {
                                        setPlayers(players.map(p => p.id === id ? { ...p, isMarked: !p.isMarked } : p));
                                    }}
                                    isGlassMode={isGlassMode}
                                    setIsGlassMode={setIsGlassMode}
                                />
                            )}

                            {gameState === 'elimination' && (
                                <EliminationPhase
                                    players={players}
                                    onEliminate={(id) => {
                                        const p = players.find(p => p.id === id);
                                        setEliminatedPlayer(p);
                                        setPlayers(players.map(p => p.id === id ? { ...p, isAlive: false } : p));
                                        setGameState('animation');
                                    }}
                                    onCancel={() => setGameState('moderator')}
                                />
                            )}
                        </main>

                        {gameState === 'animation' && eliminatedPlayer && (
                            <div className="absolute inset-0 z-50 bg-[#050505]/95 backdrop-blur-xl flex flex-col items-center justify-center p-6">
                                <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(239,68,68,0.15)_0%,transparent_70%)]"></div>

                                <div className="relative z-10 flex flex-col items-center text-center animate-pop">
                                    <div className="w-32 h-32 mb-8 rounded-full neon-border-brand bg-brand/10 flex items-center justify-center relative overflow-hidden shadow-2xl">
                                        <div className="absolute inset-0 border-4 border-brand rounded-full animate-[spin_4s_linear_infinite] border-t-transparent border-l-transparent opacity-50"></div>
                                        <i className="fa-solid fa-skull text-6xl text-brand z-10 drop-shadow-[0_0_15px_rgba(239,68,68,0.8)]"></i>
                                    </div>

                                    <div className="bg-brand/20 text-brand px-4 py-1 rounded-full text-[10px] font-bold tracking-widest uppercase mb-4 border border-brand/30">Target Eliminated</div>
                                    <h2 className="text-4xl font-black text-white mb-8">{eliminatedPlayer.name}</h2>

                                    <div className="glass-panel px-6 py-4 rounded-2xl flex flex-col items-center gap-2 min-w-[250px]">
                                        <span className="text-zinc-400 text-xs uppercase tracking-wider">الهوية المكتشفة</span>
                                        <span className={`font-black text-2xl ${eliminatedPlayer.role.color} flex items-center gap-3`}>
                                            <i className={`fa-solid ${eliminatedPlayer.role.icon}`}></i>
                                            {eliminatedPlayer.role.name}
                                        </span>
                                    </div>

                                    <button
                                        onClick={() => {
                                            setGameState('moderator');
                                            setEliminatedPlayer(null);
                                        }}
                                        className="mt-12 glass-panel hover:bg-white/10 text-white font-bold py-4 px-10 rounded-2xl flex items-center gap-3 text-lg opacity-0 transition-colors"
                                        style={{ animation: 'fadeUp 0.5s ease-out 1.5s forwards' }}
                                    >
                                        إغلاق الملف <i className="fa-solid fa-check"></i>
                                    </button>
                                </div>
                            </div>
                        )}

                        {gameState === 'game-over' && (
                            <GameOverPhase winner={gameWinner} onReset={resetGame} />
                        )}
                    </div>
                </div>
            );
        }

        function SetupPhase({ players, roleCounts, setRoleCounts, handleAddPlayer, handleRemovePlayer, handleNameChange, startGame, errorMsg, isGlassMode, setIsGlassMode, openRoleSettingsTrigger }) {
            const [showMenu, setShowMenu] = useState(false);
            const [clickAnims, setClickAnims] = useState([]);

            useEffect(() => {
                if (openRoleSettingsTrigger > 0) setShowMenu(true);
            }, [openRoleSettingsTrigger]);

            const triggerAnim = (roleId, type) => {
                const id = Date.now() + Math.random();
                setClickAnims(prev => [...prev, { id, roleId, type }]);
                setTimeout(() => {
                    setClickAnims(prev => prev.filter(anim => anim.id !== id));
                }, 600);
            };

            return (
                <div className="px-6 min-h-full flex flex-col animate-fade-up">
                    <div className="space-y-8 flex-1 mt-4">
                        <section>
                            <div className="flex items-center justify-between mb-4">
                                <h2 className="text-sm font-bold text-zinc-400 flex items-center gap-2 uppercase tracking-wider">
                                    <i className="fa-solid fa-users text-sky-500"></i> المشتبه بهم
                                </h2>

                    <div className="mt-8 flex justify-center w-full shrink-0 pb-6 z-30">

                            <button onClick={() => setShowMenu(true)} className="w-14 h-14 shrink-0 rounded-2xl flex items-center justify-center text-zinc-400 hover:bg-white/10 hover:text-white transition-colors bg-black/50">

                                                { id: 'mafia', label: 'مافيا', icon: 'fa-user-secret', color: 'text-brand', bg: 'bg-brand/10', border: 'border-brand/30' },

                                                <div 
                                                    key={role.id} 
                                                    className={`glass-panel rounded-2xl p-3 flex flex-col items-center border relative cursor-pointer transition-colors ${role.border} ${role.bg} hover:bg-white/5`}

                                                        setRoleCounts(p => ({ ...p, [role.id]: p[role.id] + 1 }));
                                                        triggerAnim(role.id, 'plus');
                                                    }}

                                                    <button 
                                                        className="absolute top-1.5 right-1.5 w-5 h-5 rounded-md bg-black/60 border border-white/10 flex items-center justify-center text-zinc-400 hover:text-white hover:bg-red-500/50 z-20 transition-colors"
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            if (roleCounts[role.id] > 0) {
                                                                setRoleCounts(p => ({ ...p, [role.id]: p[role.id] - 1 }));
                                                                triggerAnim(role.id, 'minus');

        }

        function AssignmentPhase({ player, onNext, onCancel, isLast, totalPlayers, currentIndex }) {
            const [isScanning, setIsScanning] = useState(false);
            const [hasScanned, setHasScanned] = useState(false);
            const [displayRole, setDisplayRole] = useState(null);

            useEffect(() => {
                if (isScanning) {
                    const roleKeys = Object.keys(ROLES);
                    let i = 0;
                    let speed = 40;

                    const cycleRole = () => {
                        setDisplayRole(ROLES[roleKeys[i % roleKeys.length]]);
                        i++;
                        if (i < 30) {
                            setTimeout(cycleRole, speed);
                            if (i > 20) speed += 30;
                        } else {
                            setDisplayRole(player.role);
                            setIsScanning(false);
                            setHasScanned(true);
                        }
                    };

                    cycleRole();
                }
            }, [isScanning, player.role]);

            useEffect(() => {
                setIsScanning(false);
                setHasScanned(false);
                setDisplayRole(null);
            }, [player.id]);

            return (
                <div className="min-h-full flex flex-col px-6 py-4 animate-fade-up">
                    <div className="flex items-center justify-between mb-8 glass-panel p-2 rounded-2xl">
                        <div className="flex-1 px-4 flex justify-center gap-1.5">
                            {Array.from({ length: totalPlayers }).map((_, idx) => (
                                <div key={idx} className={`h-1.5 rounded-full transition-all duration-500 ${idx === currentIndex ? 'w-8 bg-sky-500 shadow-[0_0_8px_rgba(14,165,233,0.8)]' : idx < currentIndex ? 'w-2 bg-sky-900' : 'w-2 bg-zinc-800'}`} />
                            ))}
                        </div>
                        <div className="w-10 h-10 flex items-center justify-center text-zinc-500 font-mono text-xs">
                            {currentIndex + 1}/{totalPlayers}
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col items-center justify-center w-full max-w-sm mx-auto">
                        <div className={`w-full aspect-[3/4] rounded-3xl transition-all duration-500 scanner-container flex flex-col items-center p-6 border border-white/10 ${!hasScanned && !isScanning ? 'glass-panel' :
                            isScanning ? 'bg-black border-brand/50 shadow-[0_0_30px_rgba(239,68,68,0.2)]' :
                                `glass-panel ${displayRole?.style}`
                            }`}>

                            <div className="absolute top-4 left-4 w-8 h-8 border-t-2 border-l-2 border-white/20 rounded-tl-lg"></div>
                            <div className="absolute bottom-4 right-4 w-8 h-8 border-b-2 border-r-2 border-white/20 rounded-br-lg"></div>
                            <div className="absolute top-4 right-4 w-8 h-8 border-t-2 border-r-2 border-white/20 rounded-tr-lg"></div>
                            <div className="absolute bottom-4 left-4 w-8 h-8 border-b-2 border-l-2 border-white/20 rounded-bl-lg"></div>

                            <div className="text-center mt-2 z-10 w-full animate-fade-up">
                                <p className="text-sky-500 text-[10px] font-bold tracking-[0.3em] uppercase mb-2 font-mono">
                                    <i className="fa-solid fa-satellite-dish mr-1"></i> فحص بيومتري لـ
                                </p>
                                <h2 className="text-4xl font-black text-white">{player.name}</h2>
                            </div>

                            {isScanning && <div className="scanner-line"></div>}

                            <div className="flex-1 flex flex-col items-center justify-center w-full z-10 pb-10">
                                {!isScanning && !hasScanned ? (
                                    <div className="flex flex-col items-center text-zinc-600 animate-pulse mt-4">
                                        <i className="fa-solid fa-fingerprint text-[5rem] mb-6"></i>
                                        <p className="text-sm font-bold tracking-wide">النظام بانتظار البصمة</p>
                                    </div>
                                ) : (
                                    <div className="flex flex-col items-center text-center z-10 w-full mt-4">
                                        {displayRole && (
                                            <i className={`fa-solid ${displayRole.icon} text-[5rem] mb-6 ${displayRole.color} ${isScanning ? 'opacity-30 blur-sm' : 'opacity-100 animate-pop drop-shadow-[0_0_15px_currentColor]'}`}></i>
                                        )}
                                        <div className="w-full">
                                            <p className="text-[10px] uppercase tracking-[0.2em] text-zinc-500 mb-2 font-mono">CONFIRMED IDENTITY</p>
                                            <h3 className={`text-4xl font-black ${displayRole?.color} ${isScanning ? 'blur-md opacity-50' : 'animate-pop'}`}>
                                                {displayRole?.name}
                                            </h3>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    <div className="mt-auto pt-8 flex justify-center w-full shrink-0">
                        <div className="w-full">
                            {!isScanning && !hasScanned ? (
                                <button
                                    onClick={() => setIsScanning(true)}
                                    className="w-full glass-panel border border-brand/50 text-brand hover:bg-brand/10 font-bold py-4 rounded-2xl shadow-[0_0_20px_rgba(239,68,68,0.15)] flex items-center justify-center gap-3 text-lg transition-colors"
                                >
                                    <i className="fa-solid fa-fingerprint text-xl"></i> كشف الهوية
                                </button>
                            ) : hasScanned ? (
                                <button
                                    onClick={onNext}
                                    className="w-full bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/10 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-3 text-lg transition-colors"
                                >
                                    {isLast ? 'تشفير وتسليم للحاكم' : 'إخفاء وتمرير الجهاز'}
                                    {isLast ? <i className="fa-solid fa-lock text-sky-400"></i> : <i className="fa-solid fa-arrow-left text-zinc-400"></i>}
                                </button>
                            ) : (
                                <div className="w-full py-4 text-center glass-panel rounded-2xl border-brand/30">
                                    <span className="text-brand font-mono text-sm tracking-[0.2em] animate-pulse">ANALYZING DNA...</span>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function ModeratorPhase({ players, onGoToElimination, onReset, onManualEnd, onRevive, onToggleMark, isGlassMode, setIsGlassMode }) {
            const [showRoles, setShowRoles] = useState(true);
            const [showMenu, setShowMenu] = useState(false);

            const aliveCount = players.filter(p => p.isAlive).length;
            const mafiaAlive = players.filter(p => p.isAlive && p.role.id === 'mafia').length;
            const othersAlive = aliveCount - mafiaAlive;

            return (
                <div className="px-4 animate-fade-up min-h-full flex flex-col pt-4">

                        <div className="flex justify-between items-center mb-5">
                            <div>
                                <h2 className="text-lg font-bold text-white flex items-center gap-2">

                            </div>
                            <button onClick={() => setShowRoles(!showRoles)} className="bg-black/50 border border-white/5 px-3 py-1.5 rounded-lg text-xs font-bold text-zinc-300 flex items-center gap-2 hover:bg-white/10 transition-colors">

                        <div className="grid grid-cols-2 gap-3">
                            <div className="bg-black/60 rounded-2xl p-4 border border-brand/20 flex flex-col items-center relative">
                                <span className="text-3xl font-black text-brand mb-1 drop-shadow-[0_0_8px_rgba(239,68,68,0.5)]">{mafiaAlive}</span>
                                <span className="text-[10px] text-zinc-400 font-bold uppercase tracking-wider">المافيا</span>
                            </div>
                            <div className="bg-black/60 rounded-2xl p-4 border border-sky-500/20 flex flex-col items-center relative">
                                <span className="text-3xl font-black text-sky-400 mb-1 drop-shadow-[0_0_8px_rgba(56,189,248,0.5)]">{othersAlive}</span>
                                <span className="text-[10px] text-zinc-400 font-bold uppercase tracking-wider">المواطنين</span>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 space-y-2.5">
                        <h3 className="px-2 mb-3 text-xs font-bold text-zinc-500 uppercase tracking-wider flex items-center gap-2">
                            <i className="fa-regular fa-folder-open"></i> ملفات الأفراد ({players.length})
                        </h3>

                        {players.map((player) => (
                            <div key={player.id} className={`glass-panel p-3 rounded-2xl flex items-center justify-between transition-all duration-300 ${!player.isAlive ? 'opacity-50 grayscale' : (player.isMarked ? 'neon-border-brand bg-brand/10' : 'border-white/5')}`}>

                                <div className="flex items-center gap-3 overflow-hidden flex-1">
                                    <div className={`w-12 h-12 shrink-0 rounded-xl flex items-center justify-center border ${player.isAlive ? (player.isMarked ? 'bg-brand/20 text-brand border-brand/30' : 'bg-black/50 text-zinc-400 border-white/10') : 'bg-black text-zinc-600 border-black'}`}>
                                        {!player.isAlive ? <i className="fa-solid fa-skull"></i> : (player.isMarked ? <i className="fa-solid fa-crosshairs animate-pulse"></i> : <i className="fa-solid fa-user"></i>)}
                                    </div>

                                    <div className="min-w-0 flex-1">
                                        <p className={`font-bold text-sm mb-0.5 truncate ${!player.isAlive ? 'line-through text-zinc-500' : (player.isMarked ? 'text-brand' : 'text-white')}`}>
                                            {player.name}
                                        </p>
                                        <div className="h-4 flex items-center">
                                            {showRoles ? (
                                                <p className={`text-[11px] font-bold ${player.role.color} flex items-center gap-1.5`}>
                                                    <i className={`fa-solid ${player.role.icon}`}></i> {player.role.name}
                                                </p>
                                            ) : (
                                                <div className="text-[10px] text-zinc-500 font-mono tracking-widest flex items-center gap-1">
                                                    <i className="fa-solid fa-lock text-[8px]"></i> ENCRYPTED
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                {!player.isAlive && (
                                    <div className="flex items-center gap-2 pl-2 border-r border-white/10 ml-2">
                                        <button onClick={() => onRevive(player.id)} className="px-3 h-10 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold flex items-center gap-1.5 hover:bg-emerald-500/20 transition-colors">
                                            <i className="fa-solid fa-heart-pulse"></i> إنعاش
                                        </button>
                                    </div>
                                )}
                            </div>
                        ))}

                    <div className="mt-auto pt-6 flex justify-center w-full z-30 shrink-0">

                                <i className="fa-solid fa-gear text-xl"></i>
                            </button>

                            <button onClick={onGoToElimination} className="flex-1 h-14 bg-brand hover:bg-brand-light rounded-2xl text-white font-black flex items-center justify-center gap-3 shadow-[0_0_20px_rgba(239,68,68,0.4)] transition-colors">
                                <i className="fa-solid fa-gavel text-xl"></i> تنفيذ إقصاء
                            </button>

                    {showMenu && (

                                </div>

                                <div className="space-y-3">
                                    <button onClick={() => { setShowMenu(false); onManualEnd('mafia'); }} className="w-full bg-brand/10 border border-brand/30 text-brand font-bold py-4 rounded-xl flex items-center justify-center gap-3 hover:bg-brand/20 transition-colors">
                                        <i className="fa-solid fa-user-secret"></i> إعلان فوز المافيا
                                    </button>
                                    <button onClick={() => { setShowMenu(false); onManualEnd('citizens'); }} className="w-full bg-sky-500/10 border border-sky-500/30 text-sky-400 font-bold py-4 rounded-xl flex items-center justify-center gap-3 hover:bg-sky-500/20 transition-colors">
                                        <i className="fa-solid fa-users"></i> إعلان فوز المواطنين
                                    </button>
                                    <div className="h-px bg-white/10 my-4 w-full"></div>

                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );

        function EliminationPhase({ players, onEliminate, onCancel }) {
            const alivePlayers = players.filter(p => p.isAlive);

            return (

                    <div className="grid grid-cols-2 md:grid-cols-3 gap-4 flex-1 content-start">
                        {alivePlayers.map((player) => (

                            >
                                <div className="w-14 h-14 rounded-full bg-black/50 border border-white/10 group-hover:border-brand/50 group-hover:bg-brand/20 flex items-center justify-center transition-colors relative">

                                    {player.isMarked && (
                                        <div className="absolute -top-1 -right-1 w-4 h-4 bg-brand rounded-full border-2 border-[#0a0a0a] animate-pulse"></div>
                                    )}

                                <span className="font-bold text-zinc-200 group-hover:text-brand text-sm line-clamp-1">{player.name}</span>
                            </button>

                    </div>

                    <div className="mt-auto pt-6 flex justify-center w-full z-20 shrink-0">
                        <button
                            onClick={onCancel}
                            className="w-full max-w-sm glass-panel bg-black/80 text-zinc-300 font-bold py-4 rounded-2xl flex items-center justify-center gap-2 text-lg hover:text-white transition-colors"
                        >
                            إلغاء الأمر <i className="fa-solid fa-arrow-left text-sm mt-1"></i>
                        </button>
                    </div>
                </div>
            );
        }

        function GameOverPhase({ winner, onReset }) {
            const [showButton, setShowButton] = useState(false);

            useEffect(() => {
                const timer = setTimeout(() => setShowButton(true), 1500);
                return () => clearTimeout(timer);
            }, []);

            const isMafia = winner === 'mafia';

            return (
                <div className="absolute inset-0 z-[100] flex flex-col items-center justify-center p-6 bg-[#050505]">
                    <div className={`absolute inset-0 bg-[radial-gradient(circle_at_center,var(--tw-gradient-stops))] ${isMafia ? 'from-brand/20' : 'from-sky-900/40'} to-[#050505]`}></div>
                    <div className="absolute inset-0 bg-grid opacity-20"></div>

                    <div className="relative z-10 flex flex-col items-center text-center animate-fade-up">
                        <div className={`text-[10px] font-bold tracking-[0.3em] uppercase mb-8 font-mono px-4 py-1.5 rounded-full border ${isMafia ? 'text-brand border-brand/30 bg-brand/10' : 'text-sky-400 border-sky-500/30 bg-sky-500/10'}`}>
                            PROTOCOL TERMINATED
                        </div>

                        <div className="relative mb-8">
                            <div className={`absolute inset-0 blur-2xl opacity-50 rounded-full ${isMafia ? 'bg-brand' : 'bg-sky-500'}`}></div>
                            <div className={`w-40 h-40 rounded-full glass-panel flex items-center justify-center relative z-10 border-4 ${isMafia ? 'border-brand' : 'border-sky-400'} shadow-2xl`}>
                                <i className={`fa-solid ${isMafia ? 'fa-user-secret text-brand' : 'fa-users text-sky-400'} text-7xl`}></i>
                            </div>
                        </div>

                        <h2 className="text-4xl md:text-5xl font-black text-white mb-3 drop-shadow-xl">
                            {isMafia ? 'انتصرت المافيا' : 'انتصر المواطنون'}
                        </h2>
                        <p className="text-zinc-400 mb-12 text-sm max-w-xs leading-relaxed">
                            {isMafia ? 'تمت السيطرة الكاملة على النظام وإسقاط المواطنين.' : 'تم القضاء على التهديد واستعادة أمن المواطنين بنجاح.'}
                        </p>

                        {showButton && (
                            <button
                                onClick={onReset}
                                className={`animate-pop font-bold py-4 px-10 rounded-2xl flex items-center gap-3 text-lg transition-all ${isMafia ? 'bg-brand hover:bg-brand-light text-white shadow-[0_0_20px_rgba(239,68,68,0.4)]' : 'bg-sky-600 hover:bg-sky-500 text-white shadow-[0_0_20px_rgba(14,165,233,0.4)]'}`}
                            >
                                <i className="fa-solid fa-power-off"></i> إعادة تشغيل النظام
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
