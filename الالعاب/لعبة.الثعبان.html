<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الثعبان - ماين كرافت</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Nunito:wght@700;800;900&family=Changa:wght@400;700;800&family=Silkscreen&display=swap"
        rel="stylesheet">

    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            font-family: 'Changa', sans-serif;
            /* Dirt texture background */
            background-color: #5C3A21;
            background-image:
                linear-gradient(45deg, #7A5C43 25%, transparent 25%, transparent 75%, #7A5C43 75%, #7A5C43),
                linear-gradient(45deg, #7A5C43 25%, transparent 25%, transparent 75%, #7A5C43 75%, #7A5C43);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
            image-rendering: pixelated;
        }

        .font-pixel {
            font-family: 'Silkscreen', cursive;
            letter-spacing: 2px;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .animate-fade-in {
            animation: fadeInScale 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Minecraft Button Style */
        .mc-button {
            background-color: #C6C6C6;
            color: #3B3B3B;
            border: 4px solid #000;
            border-top-color: #FFFFFF;
            border-left-color: #FFFFFF;
            border-bottom-color: #555555;
            border-right-color: #555555;
            font-weight: 800;
            image-rendering: pixelated;
            transition: transform 0.1s ease, filter 0.2s ease;
        }

        .mc-button:hover {
            filter: brightness(1.1);
        }

        .mc-button:active {
            transform: scale(0.95);
            border-top-color: #555555;
            border-left-color: #555555;
            border-bottom-color: #FFFFFF;
            border-right-color: #FFFFFF;
            padding-top: 4px;
            padding-left: 4px;
            padding-bottom: 0px;
            padding-right: 0px;
        }

        /* Minecraft Panel Style */
        .mc-panel {
            background-color: #C6C6C6;
            border: 4px solid #555555;
            border-top-color: #FFFFFF;
            border-left-color: #FFFFFF;
            border-bottom-color: #555555;
            border-right-color: #555555;
            box-shadow: inset -2px -2px 0px rgba(0, 0, 0, 0.25), inset 2px 2px 0px rgba(255, 255, 255, 0.5);
        }

        .mc-canvas-container {
            border: 6px solid #3B3B3B;
            background-color: #588C3A;
            /* Grass top color */
        }

        canvas {
            image-rendering: pixelated;
            /* Crucial for blocky look */
        }

        /* شاشة ما قبل اللعب الموحدة (Pro Arena Pre-Game Lobby) */
        #pa-lobby-root {
            position: fixed; inset: 0; z-index: 9999; overflow-y: auto; overflow-x: hidden; touch-action: pan-y;
            background-color: #FFF7EB;
            background-image:
                radial-gradient(circle at 10% 12%, rgba(255, 167, 38, 0.2), transparent 34%),
                radial-gradient(circle at 90% 88%, rgba(107, 139, 255, 0.14), transparent 36%),
                radial-gradient(#FF980018 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 24px 24px;
            color: #0F172A; font-family: 'Cairo', sans-serif; image-rendering: auto;
            transition: opacity 0.3s ease, background-color 0.35s ease, color 0.35s ease;
            -webkit-user-select: none; user-select: none;
        }
        #pa-lobby-root.pa-hidden { opacity: 0; pointer-events: none; visibility: hidden; }
        #pa-lobby-root.pa-dark {
            background-color: #0B1120;
            background-image:
                radial-gradient(circle at 12% 12%, rgba(255, 152, 0, 0.14), transparent 36%),
                radial-gradient(circle at 88% 85%, rgba(107, 139, 255, 0.12), transparent 36%),
                radial-gradient(rgba(148, 163, 184, 0.1) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 24px 24px;
            color: #F8FAFC;
        }
        .pa-hero-stage-rect { position: relative; border-radius: 30px; background: linear-gradient(135deg, #1E293B 0%, #0F172A 65%, #1A1F35 100%); border: 2px solid rgba(255, 255, 255, 0.12); box-shadow: 0 6px 0 #090E1A, 0 22px 42px -12px rgba(15, 23, 42, 0.35); overflow: hidden; }
        #pa-lobby-root.pa-dark .pa-hero-stage-rect { background: linear-gradient(135deg, #17233B 0%, #0F172A 65%, #1C2640 100%); border-color: rgba(255, 183, 77, 0.24); box-shadow: 0 6px 0 #050811, 0 24px 44px -12px rgba(0, 0, 0, 0.65); }
        .pa-hero-stage-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px); background-size: 22px 22px; mask-image: radial-gradient(circle at 80% 30%, black 20%, transparent 78%); -webkit-mask-image: radial-gradient(circle at 80% 30%, black 20%, transparent 78%); pointer-events: none; }
        .pa-game-thumb-frame { position: relative; border-radius: 22px; border: 3px solid rgba(255, 255, 255, 0.92); box-shadow: 0 12px 24px rgba(0, 0, 0, 0.38), 0 0 0 4px rgba(255, 152, 0, 0.22); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .pa-hero-stage-rect:hover .pa-game-thumb-frame { transform: rotate(-2deg) scale(1.03); }
        .pa-tactile-exit-btn { background: linear-gradient(180deg, #F87171 0%, #EF4444 100%); color: #FFFFFF; border-radius: 16px; border: 1.5px solid rgba(255, 255, 255, 0.28); box-shadow: 0 4px 0 #991B1B, 0 8px 16px rgba(239, 68, 68, 0.35); transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.14s ease; cursor: pointer; }
        .pa-tactile-exit-btn:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 5px 0 #991B1B, 0 10px 20px rgba(239, 68, 68, 0.42); }
        .pa-tactile-exit-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #991B1B; }
        .pa-arcade-option-rect { position: relative; width: 100%; text-align: right; border-radius: 24px; background: #FFFFFF; border: 2px solid #E2E8F0; box-shadow: 0 5px 0 #CBD5E1, 0 14px 26px -12px rgba(15, 23, 42, 0.12); transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s ease, border-color 0.2s ease, background-color 0.2s ease; overflow: hidden; cursor: pointer; }
        .pa-arcade-option-rect:hover { transform: translateY(-2px); border-color: #FDBA74; box-shadow: 0 7px 0 #FDBA74, 0 18px 30px -10px rgba(255, 123, 0, 0.22); }
        .pa-arcade-option-rect:active, .pa-arcade-option-rect.pa-is-pressed { transform: translateY(4px) !important; box-shadow: 0 1px 0 #CBD5E1 !important; }
        .pa-arcade-option-rect.pa-is-featured { background: linear-gradient(135deg, #FFB03A 0%, #FF7B00 100%); border-color: #FFD180; box-shadow: 0 6px 0 #C2410C, 0 18px 32px -10px rgba(255, 123, 0, 0.46); }
        .pa-arcade-option-rect.pa-is-featured:hover { border-color: #FFE0B2; box-shadow: 0 8px 0 #C2410C, 0 22px 36px -10px rgba(255, 123, 0, 0.56); }
        .pa-arcade-option-rect.pa-is-featured:active, .pa-arcade-option-rect.pa-is-featured.pa-is-pressed { transform: translateY(5px) !important; box-shadow: 0 1px 0 #C2410C !important; }
        #pa-lobby-root.pa-dark .pa-arcade-option-rect:not(.pa-is-featured) { background: #162033; border-color: #293852; box-shadow: 0 5px 0 #0A101D, 0 16px 28px -12px rgba(0, 0, 0, 0.55); }
        #pa-lobby-root.pa-dark .pa-arcade-option-rect:not(.pa-is-featured):hover { background: #1B2840; border-color: #FF9800; box-shadow: 0 7px 0 #9A3412, 0 18px 32px -10px rgba(255, 152, 0, 0.24); }
        #pa-lobby-root.pa-dark .pa-arcade-option-rect:not(.pa-is-featured):active, #pa-lobby-root.pa-dark .pa-arcade-option-rect:not(.pa-is-featured).pa-is-pressed { box-shadow: 0 1px 0 #0A101D !important; }
        .pa-arcade-option-rect:hover .pa-opt-icon { transform: scale(1.05) rotate(-3deg); }
        .pa-arcade-option-rect:not(.pa-is-featured):hover .pa-opt-title { color: #FF9800; }
        .pa-arcade-option-rect:not(.pa-is-featured):hover .pa-enter-pill { background: #FF9800; color: #FFFFFF; }
        .pa-arcade-option-rect:not(.pa-is-featured):hover .pa-enter-pill i { transform: translateX(-2px); }
        .pa-arcade-option-rect.pa-is-featured:hover .pa-featured-pill { transform: scale(1.05); }
        .pa-rect-watermark { position: absolute; left: 68px; bottom: -14px; font-size: 4.2rem; font-weight: 900; line-height: 1; opacity: 0.055; pointer-events: none; font-family: 'Nunito', 'Cairo', sans-serif; color: #0F172A; }
        #pa-lobby-root.pa-dark .pa-rect-watermark { color: #F8FAFC; }
        .pa-arcade-option-rect.pa-is-featured .pa-rect-watermark { opacity: 0.14; color: #FFFFFF; }
        .pa-text-primary { color: #0F172A; }
        .pa-text-secondary { color: #64748B; }
        #pa-lobby-root.pa-dark .pa-text-primary { color: #F8FAFC; }
        #pa-lobby-root.pa-dark .pa-text-secondary { color: #94A3B8; }
        .pa-hint-pill { background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(226, 232, 240, 0.8); color: #64748B; }
        #pa-lobby-root.pa-dark .pa-hint-pill { background: rgba(30, 41, 59, 0.8); border-color: #334155; color: #94A3B8; }
        .pa-opt-tag { background: #FFF7ED; border: 1px solid #FFEDD5; color: #FF9800; }
        #pa-lobby-root.pa-dark .pa-opt-tag { background: #1E293B; border-color: #334155; color: #FFB74D; }
        .pa-enter-pill { background: #F1F5F9; color: #64748B; }
        #pa-lobby-root.pa-dark .pa-enter-pill { background: #1E293B; color: #94A3B8; }
        .pa-modal-card { background: #FFFFFF; border: 2px solid #F1F5F9; border-radius: 30px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        #pa-lobby-root.pa-dark .pa-modal-card { background: #162033; border-color: #293852; }
        .pa-progress-track { background: #E2E8F0; }
        #pa-lobby-root.pa-dark .pa-progress-track { background: #334155; }
        @keyframes paPopSlideIn { from { opacity: 0; transform: translateY(18px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .pa-animate-pop { opacity: 0; animation: paPopSlideIn 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        @keyframes paProgressFill { 0% { width: 8%; } 100% { width: 100%; } }
        .pa-progress-anim { animation: paProgressFill 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    </style>
</head>

<body class="m-0 overflow-hidden text-[#1e1e1e]">

    <!-- ==================== شاشة ما قبل اللعب (Pro Arena Lobby) ==================== -->
    <div id="pa-lobby-root" dir="rtl">
        <div class="min-h-[100dvh] flex flex-col">
            <div class="w-full max-w-xl mx-auto px-4 sm:px-6 pt-5 sm:pt-8 pb-10 flex-1 flex flex-col gap-6">
                <section id="pa-game-header-rect" class="pa-animate-pop pa-hero-stage-rect" style="animation-delay: 0.02s;">
                    <div class="pa-hero-stage-grid"></div>
                    <div class="absolute -top-14 -right-14 w-48 h-48 rounded-full blur-3xl pointer-events-none" style="background: rgba(22, 163, 74, 0.32);"></div>
                    <div class="absolute -bottom-16 -left-12 w-44 h-44 rounded-full blur-3xl pointer-events-none" style="background: rgba(255, 152, 0, 0.22);"></div>
                    <img id="pa-hero-cover-img" alt="" class="hidden absolute inset-0 w-full h-full object-cover opacity-20 mix-blend-luminosity pointer-events-none">

                    <div class="relative z-10 p-4 sm:p-5">
                        <div class="flex items-center justify-between gap-3.5 sm:gap-4">
                            <div class="flex items-center gap-3.5 sm:gap-4 min-w-0 flex-1">
                                <div id="pa-game-image-box" class="pa-game-thumb-frame w-20 h-20 sm:w-[88px] sm:h-[88px] shrink-0 overflow-hidden flex items-center justify-center" style="background: linear-gradient(135deg, #16A34A, #059669);">
                                    <img id="pa-game-image" src="" alt="لعبة الثعبان" class="hidden w-full h-full object-cover relative z-10" onerror="paHandleGameImageError()">
                                    <div id="pa-game-image-placeholder" class="w-full h-full flex items-center justify-center relative z-10">
                                        <i id="pa-game-icon" class="fa-solid fa-worm text-4xl sm:text-5xl text-white drop-shadow-md"></i>
                                    </div>
                                </div>
                                <div class="min-w-0 flex-1">
                                    <span class="inline-flex items-center gap-1.5 text-[10px] sm:text-[11px] font-black px-2.5 py-0.5 rounded-lg mb-1.5" style="background: rgba(255, 152, 0, 0.2); color: #FCD34D; border: 1px solid rgba(255, 152, 0, 0.3);">
                                        <i class="fa-solid fa-sparkles text-[9px]"></i>
                                        <span id="pa-game-badge-text">كلاسيك • ماين كرافت</span>
                                    </span>
                                    <h1 id="pa-game-name" class="text-xl sm:text-2xl md:text-3xl font-black text-white leading-tight truncate">لعبة الثعبان</h1>
                                    <p id="pa-game-desc" class="text-[11px] sm:text-xs font-bold text-slate-300 mt-1 line-clamp-1">اجمع التفاح الأحمر وكبّر ثعبان المكعبات وحقق أعلى رقم</p>
                                </div>
                            </div>
                            <button type="button" onclick="proArenaExitToApp()" class="pa-tactile-exit-btn h-12 px-3.5 sm:px-4 flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2 shrink-0" aria-label="خروج" title="خروج والعودة للقائمة">
                                <i class="fa-solid fa-right-from-bracket text-base"></i>
                                <span class="text-[11px] sm:text-xs font-black leading-none">خروج</span>
                            </button>
                        </div>
                    </div>
                </section>

                <section class="flex-1 flex flex-col gap-3.5">
                    <div class="pa-animate-pop flex items-center justify-between px-1" style="animation-delay: 0.08s;">
                        <div class="flex items-center gap-2">
                            <div class="w-7 h-7 rounded-xl flex items-center justify-center text-xs shadow-sm" style="background: rgba(255, 152, 0, 0.15); color: #FF9800;">
                                <i class="fa-solid fa-layer-group"></i>
                            </div>
                            <h2 class="text-base sm:text-lg font-black pa-text-primary">خيارات اللعب</h2>
                        </div>
                        <span class="pa-hint-pill text-[11px] font-black px-3 py-1 rounded-full">انقر للدخول مباشرة</span>
                    </div>
                    <div id="pa-play-options-container" class="flex flex-col gap-4"></div>
                </section>
            </div>
        </div>

        <div id="pa-launch-overlay" class="fixed inset-0 z-[10050] bg-slate-950/70 backdrop-blur-md flex items-center justify-center p-5 opacity-0 pointer-events-none transition-opacity duration-300">
            <div id="pa-launch-card" class="pa-modal-card w-full max-w-sm p-7 text-center transform scale-95 transition-transform duration-300">
                <div id="pa-launch-icon-box" class="w-20 h-20 rounded-[24px] mx-auto mb-4 flex items-center justify-center text-white text-3xl shadow-xl" style="background: linear-gradient(135deg, #16A34A, #059669);">
                    <i id="pa-launch-icon" class="fa-solid fa-play"></i>
                </div>
                <h3 id="pa-launch-title" class="text-xl font-black pa-text-primary mb-1">جاري الدخول للعب...</h3>
                <p id="pa-launch-subtitle" class="text-xs font-bold pa-text-secondary mb-5">يتم تجهيز الجولة الآن</p>
                <div class="pa-progress-track w-full h-3 rounded-full overflow-hidden p-0.5">
                    <div id="pa-launch-progress" class="h-full rounded-full w-0" style="background: linear-gradient(to left, #FFB347, #FF7B00);"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="root"></div>

    <script>
        const PA_GAME_TEMPLATE = {
            name: 'لعبة الثعبان',
            description: 'اجمع التفاح الأحمر وكبّر ثعبان المكعبات وحقق أعلى رقم قياسي',
            badge: 'كلاسيك • ماين كرافت',
            image: '',
            icon: 'fa-solid fa-worm',
            accentGradient: 'linear-gradient(135deg, #16A34A, #059669)',
            options: [
                {
                    id: 'classic',
                    title: 'الوضع الكلاسيكي (متوسط)',
                    desc: 'سرعة متوازنة تزداد تدريجياً مع كل تفاحة حمراء تأكلها',
                    tag: 'مقترح',
                    featured: true,
                    icon: 'fa-solid fa-play',
                    iconBg: 'linear-gradient(135deg, #FBBF24, #F97316)'
                },
                {
                    id: 'fast',
                    title: 'تحدي السرعة (سريع)',
                    desc: 'حركة سريعة جداً من اللحظة الأولى لاختبار ردود فعلك',
                    tag: 'سريع',
                    featured: false,
                    icon: 'fa-solid fa-bolt',
                    iconBg: 'linear-gradient(135deg, #16A34A, #059669)'
                },
                {
                    id: 'chill',
                    title: 'الوضع الهادئ (للمبتدئين)',
                    desc: 'سرعة مريحة للتحكم الدقيق وتحطيم رقمك القياسي بسهولة',
                    tag: 'مريح',
                    featured: false,
                    icon: 'fa-solid fa-leaf',
                    iconBg: 'linear-gradient(135deg, #0EA5E9, #2563EB)'
                },
                {
                    id: 'portal',
                    title: 'وضع بلا جدران (عبور الحواف)',
                    desc: 'اعبر من جهة واخرج من الجهة المقابلة بدون الاصطدام بالجدار',
                    tag: 'مميز',
                    featured: false,
                    icon: 'fa-solid fa-infinity',
                    iconBg: 'linear-gradient(135deg, #A855F7, #6366F1)'
                }
            ]
        };

        let paIsEntering = false;
        let paCurrentDark = null;
        let paSoundEnabled = true;
        let paAudioCtx = null;
        window.__PA_PENDING_OPTION = null;

        function paApplyThemeState(isDark) {
            paCurrentDark = !!isDark;
            const root = document.getElementById('pa-lobby-root');
            if (root) root.classList.toggle('pa-dark', paCurrentDark);
        }

        function paApplySoundState(enabled) {
            paSoundEnabled = !!enabled;
            if (typeof window.PA_ON_SOUND_CHANGE === 'function') {
                window.PA_ON_SOUND_CHANGE(paSoundEnabled);
            }
        }

        function paSyncTheme() {
            if (paCurrentDark !== null) {
                paApplyThemeState(paCurrentDark);
                return;
            }
            let isDark = false;
            let isSoundOn = true;
            try {
                const params = new URLSearchParams(window.location.search);
                const pTheme = params.get('paTheme') || params.get('theme');
                if (pTheme === 'dark' || pTheme === 'light') isDark = pTheme === 'dark';
                else isDark = localStorage.getItem('pro-arena-darkmode') === 'true';
                const pSound = params.get('paSound');
                if (pSound === '0' || pSound === '1') isSoundOn = pSound === '1';
                else isSoundOn = localStorage.getItem('pro-arena-sound') !== 'false';
            } catch (e) { }
            paApplyThemeState(isDark);
            paApplySoundState(isSoundOn);
        }

        function paPlaySound(type = 'click') {
            if (!paSoundEnabled) return;
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!paAudioCtx) paAudioCtx = new Ctx();
                if (paAudioCtx.state === 'suspended') paAudioCtx.resume();
                const osc = paAudioCtx.createOscillator();
                const gain = paAudioCtx.createGain();
                osc.connect(gain); gain.connect(paAudioCtx.destination);
                const now = paAudioCtx.currentTime;
                if (type === 'enter') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(420, now);
                    osc.frequency.exponentialRampToValueAtTime(840, now + 0.14);
                    gain.gain.setValueAtTime(0.09, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
                    osc.start(now); osc.stop(now + 0.22);
                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(240, now + 0.06);
                    gain.gain.setValueAtTime(0.07, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
                    osc.start(now); osc.stop(now + 0.06);
                }
            } catch (e) { }
        }

        function paEscapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function paHandleGameImageError() {
            const img = document.getElementById('pa-game-image');
            const ph = document.getElementById('pa-game-image-placeholder');
            if (img) img.classList.add('hidden');
            if (ph) ph.classList.remove('hidden');
        }

        function renderProArenaLobby() {
            document.getElementById('pa-game-name').textContent = PA_GAME_TEMPLATE.name;
            document.getElementById('pa-game-desc').textContent = PA_GAME_TEMPLATE.description;
            document.getElementById('pa-game-badge-text').textContent = PA_GAME_TEMPLATE.badge;
            const container = document.getElementById('pa-play-options-container');
            container.innerHTML = PA_GAME_TEMPLATE.options.map((opt, idx) => {
                const isFeatured = Boolean(opt.featured);
                const orderNum = String(idx + 1).padStart(2, '0');
                if (isFeatured) {
                    return `
                        <button type="button" onclick="paEnterGameWithOption('${paEscapeHtml(opt.id)}', this)"
                            class="pa-animate-pop pa-arcade-option-rect pa-is-featured p-4 sm:p-5 flex items-center justify-between gap-3.5 sm:gap-4"
                            style="animation-delay: ${0.12 + idx * 0.06}s;">
                            <span class="pa-rect-watermark" aria-hidden="true">${orderNum}</span>
                            <div class="pa-opt-icon w-14 h-14 sm:w-[60px] sm:h-[60px] rounded-2xl bg-white/20 backdrop-blur-sm border-2 border-white/40 text-white flex items-center justify-center shrink-0 shadow-inner transition-transform relative z-10">
                                <i class="${opt.icon} text-2xl drop-shadow-sm"></i>
                            </div>
                            <div class="flex-1 min-w-0 relative z-10">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <h3 class="font-black text-base sm:text-lg text-white leading-snug">${paEscapeHtml(opt.title)}</h3>
                                    ${opt.tag ? `<span class="text-[10px] font-black px-2.5 py-0.5 rounded-lg bg-black/20 text-white border border-white/25">${paEscapeHtml(opt.tag)}</span>` : ''}
                                </div>
                                <p class="text-xs font-bold text-white/90 mt-1 truncate">${paEscapeHtml(opt.desc)}</p>
                            </div>
                            <div class="pa-featured-pill h-11 px-4 rounded-2xl bg-white font-black text-xs sm:text-sm flex items-center gap-1.5 shrink-0 shadow-md transition-transform relative z-10" style="color: #EA580C;">
                                <span>العب</span>
                                <i class="fa-solid fa-play text-[10px] rotate-180"></i>
                            </div>
                        </button>`;
                }
                return `
                    <button type="button" onclick="paEnterGameWithOption('${paEscapeHtml(opt.id)}', this)"
                        class="pa-animate-pop pa-arcade-option-rect p-4 sm:p-5 flex items-center justify-between gap-3.5 sm:gap-4"
                        style="animation-delay: ${0.12 + idx * 0.06}s;">
                        <span class="pa-rect-watermark" aria-hidden="true">${orderNum}</span>
                        <div class="pa-opt-icon w-14 h-14 rounded-2xl text-white flex items-center justify-center shrink-0 shadow-md border-2 border-white/40 transition-transform relative z-10" style="background: ${opt.iconBg};">
                            <i class="${opt.icon} text-xl drop-shadow-sm"></i>
                        </div>
                        <div class="flex-1 min-w-0 relative z-10">
                            <div class="flex items-center gap-2 flex-wrap">
                                <h3 class="pa-opt-title font-black text-sm sm:text-base pa-text-primary transition-colors leading-snug">${paEscapeHtml(opt.title)}</h3>
                                ${opt.tag ? `<span class="pa-opt-tag text-[10px] font-black px-2.5 py-0.5 rounded-lg">${paEscapeHtml(opt.tag)}</span>` : ''}
                            </div>
                            <p class="text-[11px] sm:text-xs font-bold pa-text-secondary mt-1 truncate">${paEscapeHtml(opt.desc)}</p>
                        </div>
                        <div class="pa-enter-pill h-10 px-3.5 rounded-2xl font-black text-xs flex items-center gap-1.5 shrink-0 transition-all relative z-10">
                            <span class="hidden sm:inline">دخول</span>
                            <i class="fa-solid fa-chevron-left text-[11px] transition-transform"></i>
                        </div>
                    </button>`;
            }).join('');
        }

        function paEnterGameWithOption(optionId, cardEl) {
            if (paIsEntering) return;
            const option = PA_GAME_TEMPLATE.options.find(item => item.id === optionId);
            if (!option) return;
            paIsEntering = true;
            paPlaySound('enter');
            if (cardEl) cardEl.classList.add('pa-is-pressed');

            const overlay = document.getElementById('pa-launch-overlay');
            const card = document.getElementById('pa-launch-card');
            const iconBox = document.getElementById('pa-launch-icon-box');
            const icon = document.getElementById('pa-launch-icon');
            const progress = document.getElementById('pa-launch-progress');
            iconBox.style.background = option.iconBg;
            icon.className = option.icon;
            document.getElementById('pa-launch-title').textContent = 'جاري الدخول للعب...';
            document.getElementById('pa-launch-subtitle').textContent = option.title;
            progress.classList.remove('pa-progress-anim');
            void progress.offsetWidth;
            progress.classList.add('pa-progress-anim');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-95'); card.classList.add('scale-100');

            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'PRO_ARENA_ENTER_GAME', gameName: PA_GAME_TEMPLATE.name, optionId: option.id, optionTitle: option.title }, '*');
                }
            } catch (e) { }

            setTimeout(() => {
                if (typeof window.PA_ON_SELECT_OPTION === 'function') window.PA_ON_SELECT_OPTION(optionId);
                else window.__PA_PENDING_OPTION = optionId;

                overlay.classList.add('opacity-0', 'pointer-events-none');
                card.classList.add('scale-95'); card.classList.remove('scale-100');
                document.getElementById('pa-lobby-root').classList.add('pa-hidden');
                paIsEntering = false;
                document.querySelectorAll('.pa-is-pressed').forEach(el => el.classList.remove('pa-is-pressed'));
            }, 430);
        }

        function showProArenaLobby() {
            paIsEntering = false;
            paSyncTheme();
            const root = document.getElementById('pa-lobby-root');
            if (root) { root.scrollTop = 0; root.classList.remove('pa-hidden'); }
        }

        function proArenaExitToApp() {
            paPlaySound('click');
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'PRO_ARENA_EXIT_GAME' }, '*');
                    if (typeof window.parent.confirmExit === 'function') window.parent.confirmExit(true);
                    return;
                }
            } catch (e) { return; }
            if (window.history.length > 1) window.history.back();
            else window.location.href = '../index.html';
        }

        paSyncTheme();
        renderProArenaLobby();
        window.addEventListener('storage', (e) => {
            if (e.key === 'pro-arena-darkmode') paApplyThemeState(e.newValue === 'true');
            if (e.key === 'pro-arena-sound') paApplySoundState(e.newValue !== 'false');
        });
        window.addEventListener('message', (e) => {
            if (!e || !e.data || typeof e.data !== 'object') return;
            if (e.data.type === 'PRO_ARENA_THEME_CHANGE') {
                paApplyThemeState(!!e.data.isDark);
            } else if (e.data.type === 'set_theme') {
                paApplyThemeState(e.data.theme === 'dark');
            } else if (e.data.type === 'PRO_ARENA_SOUND_CHANGE') {
                paApplySoundState(!!e.data.enabled);
            }
        });
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const TILE_SIZE = 20; // Bigger blocks
        const CANVAS_SIZE = 300;

        let isSoundEnabled = false;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!isSoundEnabled) return;
            try {
                if (!audioCtx) initAudio();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'clickSound') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                    gainNode.gain.setValueAtTime(0.05, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'eatSound') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.setValueAtTime(1200, now + 0.05);
                    gainNode.gain.setValueAtTime(0.05, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'gameOverSound') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
                    gainNode.gain.setValueAtTime(0.1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                }
            } catch (e) {
                console.error("Audio error", e);
            }
        }

        let bgmInterval = null;
        let noteIndex = 0;
        const notes = [65.41, 77.78, 65.41, 98.00]; // Retro bass

        function startBGM() {
            if (!isSoundEnabled) return;
            if (!audioCtx) initAudio();
            stopBGM();

            bgmInterval = setInterval(() => {
                if (audioCtx.state === 'suspended') return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    osc.type = 'triangle';
                    const now = audioCtx.currentTime;
                    osc.frequency.setValueAtTime(notes[noteIndex % notes.length], now);
                    gainNode.gain.setValueAtTime(0.03, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

                    osc.start(now);
                    osc.stop(now + 0.2);
                    noteIndex++;
                } catch (e) { }
            }, 300);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        function App() {
            const [gameState, setGameState] = useState('start'); // start, playing, game-over
            const [score, setScore] = useState(0);
            const [highScore, setHighScore] = useState(0);
            const [soundOn, setSoundOn] = useState(() => {
                isSoundEnabled = typeof paSoundEnabled === 'boolean' ? paSoundEnabled : true;
                return isSoundEnabled;
            });
            const [exitExpanded, setExitExpanded] = useState(false);
            const [gameConfig, setGameConfig] = useState({ speed: 150, wrapWalls: false, runId: 1 });

            useEffect(() => {
                const saved = localStorage.getItem('mc_snake_highscore');
                if (saved) setHighScore(parseInt(saved));
                return () => stopBGM();
            }, []);

            useEffect(() => {
                const applyOption = (optId) => {
                    setExitExpanded(false);
                    isSoundEnabled = typeof paSoundEnabled === 'boolean' ? paSoundEnabled : true;
                    setSoundOn(isSoundEnabled);
                    const cfg = optId === 'fast'
                        ? { speed: 105, wrapWalls: false }
                        : optId === 'chill'
                            ? { speed: 205, wrapWalls: false }
                            : optId === 'portal'
                                ? { speed: 145, wrapWalls: true }
                                : { speed: 150, wrapWalls: false };
                    setGameConfig(prev => ({ ...cfg, runId: prev.runId + 1 }));
                    setScore(0);
                    setGameState('playing');
                };
                window.PA_ON_SELECT_OPTION = applyOption;
                if (window.__PA_PENDING_OPTION) {
                    const pending = window.__PA_PENDING_OPTION;
                    window.__PA_PENDING_OPTION = null;
                    applyOption(pending);
                }
            }, []);

            useEffect(() => {
                window.PA_ON_SOUND_CHANGE = (enabled) => {
                    isSoundEnabled = !!enabled;
                    setSoundOn(isSoundEnabled);
                    if (!isSoundEnabled) stopBGM();
                };
                isSoundEnabled = typeof paSoundEnabled === 'boolean' ? paSoundEnabled : true;
                setSoundOn(isSoundEnabled);
                return () => {
                    window.PA_ON_SOUND_CHANGE = null;
                };
            }, []);

            useEffect(() => {
                if (gameState === 'playing' && soundOn) {
                    startBGM();
                } else {
                    stopBGM();
                }
            }, [gameState, soundOn]);

            const startGame = () => {
                playSound('clickSound');
                setScore(0);
                setGameConfig(prev => ({ ...prev, runId: prev.runId + 1 }));
                setGameState('playing');
            };

            const handleBackToLobby = () => {
                stopBGM();
                setExitExpanded(false);
                setGameState('start');
                if (window.showProArenaLobby) window.showProArenaLobby();
            };

            const handleGameOver = (finalScore) => {
                playSound('gameOverSound');
                setScore(finalScore);
                if (finalScore > highScore) {
                    setHighScore(finalScore);
                    localStorage.setItem('mc_snake_highscore', finalScore);
                }
                setGameState('game-over');
            };

            return (
                <div className="h-[100dvh] w-full flex justify-center items-center relative overflow-hidden bg-[#C6C6C6]" onClick={() => exitExpanded && setExitExpanded(false)}>
                    <div className="w-full h-full sm:max-w-[400px] sm:h-auto sm:min-h-[700px] mc-panel relative flex flex-col sm:my-8 shadow-none sm:shadow-[0_10px_30px_rgba(0,0,0,0.8)] !border-none sm:!border-solid sm:!border-[4px]">

                        <header className="px-3 py-2.5 flex items-center justify-between gap-2 border-b-4 border-[#555] bg-[#C6C6C6]" onClick={(e) => e.stopPropagation()}>
                            <h1 className="text-lg sm:text-xl font-black tracking-tight text-[#3B3B3B] flex items-center gap-1.5 truncate">
                                <i className="fa-solid fa-cubes text-[#588C3A]"></i>
                                <span>ثعبان المكعبات</span>
                            </h1>

                            {/* زر الخروج الموحد بطابع ماين كرافت */}
                            <div className={`mc-button h-10 flex items-center overflow-hidden transition-all duration-300 shrink-0 !p-0 ${exitExpanded ? 'w-[138px]' : 'w-10'}`}
                                style={{ backgroundColor: exitExpanded ? '#B8B8B8' : '#C6C6C6' }}>
                                <button
                                    type="button"
                                    onClick={() => setExitExpanded(!exitExpanded)}
                                    className="w-9 h-full shrink-0 flex items-center justify-center text-[#C92A2A] text-base outline-none"
                                    aria-label="خروج من اللعبة"
                                    title="خروج من اللعبة"
                                >
                                    <i className={`fa-solid ${exitExpanded ? 'fa-times' : 'fa-door-open'}`}></i>
                                </button>
                                {exitExpanded && (
                                    <div className="flex items-center gap-1.5 pl-1.5 whitespace-nowrap">
                                        <span className="text-[11px] font-black text-[#1e1e1e]">خروج؟</span>
                                        <button
                                            type="button"
                                            onClick={handleBackToLobby}
                                            className="px-2 py-0.5 text-[11px] font-black text-white border-2 border-[#1e1e1e]"
                                            style={{ backgroundColor: '#E52521' }}
                                        >
                                            نعم
                                        </button>
                                    </div>
                                )}
                            </div>
                        </header>

                        <main className="flex-1 overflow-y-auto overflow-x-hidden relative scrollbar-hide flex flex-col p-4">
                            {gameState === 'start' && (
                                <StartScreen highScore={highScore} onStart={startGame} />
                            )}
                            {gameState === 'playing' && (
                                <GameArea
                                    key={gameConfig.runId}
                                    initialSpeed={gameConfig.speed}
                                    wrapWalls={gameConfig.wrapWalls}
                                    onGameOver={handleGameOver}
                                    onScoreUpdate={setScore}
                                />
                            )}
                            {gameState === 'game-over' && (
                                <GameOverPhase score={score} highScore={highScore} onReset={handleBackToLobby} onReplay={startGame} />
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        // --- شاشة تفعيل الصوت ---
        function SoundPermissionPhase({ onDecision }) {
            return (
                <div className="absolute inset-0 z-50 bg-black/80 flex flex-col items-center justify-center p-6 backdrop-blur-sm animate-fade-in">
                    <div className="w-full max-w-[300px] mc-panel p-6 text-center shadow-[0_10px_30px_rgba(0,0,0,0.8)] relative z-10">
                        <i className="fa-solid fa-volume-high text-5xl text-[#3B3B3B] mb-4"></i>
                        <h2 className="text-xl font-black mb-6 text-[#1e1e1e]">هل تسمح بتشغيل الأصوات؟</h2>

                        <div className="flex gap-4 w-full">
                            <button
                                onClick={() => onDecision(true)}
                                className="flex-1 mc-button py-3 text-lg"
                                style={{ backgroundColor: '#588C3A', color: 'white' }}
                            >
                                <i className="fa-solid fa-check"></i> نعم
                            </button>
                            <button
                                onClick={() => onDecision(false)}
                                className="flex-1 mc-button py-3 text-lg"
                                style={{ backgroundColor: '#E52521', color: 'white' }}
                            >
                                <i className="fa-solid fa-xmark"></i> لا
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- شاشة البداية ---
        function StartScreen({ highScore, onStart }) {
            return (
                <div className="flex-1 flex flex-col items-center justify-center py-8 text-center space-y-8 animate-fade-in">
                    <div className="w-24 h-24 bg-[#588C3A] border-4 border-[#3B3B3B] flex items-center justify-center shadow-[inset_0_0_10px_rgba(0,0,0,0.3)]">
                        <i className="fa-solid fa-apple-whole text-5xl text-[#E52521] drop-shadow-md"></i>
                    </div>

                    <div>
                        <h2 className="text-3xl font-black mb-2 text-[#3B3B3B]">مستعد؟</h2>
                        <p className="text-base font-bold text-[#555] max-w-[250px] mx-auto leading-tight">
                            اجمع التفاح الأحمر لزيادة المكعبات الخاصة بك.
                        </p>
                    </div>

                    <div className="bg-[#3B3B3B] text-white p-4 border-4 border-[#1e1e1e] w-full text-center shadow-[inset_0_0_10px_rgba(0,0,0,0.8)]">
                        <h3 className="text-sm font-bold mb-1 text-gray-300">أعلى رقم قياسي</h3>
                        <div className="font-pixel text-3xl text-[#55FF55]">{highScore}</div>
                    </div>

                    <button
                        onClick={onStart}
                        className="w-full mc-button py-4 text-2xl"
                    >
                        العب الآن
                    </button>
                </div>
            );
        }

        // --- شاشة اللعب ---
        function GameArea({ initialSpeed = 150, wrapWalls = false, onGameOver, onScoreUpdate }) {
            const canvasRef = useRef(null);
            const [scoreState, setScoreState] = useState(0);

            const gameData = useRef({
                snake: [{ x: 5, y: 5 }, { x: 4, y: 5 }, { x: 3, y: 5 }],
                food: { x: 10, y: 10 },
                dx: 1,
                dy: 0,
                nextDx: 1,
                nextDy: 0,
                score: 0,
                speed: initialSpeed,
                lastTime: 0,
                reqId: null
            });

            const changeDirection = (newDx, newDy) => {
                const { dx, dy } = gameData.current;
                if ((newDx === -dx && newDx !== 0) || (newDy === -dy && newDy !== 0)) return;
                gameData.current.nextDx = newDx;
                gameData.current.nextDy = newDy;
                playSound('clickSound');
            };

            const handleControl = (dir) => (e) => {
                e.preventDefault();
                if (dir === 'up') changeDirection(0, -1);
                if (dir === 'down') changeDirection(0, 1);
                if (dir === 'left') changeDirection(-1, 0);
                if (dir === 'right') changeDirection(1, 0);
            };

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(e.key)) {
                        e.preventDefault();
                    }
                    switch (e.key) {
                        case 'ArrowUp': case 'w': changeDirection(0, -1); break;
                        case 'ArrowDown': case 's': changeDirection(0, 1); break;
                        case 'ArrowLeft': case 'a': changeDirection(-1, 0); break;
                        case 'ArrowRight': case 'd': changeDirection(1, 0); break;
                    }
                };
                window.addEventListener('keydown', handleKeyDown, { passive: false });
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            const generateFood = () => {
                const { snake } = gameData.current;
                let newFood;
                let isOnSnake = true;
                while (isOnSnake) {
                    newFood = {
                        x: Math.floor(Math.random() * (CANVAS_SIZE / TILE_SIZE)),
                        y: Math.floor(Math.random() * (CANVAS_SIZE / TILE_SIZE))
                    };
                    isOnSnake = snake.some(s => s.x === newFood.x && s.y === newFood.y);
                }
                gameData.current.food = newFood;
            };

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                generateFood();

                const loop = (time) => {
                    gameData.current.reqId = requestAnimationFrame(loop);

                    const delta = time - gameData.current.lastTime;
                    if (delta < gameData.current.speed) return;
                    gameData.current.lastTime = time;

                    updateGame(ctx);
                };

                gameData.current.reqId = requestAnimationFrame(loop);
                return () => cancelAnimationFrame(gameData.current.reqId);
            }, []);

            const updateGame = (ctx) => {
                const data = gameData.current;
                data.dx = data.nextDx;
                data.dy = data.nextDy;

                const gridCount = CANVAS_SIZE / TILE_SIZE;
                let head = { x: data.snake[0].x + data.dx, y: data.snake[0].y + data.dy };

                // Walls
                if (wrapWalls) {
                    head.x = (head.x + gridCount) % gridCount;
                    head.y = (head.y + gridCount) % gridCount;
                } else if (head.x < 0 || head.x >= gridCount || head.y < 0 || head.y >= gridCount) {
                    cancelAnimationFrame(data.reqId);
                    onGameOver(data.score);
                    return;
                }

                // Self collision
                if (data.snake.some(s => s.x === head.x && s.y === head.y)) {
                    cancelAnimationFrame(data.reqId);
                    onGameOver(data.score);
                    return;
                }

                data.snake.unshift(head);

                // Eat
                if (head.x === data.food.x && head.y === data.food.y) {
                    playSound('eatSound');
                    data.score += 1;
                    data.speed = Math.max(70, data.speed - 3);

                    setScoreState(data.score);
                    onScoreUpdate(data.score);

                    generateFood();
                } else {
                    data.snake.pop();
                }

                drawGame(ctx, data);
            };

            const drawGame = (ctx, data) => {
                // Background
                ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                ctx.fillStyle = '#588C3A'; // Grass
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                // Grid (Blocky feel)
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.lineWidth = 1;
                for (let i = 0; i <= CANVAS_SIZE; i += TILE_SIZE) {
                    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, CANVAS_SIZE); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(CANVAS_SIZE, i); ctx.stroke();
                }

                // Food (Red Apple Block)
                ctx.fillStyle = '#E52521';
                ctx.fillRect(data.food.x * TILE_SIZE + 1, data.food.y * TILE_SIZE + 1, TILE_SIZE - 2, TILE_SIZE - 2);

                // Food details
                ctx.fillStyle = '#9E1A17'; // dark red border
                ctx.fillRect(data.food.x * TILE_SIZE + 1, data.food.y * TILE_SIZE + 1, 2, TILE_SIZE - 2);
                ctx.fillRect(data.food.x * TILE_SIZE + 1, data.food.y * TILE_SIZE + 1, TILE_SIZE - 2, 2);
                ctx.fillStyle = '#78D02B'; // leaf
                ctx.fillRect(data.food.x * TILE_SIZE + TILE_SIZE / 2, data.food.y * TILE_SIZE + 2, 4, 4);

                // Snake
                data.snake.forEach((segment, index) => {
                    const px = segment.x * TILE_SIZE;
                    const py = segment.y * TILE_SIZE;

                    if (index === 0) {
                        // Head
                        ctx.fillStyle = '#21631B'; // Darker green
                        ctx.fillRect(px + 1, py + 1, TILE_SIZE - 2, TILE_SIZE - 2);

                        // Eyes
                        ctx.fillStyle = '#000000';
                        if (data.dx === 1) { // right
                            ctx.fillRect(px + TILE_SIZE - 6, py + 4, 4, 4);
                            ctx.fillRect(px + TILE_SIZE - 6, py + TILE_SIZE - 8, 4, 4);
                        } else if (data.dx === -1) { // left
                            ctx.fillRect(px + 2, py + 4, 4, 4);
                            ctx.fillRect(px + 2, py + TILE_SIZE - 8, 4, 4);
                        } else if (data.dy === 1) { // down
                            ctx.fillRect(px + 4, py + TILE_SIZE - 6, 4, 4);
                            ctx.fillRect(px + TILE_SIZE - 8, py + TILE_SIZE - 6, 4, 4);
                        } else { // up
                            ctx.fillRect(px + 4, py + 2, 4, 4);
                            ctx.fillRect(px + TILE_SIZE - 8, py + 2, 4, 4);
                        }
                    } else {
                        // Body
                        ctx.fillStyle = '#3E8948'; // Creeper green
                        ctx.fillRect(px + 1, py + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                        // Body texture (pixel art detail)
                        ctx.fillStyle = '#21631B';
                        ctx.fillRect(px + 3, py + 3, 4, 4);
                        ctx.fillRect(px + TILE_SIZE - 7, py + TILE_SIZE - 7, 4, 4);
                    }
                });
            };

            return (
                <div className="flex flex-col h-full animate-fade-in">
                    {/* Score */}
                    <div className="flex justify-between items-center mb-4 bg-[#3B3B3B] p-3 border-4 border-[#1e1e1e] text-white shadow-[inset_0_0_10px_rgba(0,0,0,0.8)]">
                        <span className="font-bold text-lg text-gray-300">النقاط:</span>
                        <span className="font-pixel text-2xl text-[#55FF55]">{scoreState}</span>
                    </div>

                    {/* Canvas */}
                    <div className="flex-1 flex flex-col items-center justify-center">
                        <div className="mc-canvas-container shadow-xl">
                            <canvas
                                ref={canvasRef}
                                width={CANVAS_SIZE}
                                height={CANVAS_SIZE}
                                className="block"
                            ></canvas>
                        </div>
                    </div>

                    {/* D-PAD */}
                    <div className="mt-8 mb-2 flex justify-center w-full">
                        <div className="grid grid-cols-3 gap-2 w-[220px]">
                            <div></div>
                            <button onPointerDown={handleControl('up')} className="aspect-square mc-button flex items-center justify-center text-3xl touch-none">
                                <i className="fa-solid fa-caret-up"></i>
                            </button>
                            <div></div>
                            <button onPointerDown={handleControl('right')} className="aspect-square mc-button flex items-center justify-center text-3xl touch-none">
                                <i className="fa-solid fa-caret-right"></i>
                            </button>
                            <button onPointerDown={handleControl('down')} className="aspect-square mc-button flex items-center justify-center text-3xl touch-none">
                                <i className="fa-solid fa-caret-down"></i>
                            </button>
                            <button onPointerDown={handleControl('left')} className="aspect-square mc-button flex items-center justify-center text-3xl touch-none">
                                <i className="fa-solid fa-caret-left"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- شاشة النهاية ---
        function GameOverPhase({ score, highScore, onReset, onReplay }) {
            return (
                <div className="absolute inset-0 z-50 bg-red-900/80 flex flex-col items-center justify-center p-6 backdrop-blur-sm animate-fade-in">
                    <div className="w-full text-center mb-8">
                        <h2 className="text-5xl font-pixel text-[#FF5555] mb-4 drop-shadow-[0_4px_4px_rgba(0,0,0,0.5)]">YOU DIED</h2>
                        <p className="text-white font-bold text-xl drop-shadow-md">لقد تم القضاء عليك!</p>
                    </div>

                    <div className="w-full bg-[#3B3B3B] border-4 border-[#1e1e1e] p-5 mb-8 text-white shadow-[inset_0_0_15px_rgba(0,0,0,0.8)]">
                        <div className="flex justify-between items-center mb-4 pb-4 border-b-4 border-[#1e1e1e]">
                            <span className="font-bold text-lg text-gray-300">النقاط:</span>
                            <span className="font-pixel text-yellow-400 text-2xl">{score}</span>
                        </div>
                        <div className="flex justify-between items-center">
                            <span className="font-bold text-lg text-gray-300">أعلى رقم:</span>
                            <span className="font-pixel text-yellow-400 text-2xl">{highScore}</span>
                        </div>
                    </div>

                    <div className="flex flex-col gap-4 w-full">
                        <button
                            onClick={onReplay}
                            className="w-full mc-button py-4 text-xl"
                        >
                            إعادة الظهور
                        </button>
                        <button
                            onClick={onReset}
                            className="w-full mc-button py-4 text-xl"
                        >
                            القائمة الرئيسية
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
