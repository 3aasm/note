<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الثعبان - ماين كرافت</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700;800&family=Silkscreen&display=swap"
        rel="stylesheet">

    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            font-family: 'Changa', sans-serif;
            /* Dirt texture background */
            background-color: #5C3A21;
            background-image:
                linear-gradient(45deg, #7A5C43 25%, transparent 25%, transparent 75%, #7A5C43 75%, #7A5C43),
                linear-gradient(45deg, #7A5C43 25%, transparent 25%, transparent 75%, #7A5C43 75%, #7A5C43);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
            image-rendering: pixelated;
        }

        .font-pixel {
            font-family: 'Silkscreen', cursive;
            letter-spacing: 2px;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .animate-fade-in {
            animation: fadeInScale 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Minecraft Button Style */
        .mc-button {
            background-color: #C6C6C6;
            color: #3B3B3B;
            border: 4px solid #000;
            border-top-color: #FFFFFF;
            border-left-color: #FFFFFF;
            border-bottom-color: #555555;
            border-right-color: #555555;
            font-weight: 800;
            image-rendering: pixelated;
            transition: transform 0.1s ease, filter 0.2s ease;
        }

        .mc-button:hover {
            filter: brightness(1.1);
        }

        .mc-button:active {
            transform: scale(0.95);
            border-top-color: #555555;
            border-left-color: #555555;
            border-bottom-color: #FFFFFF;
            border-right-color: #FFFFFF;
            padding-top: 4px;
            padding-left: 4px;
            padding-bottom: 0px;
            padding-right: 0px;
        }

        /* Minecraft Panel Style */
        .mc-panel {
            background-color: #C6C6C6;
            border: 4px solid #555555;
            border-top-color: #FFFFFF;
            border-left-color: #FFFFFF;
            border-bottom-color: #555555;
            border-right-color: #555555;
            box-shadow: inset -2px -2px 0px rgba(0, 0, 0, 0.25), inset 2px 2px 0px rgba(255, 255, 255, 0.5);
        }

        .mc-canvas-container {
            border: 6px solid #3B3B3B;
            background-color: #588C3A;
            /* Grass top color */
        }

        canvas {
            image-rendering: pixelated;
            /* Crucial for blocky look */
        }
    </style>
</head>

<body class="m-0 overflow-hidden text-[#1e1e1e]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const TILE_SIZE = 20; // Bigger blocks
        const CANVAS_SIZE = 300;

        let isSoundEnabled = false;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!isSoundEnabled) return;
            try {
                if (!audioCtx) initAudio();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'clickSound') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                    gainNode.gain.setValueAtTime(0.05, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'eatSound') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.setValueAtTime(1200, now + 0.05);
                    gainNode.gain.setValueAtTime(0.05, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'gameOverSound') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
                    gainNode.gain.setValueAtTime(0.1, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                }
            } catch (e) {
                console.error("Audio error", e);
            }
        }

        let bgmInterval = null;
        let noteIndex = 0;
        const notes = [65.41, 77.78, 65.41, 98.00]; // Retro bass

        function startBGM() {
            if (!isSoundEnabled) return;
            if (!audioCtx) initAudio();
            stopBGM();

            bgmInterval = setInterval(() => {
                if (audioCtx.state === 'suspended') return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    osc.type = 'triangle';
                    const now = audioCtx.currentTime;
                    osc.frequency.setValueAtTime(notes[noteIndex % notes.length], now);
                    gainNode.gain.setValueAtTime(0.03, now);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

                    osc.start(now);
                    osc.stop(now + 0.2);
                    noteIndex++;
                } catch (e) { }
            }, 300);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        function App() {
            const [gameState, setGameState] = useState('sound-check'); // sound-check, start, playing, game-over
            const [score, setScore] = useState(0);
            const [highScore, setHighScore] = useState(0);

            useEffect(() => {
                const saved = localStorage.getItem('mc_snake_highscore');
                if (saved) setHighScore(parseInt(saved));
                return () => stopBGM();
            }, []);

            useEffect(() => {
                if (gameState === 'playing') {
                    startBGM();
                } else {
                    stopBGM();
                }
            }, [gameState]);

            const startGame = () => {
                playSound('clickSound');
                setScore(0);
                setGameState('playing');
            };

            const handleGameOver = (finalScore) => {
                playSound('gameOverSound');
                setScore(finalScore);
                if (finalScore > highScore) {
                    setHighScore(finalScore);
                    localStorage.setItem('mc_snake_highscore', finalScore);
                }
                setGameState('game-over');
            };

            return (
                <div className="h-[100dvh] w-full flex justify-center items-center relative overflow-hidden bg-[#C6C6C6]">
                    <div className="w-full h-full sm:max-w-[400px] sm:h-auto sm:min-h-[700px] mc-panel relative flex flex-col sm:my-8 shadow-none sm:shadow-[0_10px_30px_rgba(0,0,0,0.8)] !border-none sm:!border-solid sm:!border-[4px]">

                        <header className="px-4 py-3 flex items-center justify-center border-b-4 border-[#555] bg-[#C6C6C6]">
                            <h1 className="text-2xl font-black tracking-tight text-[#3B3B3B] flex items-center gap-2">
                                <i className="fa-solid fa-cubes text-[#588C3A]"></i> ثعبان المكعبات
                            </h1>
                        </header>

                        <main className="flex-1 overflow-y-auto overflow-x-hidden relative scrollbar-hide flex flex-col p-4">
                            {gameState === 'sound-check' && (
                                <SoundPermissionPhase onDecision={(allow) => {
                                    isSoundEnabled = allow;
                                    playSound('clickSound');
                                    setGameState('start');
                                }} />
                            )}
                            {gameState === 'start' && (
                                <StartScreen highScore={highScore} onStart={startGame} />
                            )}
                            {gameState === 'playing' && (
                                <GameArea onGameOver={handleGameOver} onScoreUpdate={setScore} />
                            )}
                            {gameState === 'game-over' && (
                                <GameOverPhase score={score} highScore={highScore} onReset={() => setGameState('start')} onReplay={startGame} />
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        // --- شاشة تفعيل الصوت ---
        function SoundPermissionPhase({ onDecision }) {
            return (
                <div className="absolute inset-0 z-50 bg-black/80 flex flex-col items-center justify-center p-6 backdrop-blur-sm animate-fade-in">
                    <div className="w-full max-w-[300px] mc-panel p-6 text-center shadow-[0_10px_30px_rgba(0,0,0,0.8)] relative z-10">
                        <i className="fa-solid fa-volume-high text-5xl text-[#3B3B3B] mb-4"></i>
                        <h2 className="text-xl font-black mb-6 text-[#1e1e1e]">هل تسمح بتشغيل الأصوات؟</h2>

                        <div className="flex gap-4 w-full">
                            <button
                                onClick={() => onDecision(true)}
                                className="flex-1 mc-button py-3 text-lg"
                                style={{ backgroundColor: '#588C3A', color: 'white' }}
                            >
                                <i className="fa-solid fa-check"></i> نعم
                            </button>
                            <button
                                onClick={() => onDecision(false)}
                                className="flex-1 mc-button py-3 text-lg"
                                style={{ backgroundColor: '#E52521', color: 'white' }}
                            >
                                <i className="fa-solid fa-xmark"></i> لا
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- شاشة البداية ---
        function StartScreen({ highScore, onStart }) {
            return (
                <div className="flex-1 flex flex-col items-center justify-center py-8 text-center space-y-8 animate-fade-in">
                    <div className="w-24 h-24 bg-[#588C3A] border-4 border-[#3B3B3B] flex items-center justify-center shadow-[inset_0_0_10px_rgba(0,0,0,0.3)]">
                        <i className="fa-solid fa-apple-whole text-5xl text-[#E52521] drop-shadow-md"></i>
                    </div>

                    <div>
                        <h2 className="text-3xl font-black mb-2 text-[#3B3B3B]">مستعد؟</h2>
                        <p className="text-base font-bold text-[#555] max-w-[250px] mx-auto leading-tight">
                            اجمع التفاح الأحمر لزيادة المكعبات الخاصة بك.
                        </p>
                    </div>

                    <div className="bg-[#3B3B3B] text-white p-4 border-4 border-[#1e1e1e] w-full text-center shadow-[inset_0_0_10px_rgba(0,0,0,0.8)]">
                        <h3 className="text-sm font-bold mb-1 text-gray-300">أعلى رقم قياسي</h3>
                        <div className="font-pixel text-3xl text-[#55FF55]">{highScore}</div>
                    </div>

                    <button
                        onClick={onStart}
                        className="w-full mc-button py-4 text-2xl"
                    >
                        العب الآن
                    </button>
                </div>
            );
        }

        // --- شاشة اللعب ---
        function GameArea({ onGameOver, onScoreUpdate }) {
            const canvasRef = useRef(null);
            const [scoreState, setScoreState] = useState(0);

            const gameData = useRef({
                snake: [{ x: 5, y: 5 }, { x: 4, y: 5 }, { x: 3, y: 5 }],
                food: { x: 10, y: 10 },
                dx: 1,
                dy: 0,
                nextDx: 1,
                nextDy: 0,
                score: 0,
                speed: 150,
                lastTime: 0,
                reqId: null
            });

            const changeDirection = (newDx, newDy) => {
                const { dx, dy } = gameData.current;
                if ((newDx === -dx && newDx !== 0) || (newDy === -dy && newDy !== 0)) return;
                gameData.current.nextDx = newDx;
                gameData.current.nextDy = newDy;
                playSound('clickSound');
            };

            const handleControl = (dir) => (e) => {
                e.preventDefault();
                if (dir === 'up') changeDirection(0, -1);
                if (dir === 'down') changeDirection(0, 1);
                if (dir === 'left') changeDirection(-1, 0);
                if (dir === 'right') changeDirection(1, 0);
            };

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(e.key)) {
                        e.preventDefault();
                    }
                    switch (e.key) {
                        case 'ArrowUp': case 'w': changeDirection(0, -1); break;
                        case 'ArrowDown': case 's': changeDirection(0, 1); break;
                        case 'ArrowLeft': case 'a': changeDirection(-1, 0); break;
                        case 'ArrowRight': case 'd': changeDirection(1, 0); break;
                    }
                };
                window.addEventListener('keydown', handleKeyDown, { passive: false });
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            const generateFood = () => {
                const { snake } = gameData.current;
                let newFood;
                let isOnSnake = true;
                while (isOnSnake) {
                    newFood = {
                        x: Math.floor(Math.random() * (CANVAS_SIZE / TILE_SIZE)),
                        y: Math.floor(Math.random() * (CANVAS_SIZE / TILE_SIZE))
                    };
                    isOnSnake = snake.some(s => s.x === newFood.x && s.y === newFood.y);
                }
                gameData.current.food = newFood;
            };

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                generateFood();

                const loop = (time) => {
                    gameData.current.reqId = requestAnimationFrame(loop);

                    const delta = time - gameData.current.lastTime;
                    if (delta < gameData.current.speed) return;
                    gameData.current.lastTime = time;

                    updateGame(ctx);
                };

                gameData.current.reqId = requestAnimationFrame(loop);
                return () => cancelAnimationFrame(gameData.current.reqId);
            }, []);

            const updateGame = (ctx) => {
                const data = gameData.current;
                data.dx = data.nextDx;
                data.dy = data.nextDy;

                const head = { x: data.snake[0].x + data.dx, y: data.snake[0].y + data.dy };

                // Walls
                if (head.x < 0 || head.x >= CANVAS_SIZE / TILE_SIZE || head.y < 0 || head.y >= CANVAS_SIZE / TILE_SIZE) {
                    cancelAnimationFrame(data.reqId);
                    onGameOver(data.score);
                    return;
                }

                // Self collision
                if (data.snake.some(s => s.x === head.x && s.y === head.y)) {
                    cancelAnimationFrame(data.reqId);
                    onGameOver(data.score);
                    return;
                }

                data.snake.unshift(head);

                // Eat
                if (head.x === data.food.x && head.y === data.food.y) {
                    playSound('eatSound');
                    data.score += 1;
                    data.speed = Math.max(70, data.speed - 3);

                    setScoreState(data.score);
                    onScoreUpdate(data.score);

                    generateFood();
                } else {
                    data.snake.pop();
                }

                drawGame(ctx, data);
            };

            const drawGame = (ctx, data) => {
                // Background
                ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                ctx.fillStyle = '#588C3A'; // Grass
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                // Grid (Blocky feel)
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.lineWidth = 1;
                for (let i = 0; i <= CANVAS_SIZE; i += TILE_SIZE) {
                    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, CANVAS_SIZE); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(CANVAS_SIZE, i); ctx.stroke();
                }

                // Food (Red Apple Block)
                ctx.fillStyle = '#E52521';
                ctx.fillRect(data.food.x * TILE_SIZE + 1, data.food.y * TILE_SIZE + 1, TILE_SIZE - 2, TILE_SIZE - 2);

                // Food details
                ctx.fillStyle = '#9E1A17'; // dark red border
                ctx.fillRect(data.food.x * TILE_SIZE + 1, data.food.y * TILE_SIZE + 1, 2, TILE_SIZE - 2);
                ctx.fillRect(data.food.x * TILE_SIZE + 1, data.food.y * TILE_SIZE + 1, TILE_SIZE - 2, 2);
                ctx.fillStyle = '#78D02B'; // leaf
                ctx.fillRect(data.food.x * TILE_SIZE + TILE_SIZE / 2, data.food.y * TILE_SIZE + 2, 4, 4);

                // Snake
                data.snake.forEach((segment, index) => {
                    const px = segment.x * TILE_SIZE;
                    const py = segment.y * TILE_SIZE;

                    if (index === 0) {
                        // Head
                        ctx.fillStyle = '#21631B'; // Darker green
                        ctx.fillRect(px + 1, py + 1, TILE_SIZE - 2, TILE_SIZE - 2);

                        // Eyes
                        ctx.fillStyle = '#000000';
                        if (data.dx === 1) { // right
                            ctx.fillRect(px + TILE_SIZE - 6, py + 4, 4, 4);
                            ctx.fillRect(px + TILE_SIZE - 6, py + TILE_SIZE - 8, 4, 4);
                        } else if (data.dx === -1) { // left
                            ctx.fillRect(px + 2, py + 4, 4, 4);
                            ctx.fillRect(px + 2, py + TILE_SIZE - 8, 4, 4);
                        } else if (data.dy === 1) { // down
                            ctx.fillRect(px + 4, py + TILE_SIZE - 6, 4, 4);
                            ctx.fillRect(px + TILE_SIZE - 8, py + TILE_SIZE - 6, 4, 4);
                        } else { // up
                            ctx.fillRect(px + 4, py + 2, 4, 4);
                            ctx.fillRect(px + TILE_SIZE - 8, py + 2, 4, 4);
                        }
                    } else {
                        // Body
                        ctx.fillStyle = '#3E8948'; // Creeper green
                        ctx.fillRect(px + 1, py + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                        // Body texture (pixel art detail)
                        ctx.fillStyle = '#21631B';
                        ctx.fillRect(px + 3, py + 3, 4, 4);
                        ctx.fillRect(px + TILE_SIZE - 7, py + TILE_SIZE - 7, 4, 4);
                    }
                });
            };

            return (
                <div className="flex flex-col h-full animate-fade-in">
                    {/* Score */}
                    <div className="flex justify-between items-center mb-4 bg-[#3B3B3B] p-3 border-4 border-[#1e1e1e] text-white shadow-[inset_0_0_10px_rgba(0,0,0,0.8)]">
                        <span className="font-bold text-lg text-gray-300">النقاط:</span>
                        <span className="font-pixel text-2xl text-[#55FF55]">{scoreState}</span>
                    </div>

                    {/* Canvas */}
                    <div className="flex-1 flex flex-col items-center justify-center">
                        <div className="mc-canvas-container shadow-xl">
                            <canvas
                                ref={canvasRef}
                                width={CANVAS_SIZE}
                                height={CANVAS_SIZE}
                                className="block"
                            ></canvas>
                        </div>
                    </div>

                    {/* D-PAD */}
                    <div className="mt-8 mb-2 flex justify-center w-full">
                        <div className="grid grid-cols-3 gap-2 w-[220px]">
                            <div></div>
                            <button onPointerDown={handleControl('up')} className="aspect-square mc-button flex items-center justify-center text-3xl touch-none">
                                <i className="fa-solid fa-caret-up"></i>
                            </button>
                            <div></div>
                            <button onPointerDown={handleControl('right')} className="aspect-square mc-button flex items-center justify-center text-3xl touch-none">
                                <i className="fa-solid fa-caret-right"></i>
                            </button>
                            <button onPointerDown={handleControl('down')} className="aspect-square mc-button flex items-center justify-center text-3xl touch-none">
                                <i className="fa-solid fa-caret-down"></i>
                            </button>
                            <button onPointerDown={handleControl('left')} className="aspect-square mc-button flex items-center justify-center text-3xl touch-none">
                                <i className="fa-solid fa-caret-left"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- شاشة النهاية ---
        function GameOverPhase({ score, highScore, onReset, onReplay }) {
            return (
                <div className="absolute inset-0 z-50 bg-red-900/80 flex flex-col items-center justify-center p-6 backdrop-blur-sm animate-fade-in">
                    <div className="w-full text-center mb-8">
                        <h2 className="text-5xl font-pixel text-[#FF5555] mb-4 drop-shadow-[0_4px_4px_rgba(0,0,0,0.5)]">YOU DIED</h2>
                        <p className="text-white font-bold text-xl drop-shadow-md">لقد تم القضاء عليك!</p>
                    </div>

                    <div className="w-full bg-[#3B3B3B] border-4 border-[#1e1e1e] p-5 mb-8 text-white shadow-[inset_0_0_15px_rgba(0,0,0,0.8)]">
                        <div className="flex justify-between items-center mb-4 pb-4 border-b-4 border-[#1e1e1e]">
                            <span className="font-bold text-lg text-gray-300">النقاط:</span>
                            <span className="font-pixel text-yellow-400 text-2xl">{score}</span>
                        </div>
                        <div className="flex justify-between items-center">
                            <span className="font-bold text-lg text-gray-300">أعلى رقم:</span>
                            <span className="font-pixel text-yellow-400 text-2xl">{highScore}</span>
                        </div>
                    </div>

                    <div className="flex flex-col gap-4 w-full">
                        <button
                            onClick={onReplay}
                            className="w-full mc-button py-4 text-xl"
                        >
                            إعادة الظهور
                        </button>
                        <button
                            onClick={onReset}
                            className="w-full mc-button py-4 text-xl"
                        >
                            القائمة الرئيسية
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
