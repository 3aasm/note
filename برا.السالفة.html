<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>برا السالفة | اللعبة المطورة</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

    <!-- Tailwind Config & Custom Styles -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            light: '#3b82f6',
                            dark: '#60a5fa',
                        },
                        accent: {
                            light: '#8b5cf6',
                            dark: '#a78bfa',
                        }
                    },
                    animation: {
                        'fade-scale': 'fadeScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'bounce-soft': 'bounceSoft 2s infinite',
                        'scan': 'scan 1.5s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeScale: {
                            '0%': { opacity: 0, transform: 'scale(0.9)' },
                            '100%': { opacity: 1, transform: 'scale(1)' },
                        },
                        fadeIn: {
                            '0%': { opacity: 0, transform: 'translateY(10px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' },
                        },
                        bounceSoft: {
                            '0%, 100%': { transform: 'translateY(-5%)' },
                            '50%': { transform: 'translateY(0)' },
                        },
                        scan: {
                            '0%': { top: '0%', opacity: 0 },
                            '10%': { opacity: 1 },
                            '90%': { opacity: 1 },
                            '100%': { top: '100%', opacity: 0 },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        body {
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.5s ease;
        }

        /* Glassmorphism utility classes */
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        .dark .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .glass-btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: all 0.2s ease;
        }

        .glass-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body
    class="bg-blue-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 font-sans m-0 min-h-screen selection:bg-brand-light selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- البيانات الأساسية ---
        const CATEGORIES = {
            "أفلام": { icon: "fa-film", color: "text-blue-500", items: ["إنترستيلر", "الجوكر", "باراسايت", "العراب", "المصفوفة", "حرب النجوم", "تايتانيك", "الفيل الأزرق", "هاري بوتر", "سبايدرمان"] },
            "أماكن": { icon: "fa-plane-departure", color: "text-green-500", items: ["باريس", "الأهرامات", "برج خليفة", "سور الصين", "مكة المكرمة", "الشفق القطبي", "جزر المالديف", "نهر النيل", "طوكيو"] },
            "شخصيات": { icon: "fa-user-tie", color: "text-purple-500", items: ["ابن بطوطة", "صلاح الدين", "آينشتاين", "ستيف جوبز", "غاندي", "شكسبير", "كليوباترا", "إيلون ماسك", "ميسي"] },
            "أكلات": { icon: "fa-utensils", color: "text-orange-500", items: ["بيتزا", "سوشي", "شاورما", "برجر", "كبسة", "فلافل", "كشري", "منسف", "باستا", "كنافة"] },
            "حيوانات": { icon: "fa-paw", color: "text-yellow-500", items: ["أسد", "نمر", "فيل", "زرافة", "باندا", "ذئب", "صقر", "بطريق", "دلفين", "قرش"] },
            "ألعاب": { icon: "fa-gamepad", color: "text-red-500", items: ["ماينكرافت", "GTA", "فيفا", "فورتنايت", "كود", "ماريو", "زيلدا", "ببجي", "روكيت ليج"] }
        };

        function App() {
            // --- State Management ---
            const [gameState, setGameState] = useState('category'); // category, setup, names, assignment, game, voting, result
            const [theme, setTheme] = useState(() => {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get('theme') || localStorage.getItem('app-theme') || 'dark';
            });

            const [players, setPlayers] = useState([]);
            const [numPlayers, setNumPlayers] = useState(5);

            const [gameData, setGameData] = useState({
                category: "",
                secretWord: "",
                liarIndex: -1,
                round: 1,
            });

            const [turnData, setTurnData] = useState({
                currentPlayerIndex: 0,
                votes: {},
                votingPlayerIndex: 0
            });

            // --- Theme Toggle ---
            useEffect(() => {
                const root = window.document.documentElement;
                root.classList.remove('light', 'dark');
                root.classList.add(theme);
            }, [theme]);

            useEffect(() => {
                const handleMessage = (event) => {
                    if (event.data && event.data.type === 'set_theme') {
                        setTheme(event.data.theme);
                    }
                };
                window.addEventListener('message', handleMessage);
                return () => window.removeEventListener('message', handleMessage);
            }, []);

            const toggleTheme = () => setTheme(theme === 'light' ? 'dark' : 'light');

            // --- Background Gradient based on theme ---
            const bgClass = theme === 'light'
                ? "bg-gradient-to-br from-blue-100 via-indigo-50 to-purple-100"
                : "bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900";

            // --- Handlers ---
            const selectCategory = (catName) => {
                const items = CATEGORIES[catName].items;
                const randomItem = items[Math.floor(Math.random() * items.length)];
                setGameData({ ...gameData, category: catName, secretWord: randomItem });
                setGameState('setup');
            };

            const startNamesPhase = (count) => {
                setNumPlayers(count);
                // Keep existing players if any, pad with empty names
                let newPlayers = [...players];
                if (newPlayers.length > count) newPlayers = newPlayers.slice(0, count);
                while (newPlayers.length < count) {
                    newPlayers.push({ id: Date.now() + Math.random(), name: '', score: 0 });
                }
                setPlayers(newPlayers);
                setGameState('names');
            };

            const startRound = (updatedPlayers) => {
                setPlayers(updatedPlayers);
                setGameData({
                    ...gameData,
                    liarIndex: Math.floor(Math.random() * updatedPlayers.length)
                });
                setTurnData({ currentPlayerIndex: 0, votes: {}, votingPlayerIndex: 0 });
                setGameState('assignment');
            };

            const nextRound = () => {
                const categoriesKeys = Object.keys(CATEGORIES);
                const randomCat = categoriesKeys[Math.floor(Math.random() * categoriesKeys.length)];
                const items = CATEGORIES[randomCat].items;

                setGameData({
                    category: randomCat,
                    secretWord: items[Math.floor(Math.random() * items.length)],
                    liarIndex: Math.floor(Math.random() * players.length),
                    round: gameData.round + 1
                });
                setTurnData({ currentPlayerIndex: 0, votes: {}, votingPlayerIndex: 0 });
                setGameState('assignment');
            };

            const resetGame = () => {
                if (window.confirm('هل أنت متأكد من العودة للرئيسية وإنهاء اللعبة؟')) {
                    setPlayers([]);
                    setGameData({ category: "", secretWord: "", liarIndex: -1, round: 1 });
                    setGameState('category');
                }
            };

            return (
                <div className={`min-h-[100dvh] flex justify-center ${bgClass} transition-colors duration-500`}>
                    {/* Floating Decorative Elements */}
                    <div className="fixed top-20 left-10 w-32 h-32 bg-blue-400/20 rounded-full blur-3xl pointer-events-none"></div>
                    <div className="fixed bottom-20 right-10 w-40 h-40 bg-purple-400/20 rounded-full blur-3xl pointer-events-none"></div>

                    <div className="w-full max-w-[500px] min-h-[100dvh] relative flex flex-col z-10">

                        {/* Header */}
                        <header className="px-6 pt-8 pb-4 flex items-center justify-between z-20">
                            <div className="flex items-center gap-3">
                                {gameState !== 'category' && (
                                    <button onClick={() => gameState === 'setup' ? setGameState('category') : gameState === 'names' ? setGameState('setup') : resetGame()}
                                        className="w-10 h-10 rounded-full glass-panel flex items-center justify-center hover:scale-105 transition-transform">
                                        <i className="fa-solid fa-arrow-right"></i>
                                    </button>
                                )}
                                <div>
                                    <h1 className="text-2xl font-black flex items-center gap-2">
                                        برا السالفة <i className="fa-solid fa-masks-theater text-brand-light animate-bounce-soft text-xl"></i>
                                    </h1>
                                    {gameData.round > 1 && gameState !== 'category' && (
                                        <span className="text-xs font-bold text-accent-light">الجولة {gameData.round}</span>
                                    )}
                                </div>
                            </div>
                            <button onClick={toggleTheme} className="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-xl hover:scale-105 transition-transform">
                                {theme === 'light' ? <i className="fa-solid fa-moon text-indigo-600"></i> : <i className="fa-solid fa-sun text-yellow-400"></i>}
                            </button>
                        </header>

                        {/* Main Content Area */}
                        <main className="flex-1 overflow-y-auto px-6 pb-24 scrollbar-hide relative">
                            {gameState === 'category' && <CategoryPhase onSelect={selectCategory} />}
                            {gameState === 'setup' && <SetupPhase currentNum={numPlayers} onNext={startNamesPhase} />}
                            {gameState === 'names' && <NamesPhase players={players} onStart={startRound} />}

                            {gameState === 'assignment' && (
                                <AssignmentPhase
                                    player={players[turnData.currentPlayerIndex]}
                                    gameData={gameData}
                                    isLast={turnData.currentPlayerIndex === players.length - 1}
                                    onNext={() => {
                                        if (turnData.currentPlayerIndex < players.length - 1) {
                                            setTurnData({ ...turnData, currentPlayerIndex: turnData.currentPlayerIndex + 1 });
                                        } else {
                                            setGameState('game');
                                        }
                                    }}
                                    currentIndex={turnData.currentPlayerIndex}
                                    totalPlayers={players.length}
                                />
                            )}

                            {gameState === 'game' && <GamePhase players={players} onFinish={() => setGameState('voting')} />}

                            {gameState === 'voting' && (
                                <VotingPhase
                                    players={players}
                                    turnData={turnData}
                                    setTurnData={setTurnData}
                                    onComplete={(finalVotes) => {
                                        setTurnData({ ...turnData, votes: finalVotes });
                                        setGameState('result');
                                    }}
                                />
                            )}

                            {gameState === 'result' && (
                                <ResultPhase
                                    players={players}
                                    setPlayers={setPlayers}
                                    gameData={gameData}
                                    votes={turnData.votes}
                                    onNextRound={nextRound}
                                    onEndGame={() => { setPlayers([]); setGameState('category'); }}
                                />
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        // --- Phases Components ---

        function CategoryPhase({ onSelect }) {
            return (
                <div className="animate-fade-in pt-4">
                    <div className="text-center mb-8">
                        <h2 className="text-3xl font-black mb-2">اختر <span className="text-brand-light">الموضوع</span> 🎭</h2>
                        <p className="text-sm font-bold opacity-70">واحد منكم راح يكون برا السالفة!</p>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                        {Object.entries(CATEGORIES).map(([name, data]) => (
                            <button
                                key={name}
                                onClick={() => onSelect(name)}
                                className="glass-panel p-6 rounded-3xl flex flex-col items-center justify-center gap-3 hover:scale-105 hover:shadow-xl transition-all group overflow-hidden relative"
                            >
                                <div className={`w-14 h-14 rounded-2xl bg-slate-100/50 dark:bg-slate-800/50 flex items-center justify-center text-3xl ${data.color} shadow-sm group-hover:scale-110 transition-transform z-10`}>
                                    <i className={`fa-solid ${data.icon}`}></i>
                                </div>
                                <span className="font-black text-lg z-10">{name}</span>
                                <i className={`fa-solid ${data.icon} absolute -bottom-4 -right-4 text-7xl opacity-5 dark:opacity-10 transform -rotate-12`}></i>
                            </button>
                        ))}
                    </div>
                </div>
            );
        }

        function SetupPhase({ currentNum, onNext }) {
            const [num, setNum] = useState(currentNum);
            return (
                <div className="animate-fade-scale flex flex-col h-[70vh] justify-center max-w-sm mx-auto">
                    <div className="glass-panel p-8 rounded-[2.5rem] text-center relative overflow-hidden">
                        <div className="w-20 h-20 mx-auto bg-blue-100 dark:bg-blue-900/30 rounded-full flex items-center justify-center text-4xl text-brand-light mb-6 shadow-inner">
                            <i className="fa-solid fa-users"></i>
                        </div>
                        <h2 className="text-2xl font-black mb-2">كم عددكم؟</h2>
                        <p className="text-sm opacity-70 font-bold mb-8">اللعبة تحتاج من 3 إلى 8 لاعبين</p>

                        <div className="flex items-center justify-between glass-panel rounded-2xl p-2 mb-8">
                            <button onClick={() => setNum(Math.max(3, num - 1))} className="w-12 h-12 rounded-xl bg-slate-100/50 dark:bg-slate-700/50 hover:bg-slate-200 dark:hover:bg-slate-600 flex items-center justify-center font-bold text-xl transition-colors">-</button>
                            <span className="text-4xl font-black w-16">{num}</span>
                            <button onClick={() => setNum(Math.min(8, num + 1))} className="w-12 h-12 rounded-xl bg-slate-100/50 dark:bg-slate-700/50 hover:bg-slate-200 dark:hover:bg-slate-600 flex items-center justify-center font-bold text-xl transition-colors">+</button>
                        </div>

                        <button onClick={() => onNext(num)} className="glass-btn w-full py-4 rounded-2xl font-black text-lg flex items-center justify-center gap-2">
                            التالي <i className="fa-solid fa-arrow-left"></i>
                        </button>
                    </div>
                </div>
            );
        }

        function NamesPhase({ players, onStart }) {
            const [localPlayers, setLocalPlayers] = useState(players);

            const updateName = (index, name) => {
                const newPlayers = [...localPlayers];
                newPlayers[index].name = name;
                setLocalPlayers(newPlayers);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (localPlayers.some(p => p.name.trim() === '')) {
                    alert('يرجى إدخال جميع الأسماء!');
                    return;
                }
                onStart(localPlayers);
            };

            return (
                <div className="animate-fade-in pt-4 pb-8 max-w-sm mx-auto">
                    <div className="text-center mb-6">
                        <h2 className="text-2xl font-black mb-1">عرفونا عليكم ✍️</h2>
                        <p className="text-sm opacity-70 font-bold">عشان نعرف مين الفايز بالنهاية</p>
                    </div>

                    <form onSubmit={handleSubmit} className="space-y-4">
                        <div className="glass-panel p-6 rounded-[2rem] space-y-3">
                            {localPlayers.map((player, idx) => (
                                <div key={player.id} className="flex items-center glass-panel rounded-2xl overflow-hidden focus-within:ring-2 focus-within:ring-brand-light/50 transition-all">
                                    <div className="w-12 h-12 flex items-center justify-center bg-black/5 dark:bg-white/5 font-bold opacity-50 border-l border-black/10 dark:border-white/10">
                                        {idx + 1}
                                    </div>
                                    <input
                                        type="text"
                                        placeholder={`اسم اللاعب`}
                                        value={player.name}
                                        onChange={(e) => updateName(idx, e.target.value)}
                                        className="flex-1 bg-transparent px-4 py-3 font-bold focus:outline-none placeholder-slate-400"
                                        required
                                    />
                                </div>
                            ))}
                        </div>
                        <button type="submit" className="glass-btn w-full py-4 rounded-2xl font-black text-lg flex items-center justify-center gap-2 mt-4 shadow-xl">
                            توزيع الأدوار <i className="fa-solid fa-shuffle"></i>
                        </button>
                    </form>
                </div>
            );
        }

        function AssignmentPhase({ player, gameData, isLast, onNext, currentIndex, totalPlayers }) {
            const [isScanning, setIsScanning] = useState(false);
            const [hasScanned, setHasScanned] = useState(false);

            const isLiar = gameData.liarIndex === currentIndex;

            useEffect(() => {
                setIsScanning(false);
                setHasScanned(false);
            }, [player.id]);

            const handleScan = () => {
                setIsScanning(true);
                setTimeout(() => {
                    setIsScanning(false);
                    setHasScanned(true);
                }, 2000);
            };

            return (
                <div className="flex flex-col h-[75vh] animate-fade-in">
                    {/* Progress indicator */}
                    <div className="flex gap-1 justify-center mb-8 mx-auto w-3/4">
                        {Array.from({ length: totalPlayers }).map((_, idx) => (
                            <div key={idx} className={`h-1.5 rounded-full transition-all duration-500 ${idx === currentIndex ? 'w-8 bg-brand-light' : idx < currentIndex ? 'w-2 bg-brand-light/50' : 'w-2 bg-slate-300 dark:bg-slate-700'}`} />
                        ))}
                    </div>

                    <div className="flex-1 flex flex-col items-center justify-center w-full max-w-sm mx-auto">
                        <div className="text-center mb-8 w-full">
                            <p className="text-sm font-bold opacity-70 mb-1">دورك يا</p>
                            <h2 className="text-4xl font-black text-brand-light drop-shadow-sm">{player.name}</h2>
                        </div>

                        <div className={`w-full aspect-[4/5] rounded-[2.5rem] transition-all duration-500 relative overflow-hidden flex flex-col items-center justify-center p-6 shadow-2xl
                            ${!hasScanned && !isScanning ? 'glass-panel' :
                                isScanning ? 'bg-cyan-50 dark:bg-cyan-900/30 border-2 border-cyan-400' :
                                    isLiar ? 'bg-red-50 dark:bg-red-900/40 border-2 border-red-400' : 'bg-blue-50 dark:bg-blue-900/40 border-2 border-blue-400'}`}>

                            {isScanning && (
                                <div className="absolute left-0 right-0 h-2 bg-cyan-400/80 shadow-[0_0_20px_rgba(34,211,238,0.8)] animate-scan z-20"></div>
                            )}

                            {!isScanning && !hasScanned ? (
                                <div className="flex flex-col items-center opacity-40">
                                    <i className="fa-solid fa-fingerprint text-7xl mb-4"></i>
                                    <p className="font-bold">السالفة مخفية</p>
                                </div>
                            ) : isScanning ? (
                                <div className="flex flex-col items-center animate-pulse text-cyan-600 dark:text-cyan-400">
                                    <i className="fa-solid fa-spinner fa-spin text-6xl mb-4"></i>
                                    <p className="font-black text-xl tracking-widest">جاري الكشف...</p>
                                </div>
                            ) : (
                                <div className="flex flex-col items-center text-center z-10 w-full animate-fade-scale">
                                    {isLiar ? (
                                        <>
                                            <i className="fa-solid fa-user-ninja text-7xl text-red-500 mb-6 drop-shadow-md"></i>
                                            <h3 className="text-4xl font-black text-red-500 mb-2">أنت برا السالفة!</h3>
                                            <p className="font-bold opacity-80 bg-white/50 dark:bg-black/20 px-4 py-2 rounded-xl mt-2">حاول تخدعهم وتعرف السالفة 😉</p>
                                        </>
                                    ) : (
                                        <>
                                            <i className="fa-solid fa-lightbulb text-6xl text-amber-400 mb-6 drop-shadow-md"></i>
                                            <p className="font-bold opacity-70 mb-2">السالفة هي:</p>
                                            <h3 className="text-4xl font-black text-brand-light bg-white/80 dark:bg-slate-800/80 w-full py-4 rounded-2xl shadow-sm">{gameData.secretWord}</h3>
                                        </>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="mt-8 max-w-sm mx-auto w-full">
                        {!isScanning && !hasScanned ? (
                            <button onClick={handleScan} className="glass-btn w-full py-4 rounded-2xl font-black text-lg flex items-center justify-center gap-2">
                                اكشف لي الدور 👁️
                            </button>
                        ) : hasScanned ? (
                            <button onClick={onNext} className="w-full bg-slate-800 text-white dark:bg-white dark:text-slate-900 py-4 rounded-2xl font-black text-lg shadow-lg hover:scale-[1.02] transition-transform flex items-center justify-center gap-2">
                                {isLast ? 'ابدأ التحقيق 🕵️‍♂️' : 'فهمت، اخفي ومرر الجوال'}
                                {!isLast && <i className="fa-solid fa-check ml-2"></i>}
                            </button>
                        ) : null}
                    </div>
                </div>
            );
        }

        function GamePhase({ players, onFinish }) {
            const [timeLeft, setTimeLeft] = useState(120); // 2 minutes
            const [turnIndex, setTurnIndex] = useState(0);

            useEffect(() => {
                if (timeLeft <= 0) return;
                const timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                return () => clearInterval(timer);
            }, [timeLeft]);

            const asker = players[turnIndex % players.length].name;
            const target = players[(turnIndex + 1) % players.length].name;

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60);
                const s = secs % 60;
                return `0${m}:${s < 10 ? '0' : ''}${s}`;
            };

            const isWarning = timeLeft <= 30 && timeLeft > 10;
            const isDanger = timeLeft <= 10;

            return (
                <div className="animate-fade-in pt-8 max-w-sm mx-auto flex flex-col items-center">
                    <h2 className="text-3xl font-black mb-8 text-center">وقت التحقيق 🔍</h2>

                    {/* Timer Circle */}
                    <div className="relative w-48 h-48 mb-10 flex items-center justify-center">
                        <svg className="absolute inset-0 w-full h-full transform -rotate-90">
                            <circle cx="96" cy="96" r="88" className="stroke-slate-200 dark:stroke-slate-700" strokeWidth="12" fill="none" />
                            <circle cx="96" cy="96" r="88"
                                className={`transition-all duration-1000 ease-linear ${isDanger ? 'stroke-red-500' : isWarning ? 'stroke-yellow-500' : 'stroke-brand-light'}`}
                                strokeWidth="12" fill="none" strokeDasharray="553" strokeDashoffset={553 - (553 * timeLeft) / 120} strokeLinecap="round"
                            />
                        </svg>
                        <span className={`text-5xl font-black relative z-10 ${isDanger ? 'text-red-500 animate-pulse' : ''}`}>{formatTime(timeLeft)}</span>
                    </div>

                    {/* Turn Info */}
                    <div className="glass-panel w-full p-4 rounded-2xl mb-8 flex items-center justify-center gap-3 text-lg font-bold shadow-md">
                        <span className="text-brand-light font-black">{asker}</span>
                        <i className="fa-solid fa-arrow-left text-slate-400"></i>
                        <span>يسأل</span>
                        <span className="text-accent-light font-black">{target}</span>
                    </div>

                    {/* Controls */}
                    <div className="w-full space-y-3">
                        <button onClick={() => setTurnIndex(prev => prev + 1)} className="w-full bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 py-3 rounded-2xl font-black text-lg hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                            السؤال التالي <i className="fa-solid fa-forward-step ml-1"></i>
                        </button>
                        <button onClick={() => setTimeLeft(prev => prev + 30)} className="w-full bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 py-2 rounded-xl font-bold text-sm">
                            وقت إضافي (+30ث) <i className="fa-solid fa-plus"></i>
                        </button>
                        <div className="h-px bg-slate-200 dark:bg-slate-700 my-4"></div>
                        <button onClick={onFinish} className="glass-btn w-full py-4 rounded-2xl font-black text-lg flex items-center justify-center gap-2">
                            إنهاء وبدء التصويت 🗳️
                        </button>
                    </div>
                </div>
            );
        }

        function VotingPhase({ players, turnData, setTurnData, onComplete }) {
            const voterIndex = turnData.votingPlayerIndex;
            const voter = players[voterIndex];
            const [selectedVote, setSelectedVote] = useState(null);

            const handleVoteSubmit = () => {
                if (selectedVote === null) return;

                const newVotes = { ...turnData.votes };
                const votedName = players[selectedVote].name;
                newVotes[votedName] = (newVotes[votedName] || 0) + 1;

                if (voterIndex < players.length - 1) {
                    setTurnData({
                        ...turnData,
                        votes: newVotes,
                        votingPlayerIndex: voterIndex + 1
                    });
                    setSelectedVote(null);
                } else {
                    onComplete(newVotes);
                }
            };

            return (
                <div className="animate-fade-in pt-8 max-w-sm mx-auto">
                    <div className="text-center mb-6">
                        <div className="w-16 h-16 mx-auto bg-accent-light/20 text-accent-light rounded-full flex items-center justify-center text-3xl mb-4">
                            <i className="fa-solid fa-gavel"></i>
                        </div>
                        <h2 className="text-3xl font-black mb-2">من هو المخادع؟ 🤔</h2>
                        <p className="inline-block glass-panel px-4 py-2 rounded-xl text-sm font-bold mt-2">
                            دور <span className="text-brand-light text-lg mx-1">{voter.name}</span> في التصويت
                        </p>
                    </div>

                    <div className="space-y-3 mb-8">
                        {players.map((p, idx) => {
                            if (idx === voterIndex) return null;
                            const isSelected = selectedVote === idx;
                            return (
                                <button
                                    key={p.id}
                                    onClick={() => setSelectedVote(idx)}
                                    className={`w-full flex items-center justify-between p-4 rounded-2xl transition-all duration-200 border-2 
                                        ${isSelected ? 'bg-brand-light/10 border-brand-light shadow-md transform translate-x-1' : 'glass-panel border-transparent hover:border-slate-300'}`}
                                >
                                    <span className="font-black text-lg">{p.name}</span>
                                    <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors
                                        ${isSelected ? 'border-brand-light' : 'border-slate-400'}`}>
                                        {isSelected && <div className="w-3 h-3 rounded-full bg-brand-light"></div>}
                                    </div>
                                </button>
                            )
                        })}
                    </div>

                    <button
                        onClick={handleVoteSubmit}
                        disabled={selectedVote === null}
                        className={`w-full py-4 rounded-2xl font-black text-lg transition-all shadow-lg flex items-center justify-center gap-2
                            ${selectedVote === null ? 'bg-slate-300 dark:bg-slate-700 opacity-50 cursor-not-allowed text-slate-500' : 'glass-btn'}`}
                    >
                        تأكيد التصويت <i className="fa-solid fa-check-circle"></i>
                    </button>
                </div>
            );
        }

        function ResultPhase({ players, setPlayers, gameData, votes, onNextRound, onEndGame }) {
            // Logic for calculating winner
            let maxVotes = 0;
            let mostVotedPlayer = null;
            let tie = false;

            for (const pName in votes) {
                if (votes[pName] > maxVotes) {
                    maxVotes = votes[pName];
                    mostVotedPlayer = pName;
                    tie = false;
                } else if (votes[pName] === maxVotes) {
                    tie = true;
                }
            }

            const liarName = players[gameData.liarIndex].name;
            const detectivesWin = (mostVotedPlayer === liarName && !tie);

            // Calculate Scores only once
            const [finalPlayers, setFinalPlayers] = useState([]);

            useEffect(() => {
                const updatedPlayers = players.map(p => ({ ...p }));
                if (detectivesWin) {
                    updatedPlayers.forEach((p, i) => {
                        if (i !== gameData.liarIndex) p.score += 100;
                    });
                } else {
                    updatedPlayers[gameData.liarIndex].score += 200;
                }
                setFinalPlayers(updatedPlayers.sort((a, b) => b.score - a.score));
                setPlayers(updatedPlayers); // sync with app state
            }, []);

            return (
                <div className="animate-fade-scale pt-6 max-w-md mx-auto">
                    <h2 className="text-3xl font-black text-center mb-6">النتيجة 🏁</h2>

                    <div className={`p-6 rounded-[2rem] border-4 shadow-xl mb-8 relative overflow-hidden text-center
                        ${detectivesWin ? 'bg-emerald-50 dark:bg-emerald-900/30 border-emerald-400' : 'bg-red-50 dark:bg-red-900/30 border-red-400'}`}>

                        <div className="text-6xl mb-4 relative z-10">{detectivesWin ? '🕵️‍♂️✅' : '😎🏆'}</div>
                        <h3 className={`text-2xl font-black mb-3 relative z-10 ${detectivesWin ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-600 dark:text-red-400'}`}>
                            {detectivesWin ? 'كفو! كشفتوا المخادع' : 'أفاا.. فاز المخادع عليكم!'}
                        </h3>
                        <div className="glass-panel inline-block px-4 py-2 rounded-xl relative z-10">
                            <span className="font-bold opacity-80">المخادع كان: </span>
                            <span className="font-black text-lg text-red-500 mx-1">{liarName}</span>
                        </div>

                        {/* Background decor */}
                        <div className={`absolute -right-10 -bottom-10 w-40 h-40 rounded-full blur-2xl opacity-20 ${detectivesWin ? 'bg-emerald-500' : 'bg-red-500'}`}></div>
                    </div>

                    {/* Scoreboard */}
                    <div className="glass-panel p-5 rounded-3xl mb-8">
                        <h3 className="font-black text-sm uppercase opacity-60 tracking-wider mb-4 border-b border-black/10 dark:border-white/10 pb-2">لوحة الشرف</h3>
                        <div className="space-y-3">
                            {finalPlayers.map((p, idx) => {
                                const maxScore = Math.max(...finalPlayers.map(x => x.score)) || 1;
                                const pct = (p.score / maxScore) * 100;
                                const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '';

                                return (
                                    <div key={p.id} className="flex items-center gap-3 bg-white/50 dark:bg-slate-800/50 p-2 rounded-2xl">
                                        <div className="w-10 h-10 rounded-xl bg-slate-200 dark:bg-slate-700 flex items-center justify-center font-black shrink-0">{p.name.charAt(0)}</div>
                                        <div className="flex-1">
                                            <div className="flex justify-between items-center mb-1">
                                                <span className="font-bold text-sm">{p.name} {medal}</span>
                                                <span className="font-black text-brand-light">{p.score}</span>
                                            </div>
                                            <div className="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                                                <div className="h-full bg-brand-light rounded-full transition-all duration-1000" style={{ width: `${pct}%` }}></div>
                                            </div>
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>

                    <div className="flex flex-col gap-3">
                        <button onClick={onNextRound} className="glass-btn w-full py-4 rounded-2xl font-black text-lg flex items-center justify-center gap-2">
                            جولة جديدة بنفس اللاعبين 🔄
                        </button>
                        <button onClick={onEndGame} className="w-full bg-transparent border-2 border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300 py-3 rounded-2xl font-bold hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                            إنهاء والعودة للرئيسية <i className="fa-solid fa-house ml-1"></i>
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
