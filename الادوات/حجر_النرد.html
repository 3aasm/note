<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1e293b">
    <title>حجر النرد - أدواتي</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        factory: { base: '#0f172a', surface: '#1e293b', panel: '#334155', accent: '#f59e0b', text: '#f8fafc', textMuted: '#94a3b8' }
                    },
                    boxShadow: { 'industrial': 'inset 0 2px 4px rgba(255,255,255,0.1), 0 8px 16px rgba(0,0,0,0.4)' }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a; color: #f8fafc;
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 30px 30px; font-family: 'Cairo', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .header-bar {
            background: #1e293b; border-bottom: 4px solid #f59e0b; box-shadow: 0 4px 15px rgba(0,0,0,0.5); position: relative;
        }
        .industrial-card {
            background: linear-gradient(145deg, #1e293b, #0f172a); border: 2px solid #334155; border-radius: 24px;
            box-shadow: 10px 10px 20px #060a12, -10px -10px 20px #182436;
        }
        .dice-container { perspective: 1000px; }
        .dice {
            width: 120px; height: 120px; position: relative; transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .face {
            position: absolute; width: 100%; height: 100%; background: #e2e8f0; border: 4px solid #334155;
            border-radius: 20px; display: grid; grid-template-areas: "a . c" "e g f" "d . b";
            padding: 15px; box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
        }
        .dot { display: block; width: 18px; height: 18px; border-radius: 50%; background-color: #1e293b; box-shadow: inset 0 3px 5px rgba(0,0,0,0.5); align-self: center; justify-self: center; }
        .face[data-id="1"] .dot { grid-area: g; }
        .face[data-id="2"] .dot:nth-child(1) { grid-area: a; } .face[data-id="2"] .dot:nth-child(2) { grid-area: b; }
        .face[data-id="3"] .dot:nth-child(1) { grid-area: a; } .face[data-id="3"] .dot:nth-child(2) { grid-area: g; } .face[data-id="3"] .dot:nth-child(3) { grid-area: b; }
        .face[data-id="4"] .dot:nth-child(1) { grid-area: a; } .face[data-id="4"] .dot:nth-child(2) { grid-area: c; } .face[data-id="4"] .dot:nth-child(3) { grid-area: d; } .face[data-id="4"] .dot:nth-child(4) { grid-area: b; }
        .face[data-id="5"] .dot:nth-child(1) { grid-area: a; } .face[data-id="5"] .dot:nth-child(2) { grid-area: c; } .face[data-id="5"] .dot:nth-child(3) { grid-area: g; } .face[data-id="5"] .dot:nth-child(4) { grid-area: d; } .face[data-id="5"] .dot:nth-child(5) { grid-area: b; }
        .face[data-id="6"] .dot:nth-child(1) { grid-area: a; } .face[data-id="6"] .dot:nth-child(2) { grid-area: c; } .face[data-id="6"] .dot:nth-child(3) { grid-area: e; } .face[data-id="6"] .dot:nth-child(4) { grid-area: f; } .face[data-id="6"] .dot:nth-child(5) { grid-area: d; } .face[data-id="6"] .dot:nth-child(6) { grid-area: b; }
        
        .face:nth-child(1) { transform: rotateY(0deg) translateZ(60px); }
        .face:nth-child(2) { transform: rotateX(180deg) translateZ(60px); }
        .face:nth-child(3) { transform: rotateY(90deg) translateZ(60px); }
        .face:nth-child(4) { transform: rotateY(-90deg) translateZ(60px); }
        .face:nth-child(5) { transform: rotateX(90deg) translateZ(60px); }
        .face:nth-child(6) { transform: rotateX(-90deg) translateZ(60px); }

        .btn-roll { background: linear-gradient(145deg, #f59e0b, #d97706); color: #0f172a; box-shadow: 0 5px 15px rgba(245, 158, 11, 0.4); }
        .btn-roll:active { transform: translateY(4px); box-shadow: 0 0 0 rgba(245, 158, 11, 0.4); }
        
        @keyframes shake {
            0% { transform: rotateX(0) rotateY(0) rotateZ(0); }
            25% { transform: rotateX(180deg) rotateY(90deg) rotateZ(45deg); }
            50% { transform: rotateX(360deg) rotateY(180deg) rotateZ(90deg); }
            75% { transform: rotateX(540deg) rotateY(270deg) rotateZ(135deg); }
            100% { transform: rotateX(720deg) rotateY(360deg) rotateZ(180deg); }
        }
        .rolling { animation: shake 0.6s linear infinite; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden selection:bg-factory-accent/30">
    <header class="header-bar h-20 shrink-0 flex items-center justify-start px-6 z-30">
        <h1 class="text-2xl font-black text-white flex items-center gap-2">
            <i class="fa-solid fa-dice text-factory-accent"></i> حجر النرد
        </h1>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center px-4 relative">
        <div class="w-full max-w-sm p-8 flex flex-col items-center relative z-10">
            <div class="text-factory-textMuted font-bold text-sm mb-12 bg-factory-base px-4 py-1 rounded-full border border-factory-panel shadow-inner">مولد أرقام عشوائي</div>

            <div class="dice-container mb-12">
                <div class="dice" id="dice">
                    <div class="face" data-id="1"><span class="dot"></span></div>
                    <div class="face" data-id="2"><span class="dot"></span><span class="dot"></span></div>
                    <div class="face" data-id="3"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
                    <div class="face" data-id="4"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
                    <div class="face" data-id="5"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
                    <div class="face" data-id="6"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
                </div>
            </div>

            <h2 id="result-text" class="text-4xl font-black text-white mb-8 h-12 drop-shadow-md flex items-center justify-center">الرقم: ?</h2>

            <button onclick="rollDice()" class="btn-roll w-full py-4 rounded-xl text-xl font-black flex items-center justify-center gap-3 transition-transform">
                <i class="fa-solid fa-rotate-right text-2xl"></i> ارمي النرد
            </button>
        </div>
    </main>

    <script>
        const dice = document.getElementById('dice');
        const resultText = document.getElementById('result-text');
        let isRolling = false;

        function rollDice() {
            if (isRolling) return;
            isRolling = true;
            resultText.innerHTML = '<span class="text-2xl text-factory-textMuted">جاري الرمي...</span>';
            
            // Random rotations to make it spin crazily
            const randomX = Math.floor(Math.random() * 4) * 360 + 720;
            const randomY = Math.floor(Math.random() * 4) * 360 + 720;
            const randomZ = Math.floor(Math.random() * 4) * 360 + 720;

            dice.style.transition = 'transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            dice.style.transform = `rotateX(${randomX}deg) rotateY(${randomY}deg) rotateZ(${randomZ}deg)`;

            setTimeout(() => {
                const randomValue = Math.floor(Math.random() * 6) + 1;
                
                let x = 0, y = 0;
                switch(randomValue) {
                    case 1: x = 0; y = 0; break;
                    case 2: x = 180; y = 0; break;
                    case 3: x = 0; y = -90; break;
                    case 4: x = 0; y = 90; break;
                    case 5: x = -90; y = 0; break;
                    case 6: x = 90; y = 0; break;
                }
                
                // Add extra turns so it doesn't just snap back
                dice.style.transition = 'transform 0.5s ease-out';
                dice.style.transform = `rotateX(${x + 1440}deg) rotateY(${y + 1440}deg)`;
                
                setTimeout(() => {
                    resultText.innerHTML = `<span class="text-factory-accent">الرقم: </span> ${randomValue}`;
                    
                    // Reset without animation so next roll starts from here smoothly
                    dice.style.transition = 'none';
                    dice.style.transform = `rotateX(${x}deg) rotateY(${y}deg)`;
                    isRolling = false;
                }, 500);

            }, 1000);
        }
    </script>
</body>
</html>
