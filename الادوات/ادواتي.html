<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1e293b">
    <title>أدواتي</title>
    <link rel="icon" type="image/png" href="../صورة التطبيق.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        factory: {
                            base: '#0f172a',    /* Slate 900 */
                            surface: '#1e293b', /* Slate 800 */
                            panel: '#334155',   /* Slate 700 */
                            accent: '#f59e0b',  /* Amber 500 */
                            accentDark: '#d97706', /* Amber 600 */
                            text: '#f8fafc',    /* Slate 50 */
                            textMuted: '#94a3b8' /* Slate 400 */
                        }
                    },
                    boxShadow: {
                        'neon': '0 0 10px rgba(245, 158, 11, 0.5), 0 0 20px rgba(245, 158, 11, 0.3)',
                        'industrial': 'inset 0 2px 4px rgba(255,255,255,0.1), 0 8px 16px rgba(0,0,0,0.4)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: 'Cairo', sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* شريط التمرير */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #334155;
            border-radius: 10px;
        }

        .industrial-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 2px solid #334155;
            border-radius: 16px;
            box-shadow: 8px 8px 16px #060a12, -8px -8px 16px #182436;
            transition: all 0.3s ease;
        }

        .industrial-card:hover {
            transform: translateY(-5px);
            border-color: #f59e0b;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
        }

        .screw {
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, #94a3b8, #475569);
            border-radius: 50%;
            position: absolute;
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.5), inset -1px -1px 2px rgba(0,0,0,0.8);
        }
        .screw::after {
            content: '';
            position: absolute;
            width: 60%;
            height: 2px;
            background: #1e293b;
            top: 50%;
            left: 20%;
            transform: translateY(-50%) rotate(45deg);
        }
        
        .header-bar {
            background: #1e293b;
            border-bottom: 4px solid #f59e0b;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
        }
        
        .header-bar::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 4px;
            background: repeating-linear-gradient(
                45deg,
                #f59e0b,
                #f59e0b 10px,
                #0f172a 10px,
                #0f172a 20px
            );
        }

        .game-icon-bg {
            background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
            border-radius: 24px;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.1), 0 8px 16px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* نافذة الأداة / اللعبة */
        #game-sheet-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #game-sheet-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        #game-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            z-index: 101;
            transform: translateY(100%);
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #game-sheet.active {
            transform: translateY(0);
            opacity: 1;
        }

        /* مودالات */
        .modal-base {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            padding: 1rem;
        }

        .modal-base.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-panel {
            background: #1e293b;
            color: #f8fafc;
            width: 100%;
            max-width: 380px;
            padding: 2rem;
            border-radius: 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: scale(0.9) translateY(20px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-base.active .modal-panel {
            transform: scale(1) translateY(0);
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden selection:bg-factory-accent/30">
    <!-- الشريط العلوي -->
    <header class="header-bar h-20 lg:h-24 shrink-0 flex items-center justify-between px-6 lg:px-10 z-30">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='../index.html'" class="w-10 h-10 lg:w-12 lg:h-12 rounded-xl bg-factory-panel flex items-center justify-center text-factory-accent hover:bg-factory-base transition-colors border border-gray-600 shadow-md">
                <i class="fa-solid fa-gamepad text-lg lg:text-xl"></i>
            </button>
            <h1 class="text-2xl lg:text-3xl font-black tracking-tight text-white flex items-center gap-2">
                <i class="fa-solid fa-toolbox text-factory-accent text-xl lg:text-2xl"></i>
                أدواتي
            </h1>
        </div>
        <img src="../صورة التطبيق.png" alt="التطبيق" class="w-11 h-11 lg:w-14 lg:h-14 rounded-[14px] border-2 border-factory-accent shadow-neon cursor-pointer" onclick="window.location.href='../index.html'">
    </header>

    <!-- المحتوى -->
    <main class="flex-1 overflow-y-auto px-4 lg:px-10 py-6 scroll-smooth relative">
        <div class="max-w-5xl mx-auto">
            
            <!-- لوحة تحكم علوية -->
            <div class="industrial-card p-6 md:p-8 mb-8 relative overflow-hidden flex flex-col md:flex-row items-center justify-between">
                <div class="screw top-3 left-3"></div>
                <div class="screw top-3 right-3"></div>
                <div class="screw bottom-3 left-3"></div>
                <div class="screw bottom-3 right-3"></div>
                
                <div class="flex items-center gap-4 mb-4 md:mb-0 z-10 w-full md:w-auto">
                    <div class="w-16 h-16 shrink-0 bg-factory-panel rounded-full flex items-center justify-center border-2 border-factory-accent shadow-neon">
                        <i class="fa-solid fa-industry text-3xl text-factory-accent"></i>
                    </div>
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="bg-white/10 text-factory-accent text-[10px] font-bold px-2 py-0.5 rounded-full uppercase border border-factory-accent/30">مصنع الأدوات</span>
                            <h2 class="text-xl lg:text-2xl font-black text-white">وحدة التحكم المركزية</h2>
                        </div>
                        <p class="text-sm text-factory-textMuted font-bold">نظام التشغيل الآلي للمعدات والأدوات</p>
                    </div>
                </div>
                
                <div class="flex gap-3 z-10">
                    <div class="w-4 h-4 rounded-full bg-red-500 animate-pulse shadow-[0_0_10px_#ef4444]"></div>
                    <div class="w-4 h-4 rounded-full bg-yellow-500 shadow-[0_0_10px_#eab308]"></div>
                    <div class="w-4 h-4 rounded-full bg-green-500 shadow-[0_0_10px_#22c55e]"></div>
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6 pt-4">
                <!-- أداة حجر النرد -->
                <div onclick="openGameSheet('حجر_النرد.html')" class="industrial-card p-5 cursor-pointer flex flex-col items-center text-center group relative hover:-translate-y-2 transition-transform duration-300">
                    <div class="screw top-2 left-2"></div>
                    <div class="screw top-2 right-2"></div>
                    <div class="screw bottom-2 left-2"></div>
                    <div class="screw bottom-2 right-2"></div>

                    <div class="w-24 h-24 game-icon-bg mb-4 relative group-hover:border-factory-accent border-2 border-transparent transition-colors">
                        <i class="fa-solid fa-dice text-5xl text-white group-hover:text-factory-accent group-hover:scale-110 transition-all drop-shadow-md"></i>
                        <div class="absolute -bottom-2 bg-factory-accent text-factory-base text-[10px] font-black px-3 py-1 rounded-full border-2 border-factory-base shadow-sm">
                            أداة
                        </div>
                    </div>
                    <h3 class="font-black text-lg text-white mb-1">حجر النرد</h3>
                    <p class="text-[10px] text-factory-textMuted font-bold">مولد أرقام عشوائي</p>
                    
                    <div class="mt-4 w-12 h-1 bg-factory-panel rounded-full overflow-hidden">
                        <div class="h-full bg-factory-accent w-1/3 group-hover:w-full transition-all duration-500"></div>
                    </div>
                </div>

                <!-- أداة حجرة ورقة مقص -->
                <div onclick="openGameSheet('حجرة_ورقة_مقص.html')" class="industrial-card p-5 cursor-pointer flex flex-col items-center text-center group relative hover:-translate-y-2 transition-transform duration-300">
                    <div class="screw top-2 left-2"></div>
                    <div class="screw top-2 right-2"></div>
                    <div class="screw bottom-2 left-2"></div>
                    <div class="screw bottom-2 right-2"></div>

                    <div class="w-24 h-24 game-icon-bg mb-4 relative group-hover:border-factory-accent border-2 border-transparent transition-colors">
                        <i class="fa-solid fa-hand-scissors text-5xl text-white group-hover:text-factory-accent group-hover:scale-110 transition-all drop-shadow-md"></i>
                        <div class="absolute -bottom-2 bg-blue-500 text-white text-[10px] font-black px-3 py-1 rounded-full border-2 border-factory-base shadow-sm">
                            تحدي
                        </div>
                    </div>
                    <h3 class="font-black text-lg text-white mb-1">حجرة ورقة مقص</h3>
                    <p class="text-[10px] text-factory-textMuted font-bold">جهاز اتخاذ القرارات</p>
                    
                    <div class="mt-4 w-12 h-1 bg-factory-panel rounded-full overflow-hidden">
                        <div class="h-full bg-factory-accent w-1/3 group-hover:w-full transition-all duration-500"></div>
                    </div>
                </div>

                <!-- قريباً -->
                <div class="industrial-card p-5 flex flex-col items-center text-center opacity-70 relative">
                    <div class="screw top-2 left-2"></div>
                    <div class="screw top-2 right-2"></div>
                    <div class="screw bottom-2 left-2"></div>
                    <div class="screw bottom-2 right-2"></div>

                    <div class="w-24 h-24 game-icon-bg mb-4 flex items-center justify-center bg-factory-panel">
                        <i class="fa-solid fa-lock text-4xl text-factory-textMuted"></i>
                    </div>
                    <h3 class="font-black text-lg text-factory-textMuted mb-1">أداة جديدة</h3>
                    <span class="bg-factory-panel text-factory-textMuted text-[10px] font-bold px-3 py-1 rounded-md mt-1 border border-factory-base">قريباً</span>
                </div>
            </div>

        </div>
    </main>

    <!-- Game Sheet -->
    <div id="game-sheet-overlay" onclick="closeGameSheet()"></div>
    <div id="game-sheet">
        <div class="h-full w-full relative overflow-hidden">
            <!-- زر الخروج المتمدد -->
            <div class="absolute top-0 left-0 w-full p-4 z-50 pointer-events-none flex justify-start">
                <div id="game-exit-container"
                    class="pointer-events-auto absolute top-4 left-4 z-20 flex items-center bg-[#334155] rounded-2xl shadow-[0_4px_0_#0f172a] overflow-hidden transition-all duration-300 ease-[cubic-bezier(0.34,1.56,0.64,1)] w-[46px] h-[46px]">
                    <button id="game-exit-btn" onclick="handleExitClick(event)"
                        onpointerdown="handleExitTouchStart(event)" onpointerup="handleExitTouchEnd(event)"
                        onpointerleave="handleExitTouchEnd(event)"
                        class="w-[46px] h-[46px] shrink-0 text-[#f59e0b] flex items-center justify-center text-xl hover:bg-[#1e293b] transition-colors pointer-events-auto outline-none">
                        <i id="game-exit-icon" class="fa-solid fa-door-open transition-transform duration-300"></i>
                    </button>
                    <div id="game-exit-confirm-content"
                        class="flex items-center justify-between pr-1 pl-3 opacity-0 pointer-events-none transition-all duration-300 w-0">
                        <span class="text-white font-black text-[13px] whitespace-nowrap ml-2">خروج؟</span>
                        <div class="flex gap-1 shrink-0">
                            <button onclick="confirmExit(true)"
                                class="bg-[#f59e0b] text-[#0f172a] w-[42px] h-[34px] rounded-xl flex items-center justify-center hover:bg-[#d97706] transition-colors shadow-sm font-black text-xs shrink-0 pointer-events-auto outline-none">
                                نعم
                            </button>
                        </div>
                    </div>
                </div>
                <button id="game-show-btn" onclick="showExitBtn()"
                    class="pointer-events-auto w-[46px] h-[36px] bg-black/50 backdrop-blur-md border border-white/10 rounded-b-2xl text-white flex items-center justify-center transition-transform duration-300 absolute top-0 left-4 z-0"
                    style="transform: translateY(-150%);">
                    <i class="fa-solid fa-chevron-down text-sm pointer-events-none"></i>
                </button>
            </div>
            <iframe id="game-iframe" src=""
                class="w-full h-full absolute inset-0 border-none bg-transparent z-0"></iframe>
        </div>
    </div>

    <!-- مودال الخروج من الأداة -->
    <div id="exit-confirm-modal" class="modal-base">
        <div class="modal-panel text-center !p-10">
            <div
                class="w-[84px] h-[84px] bg-[#FEF2F2] text-[#EF4444] rounded-full flex items-center justify-center mx-auto mb-6 text-4xl">
                <i class="fa-solid fa-door-open"></i>
            </div>
            <h4 class="text-2xl font-black text-white mb-2">هل تريد الخروج؟</h4>
            <div class="flex gap-3 mt-8">
                <button onclick="confirmExit(false)"
                    class="flex-1 py-3.5 font-black text-gray-300 bg-gray-700 hover:bg-gray-600 transition-colors rounded-2xl text-lg">متابعة</button>
                <button onclick="confirmExit(true)"
                    class="flex-1 py-3.5 bg-[#EF4444] hover:bg-red-600 transition-colors text-white font-black rounded-2xl text-lg shadow-sm">الخروج</button>
            </div>
        </div>
    </div>

    <script>
        let exitPressTimer;
        let isLongPressed = false;

        function handleExitTouchStart(e) {
            isLongPressed = false;
            exitPressTimer = setTimeout(() => {
                isLongPressed = true;
                document.getElementById('game-exit-container').style.transform = 'translateY(-150px)';
                document.getElementById('game-show-btn').style.transform = 'translateY(0)';
            }, 600);
        }

        function handleExitTouchEnd(e) {
            clearTimeout(exitPressTimer);
        }

        let isGameExitMenuOpen = false;
        function toggleGameExitMenu() {
            const container = document.getElementById('game-exit-container');
            const content = document.getElementById('game-exit-confirm-content');
            const icon = document.getElementById('game-exit-icon');

            isGameExitMenuOpen = !isGameExitMenuOpen;
            if (isGameExitMenuOpen) {
                container.classList.replace('w-[46px]', 'w-[160px]');
                content.classList.remove('w-0', 'opacity-0', 'pointer-events-none');
                content.classList.add('flex-1', 'opacity-100', 'pointer-events-auto');
                icon.classList.replace('fa-door-open', 'fa-times');
            } else {
                container.classList.replace('w-[160px]', 'w-[46px]');
                content.classList.add('w-0', 'opacity-0', 'pointer-events-none');
                content.classList.remove('flex-1', 'opacity-100', 'pointer-events-auto');
                icon.classList.replace('fa-times', 'fa-door-open');
            }
        }

        function handleExitClick(e) {
            if (isLongPressed) {
                e.preventDefault();
                return;
            }
            toggleGameExitMenu();
        }

        function showExitBtn() {
            document.getElementById('game-exit-container').style.transform = 'translateY(0)';
            document.getElementById('game-show-btn').style.transform = 'translateY(-150%)';
        }

        function openGameSheet(url) {
            document.getElementById('game-sheet').classList.add('active');
            document.getElementById('game-sheet-overlay').classList.add('active');
            const iframe = document.getElementById('game-iframe');

            iframe.onload = function () {
                try {
                    const iframeDoc = iframe.contentWindow.document;
                    iframeDoc.body.style.userSelect = 'none';
                    iframeDoc.body.style.webkitUserSelect = 'none';
                    iframeDoc.body.style.msUserSelect = 'none';
                    iframeDoc.body.style.mozUserSelect = 'none';
                    iframeDoc.addEventListener('contextmenu', e => e.preventDefault());
                    iframeDoc.addEventListener('copy', e => e.preventDefault());
                    iframeDoc.addEventListener('dragstart', e => e.preventDefault());
                } catch (e) {}
            };

            iframe.src = url;
            showExitBtn();
        }

        function closeGameSheet() {
            const modal = document.getElementById('exit-confirm-modal');
            if (modal) modal.classList.add('active');
        }

        function confirmExit(confirm) {
            const modal = document.getElementById('exit-confirm-modal');
            if (modal) modal.classList.remove('active');
            if (confirm) {
                document.getElementById('game-sheet').classList.remove('active');
                document.getElementById('game-sheet-overlay').classList.remove('active');
                setTimeout(() => document.getElementById('game-iframe').src = "", 400);
                if (isGameExitMenuOpen) toggleGameExitMenu();
            }
        }
    </script>
</body>
</html>
