<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة المافيا</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        .animate-fade-scale {
            animation: fadeScale 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeScale {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-[#111111] text-zinc-100 font-sans selection:bg-red-900 m-0">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Utility Functions ---
        const shuffleArray = (array) => {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        };

        // --- Role Definitions ---
        const ROLES = {
            MAFIA: { id: 'mafia', name: 'المافيا', icon: 'fa-crosshairs', color: 'text-red-500', bg: 'bg-red-500/10', border: 'border-red-500/30' },
            DETECTIVE: { id: 'detective', name: 'المحقق', icon: 'fa-shield-halved', color: 'text-blue-400', bg: 'bg-blue-500/10', border: 'border-blue-500/30' },
            DOCTOR: { id: 'doctor', name: 'الطبيب', icon: 'fa-heart', color: 'text-emerald-400', bg: 'bg-emerald-500/10', border: 'border-emerald-500/30' },
            CITIZEN: { id: 'citizen', name: 'مواطن عادي', icon: 'fa-user', color: 'text-zinc-400', bg: 'bg-zinc-500/10', border: 'border-zinc-500/30' }
        };

        function App() {
            // --- Global State ---
            const [gameState, setGameState] = useState('setup');
            const [players, setPlayers] = useState([
                { id: 1, name: '', role: null, isAlive: true }, 
                { id: 2, name: '', role: null, isAlive: true }, 
                { id: 3, name: '', role: null, isAlive: true },
                { id: 4, name: '', role: null, isAlive: true }
            ]);
            const [roleCounts, setRoleCounts] = useState({ mafia: 1, detective: 1, doctor: 1 });
            const [errorMsg, setErrorMsg] = useState('');
            
            // --- Assignment State ---
            const [currentPlayerIndex, setCurrentPlayerIndex] = useState(0);
            
            // --- Elimination State ---
            const [eliminatedPlayer, setEliminatedPlayer] = useState(null);
            
            // --- Game Over State ---
            const [gameWinner, setGameWinner] = useState(null);

            useEffect(() => {
                if (gameState === 'moderator') {
                    const alive = players.filter(p => p.isAlive);
                    if (alive.length > 0) {
                        const mafiaCount = alive.filter(p => p.role?.id === 'mafia').length;
                        const othersCount = alive.length - mafiaCount;
                        if (mafiaCount === 0) {
                            setGameWinner('citizens');
                            setGameState('game-over');
                        } else if (mafiaCount >= othersCount) {
                            setGameWinner('mafia');
                            setGameState('game-over');
                        }
                    }
                }
            }, [gameState, players]);


            const handleAddPlayer = () => {
                setPlayers([...players, { id: Date.now(), name: '', role: null, isAlive: true }]);
            };

            const handleRemovePlayer = (id) => {
                if (players.length <= 3) return;
                setPlayers(players.filter(p => p.id !== id));
            };

            const handleNameChange = (id, newName) => {
                setPlayers(players.map(p => p.id === id ? { ...p, name: newName } : p));
            };

            const startGame = () => {
                const emptyNames = players.some(p => p.name.trim() === '');
                if (emptyNames) {
                    setErrorMsg('يجب تعبئة جميع حقول الأسماء للبدء.');
                    return;
                }
                
                const specialRolesCount = roleCounts.mafia + roleCounts.detective + roleCounts.doctor;
                if (players.length < specialRolesCount) {
                    setErrorMsg(`عدد الأدوار المحددة (${specialRolesCount}) يتجاوز عدد اللاعبين (${players.length}).`);
                    return;
                }

                let rolePool = [];
                for (let i = 0; i < roleCounts.mafia; i++) rolePool.push(ROLES.MAFIA);
                for (let i = 0; i < roleCounts.detective; i++) rolePool.push(ROLES.DETECTIVE);
                for (let i = 0; i < roleCounts.doctor; i++) rolePool.push(ROLES.DOCTOR);
                
                const citizensCount = players.length - specialRolesCount;
                for (let i = 0; i < citizensCount; i++) rolePool.push(ROLES.CITIZEN);

                rolePool = shuffleArray(rolePool);

                const assignedPlayers = players.map((p, index) => ({
                    ...p,
                    role: rolePool[index]
                }));

                setPlayers(assignedPlayers);
                setCurrentPlayerIndex(0);
                setErrorMsg('');
                setGameState('assignment');
            };

            const resetGame = () => {
                if(window.confirm('هل أنت متأكد من إنهاء اللعبة والعودة للإعدادات؟')) {
                    setGameState('setup');
                    setPlayers(players.map(p => ({ ...p, role: null, isAlive: true })));
                    setCurrentPlayerIndex(0);
                }
            };

            return (
                <div className="min-h-[100dvh] bg-[#111111] text-zinc-100 font-sans selection:bg-red-900 flex justify-center items-center p-0">
                    <div className="w-full max-w-full sm:max-w-[480px] md:max-w-[640px] lg:max-w-[800px] bg-[#111111] min-h-[100dvh] sm:min-h-[850px] relative overflow-x-hidden flex flex-col mx-auto transition-all duration-300">
                        
                        <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[30%] bg-red-900/20 blur-[100px] pointer-events-none"></div>
                        
                        {(gameState === 'setup' || gameState === 'moderator') && (
                        <header className="px-8 pt-10 pb-6 flex items-center justify-between z-10">
                            <div>
                            <h1 className="text-3xl font-black tracking-tight text-white flex items-center gap-2">
                                المافيا <span className="w-2 h-2 rounded-full bg-red-600 animate-pulse"></span>
                            </h1>
                            <p className="text-sm text-zinc-500 font-medium mt-1 uppercase tracking-wider">بروتوكول التحقيق</p>
                            </div>
                        </header>
                        )}

                        <main className="flex-1 overflow-y-auto overflow-x-hidden relative scrollbar-hide">
                        {gameState === 'setup' && (
                            <SetupPhase 
                            players={players} 
                            roleCounts={roleCounts} 
                            setRoleCounts={setRoleCounts}
                            handleAddPlayer={handleAddPlayer}
                            handleRemovePlayer={handleRemovePlayer}
                            handleNameChange={handleNameChange}
                            startGame={startGame}
                            errorMsg={errorMsg}
                            />
                        )}

                        {gameState === 'assignment' && (
                            <AssignmentPhase 
                            player={players[currentPlayerIndex]}
                            onNext={() => {
                                if (currentPlayerIndex < players.length - 1) {
                                setCurrentPlayerIndex(prev => prev + 1);
                                } else {
                                setGameState('moderator');
                                }
                            }}
                            onCancel={resetGame}
                            isLast={currentPlayerIndex === players.length - 1}
                            totalPlayers={players.length}
                            currentIndex={currentPlayerIndex}
                            />
                        )}

                        {gameState === 'moderator' && (
                            <ModeratorPhase 
                            players={players} 
                            onGoToElimination={() => setGameState('elimination')}
                            onReset={resetGame}
                            onManualEnd={(winner) => {
                                setGameWinner(winner);
                                setGameState('game-over');
                            }}
                            />
                        )}

                        {gameState === 'elimination' && (
                            <EliminationPhase 
                            players={players}
                            onEliminate={(id) => {
                                const p = players.find(p => p.id === id);
                                setEliminatedPlayer(p);
                                setPlayers(players.map(p => p.id === id ? { ...p, isAlive: false } : p));
                                setGameState('animation');
                            }}
                            onCancel={() => setGameState('moderator')}
                            />
                        )}
                        </main>

                        {gameState === 'animation' && eliminatedPlayer && (
                        <div className="absolute inset-0 z-50 bg-[#050505] flex flex-col items-center justify-center p-6">
                            <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-red-900/30 via-[#050505] to-[#050505]"></div>
                            
                            <div className="relative z-10 flex flex-col items-center text-center animate-fade-scale">
                            <div className="w-32 h-32 mb-8 rounded-full border border-red-500/30 bg-red-950/20 flex items-center justify-center relative overflow-hidden">
                                <div className="absolute inset-0 border-[4px] border-red-600 rounded-full animate-[spin_3s_linear_infinite] border-t-transparent"></div>
                                <i className="fa-solid fa-skull w-16 h-16 text-6xl text-red-500 drop-shadow-[0_0_15px_rgba(220,38,38,0.5)] flex items-center justify-center"></i>
                            </div>
                            
                            <div className="uppercase tracking-[0.3em] text-red-500/80 text-sm font-bold mb-4">تم الإقصاء والنفي</div>
                            <h2 className="text-5xl font-black text-white mb-6 tracking-tight">{eliminatedPlayer.name}</h2>
                            
                            <div className="flex items-center gap-3 bg-zinc-900/80 px-6 py-3 rounded-2xl border border-zinc-800">
                                <span className="text-zinc-400">الهوية الحقيقية:</span>
                                <span className={`font-bold text-xl ${eliminatedPlayer.role.color} flex items-center gap-2`}>
                                <i className={`fa-solid ${eliminatedPlayer.role.icon} w-5 h-5`}></i>
                                {eliminatedPlayer.role.name}
                                </span>
                            </div>
                            
                            <button 
                                onClick={() => {
                                    setGameState('moderator');
                                    setEliminatedPlayer(null);
                                }}
                                className="mt-12 bg-[#161616] border border-zinc-800 text-white font-bold py-4 px-8 rounded-2xl hover:bg-zinc-800 transition-colors flex items-center gap-3 shadow-[0_0_20px_rgba(0,0,0,0.5)] text-lg animate-fade-in opacity-0"
                                style={{ animationDelay: '1.5s', animationFillMode: 'forwards' }}
                            >
                                استمرار اللعبة <i className="fa-solid fa-play ml-1"></i>
                            </button>
                            </div>
                        </div>
                        )}

                        {gameState === 'game-over' && (
                            <GameOverPhase winner={gameWinner} onReset={resetGame} />
                        )}
                    </div>
                </div>
            );
        }

        function SetupPhase({ players, roleCounts, setRoleCounts, handleAddPlayer, handleRemovePlayer, handleNameChange, startGame, errorMsg }) {
            return (
                <div className="px-8 pb-32 space-y-10 animate-fade-in pt-4">
                <section>
                    <div className="flex items-center justify-between mb-4">
                    <h2 className="text-sm font-bold text-zinc-400 uppercase tracking-wider flex items-center gap-2">
                        <i className="fa-solid fa-gear w-4 h-4"></i> توزيع الأدوار
                    </h2>
                    </div>
                    
                    <div className="grid grid-cols-3 gap-3">
                    {[
                        { id: 'mafia', label: 'المافيا', icon: 'fa-crosshairs', color: 'text-red-500', bg: 'bg-red-500/10', border: 'border-red-500/20' },
                        { id: 'detective', label: 'المحقق', icon: 'fa-shield-halved', color: 'text-blue-400', bg: 'bg-blue-500/10', border: 'border-blue-500/20' },
                        { id: 'doctor', label: 'الطبيب', icon: 'fa-heart', color: 'text-emerald-400', bg: 'bg-emerald-500/10', border: 'border-emerald-500/20' }
                    ].map((role) => (
                        <div key={role.id} className={`flex flex-col items-center p-3 rounded-2xl border ${role.border} bg-[#161616]`}>
                        <i className={`fa-solid ${role.icon} text-2xl mb-2 ${role.color}`}></i>
                        <span className="text-xs font-semibold text-zinc-300 mb-3">{role.label}</span>
                        <div className="flex items-center gap-2 bg-[#0a0a0a] rounded-xl p-1 border border-zinc-800/50 w-full justify-between">
                            <button onClick={() => setRoleCounts(p => ({ ...p, [role.id]: Math.max(0, p[role.id] - 1) }))} className="w-6 h-6 flex items-center justify-center text-zinc-500 hover:text-white rounded-lg hover:bg-zinc-800 transition">-</button>
                            <span className="text-sm font-bold">{roleCounts[role.id]}</span>
                            <button onClick={() => setRoleCounts(p => ({ ...p, [role.id]: p[role.id] + 1 }))} className="w-6 h-6 flex items-center justify-center text-zinc-500 hover:text-white rounded-lg hover:bg-zinc-800 transition">+</button>
                        </div>
                        </div>
                    ))}
                    </div>
                </section>

                <section>
                    <div className="flex items-center justify-between mb-4">
                    <h2 className="text-sm font-bold text-zinc-400 uppercase tracking-wider flex items-center gap-2">
                        <i className="fa-solid fa-users w-4 h-4"></i> قائمة الأفراد ({players.length})
                    </h2>
                    <button onClick={handleAddPlayer} className="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-zinc-300 hover:bg-red-600 hover:text-white transition-colors">
                        <i className="fa-solid fa-plus w-4 h-4"></i>
                    </button>
                    </div>

                    <div className="space-y-2">
                    {players.map((player, index) => (
                        <div key={player.id} className="flex items-center bg-[#161616] border border-zinc-800/50 rounded-2xl overflow-hidden focus-within:border-red-500/50 focus-within:bg-red-500/5 transition-colors">
                        <div className="w-12 h-12 flex items-center justify-center bg-[#0a0a0a] border-l border-zinc-800/50 text-zinc-500 font-mono text-sm">
                            {(index + 1).toString().padStart(2, '0')}
                        </div>
                        <input 
                            type="text" 
                            placeholder="الاسم المستعار..."
                            value={player.name}
                            onChange={(e) => handleNameChange(player.id, e.target.value)}
                            className="flex-1 bg-transparent px-4 py-3 text-white focus:outline-none placeholder-zinc-600 font-medium"
                        />
                        {players.length > 3 && (
                            <button onClick={() => handleRemovePlayer(player.id)} className="w-12 h-12 flex items-center justify-center text-zinc-600 hover:text-red-500 transition-colors">
                            <i className="fa-solid fa-xmark w-4 h-4"></i>
                            </button>
                        )}
                        </div>
                    ))}
                    </div>
                </section>

                {errorMsg && (
                    <div className="bg-red-950/30 border border-red-900/50 text-red-400 p-4 rounded-2xl text-sm flex items-start gap-3">
                    <i className="fa-solid fa-triangle-exclamation w-5 h-5 shrink-0 mt-1"></i>
                    <p className="font-medium leading-tight pt-0.5">{errorMsg}</p>
                    </div>
                )}

                <div className="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-[#111] via-[#111] to-transparent pointer-events-none">
                    <button 
                    onClick={startGame}
                    className="w-full bg-white text-black hover:bg-zinc-200 font-bold py-4 rounded-2xl transition-all flex items-center justify-center gap-2 pointer-events-auto shadow-[0_0_40px_rgba(255,255,255,0.1)]"
                    >
                    بدء تهيئة النظام <i className="fa-solid fa-play w-4 h-4 ml-2"></i>
                    </button>
                </div>
                </div>
            );
        }

        function AssignmentPhase({ player, onNext, onCancel, isLast, totalPlayers, currentIndex }) {
            const [isScanning, setIsScanning] = useState(false);
            const [hasScanned, setHasScanned] = useState(false);
            const [displayRole, setDisplayRole] = useState(null);

            useEffect(() => {
                if (isScanning) {
                const roleKeys = Object.keys(ROLES);
                let i = 0;
                let speed = 50; 
                
                const cycleRole = () => {
                    setDisplayRole(ROLES[roleKeys[i % roleKeys.length]]);
                    i++;
                    if (i < 30) {
                    setTimeout(cycleRole, speed);
                    if (i > 20) speed += 20; 
                    } else {
                    setDisplayRole(player.role); 
                    setIsScanning(false);
                    setHasScanned(true);
                    }
                };
                
                cycleRole();
                }
            }, [isScanning, player.role]);

            useEffect(() => {
                setIsScanning(false);
                setHasScanned(false);
                setDisplayRole(null);
            }, [player.id]);

            return (
                <div className="h-full flex flex-col p-8 relative min-h-[100dvh] sm:min-h-[750px]">
                <div className="flex items-center justify-between mb-12">
                    <button onClick={onCancel} className="w-10 h-10 rounded-xl bg-[#161616] border border-zinc-800 hover:bg-zinc-800 flex items-center justify-center text-zinc-400 hover:text-white transition-colors shrink-0" title="العودة لتوزيع الأدوار">
                        <i className="fa-solid fa-arrow-right"></i>
                    </button>
                    <div className="flex gap-1 flex-1 justify-center mx-2 md:mx-4">
                    {Array.from({ length: totalPlayers }).map((_, idx) => (
                        <div key={idx} className={`h-1.5 rounded-full transition-all duration-500 ${idx === currentIndex ? 'w-8 bg-red-500' : idx < currentIndex ? 'w-2 bg-zinc-600' : 'w-2 bg-zinc-800'}`} />
                    ))}
                    </div>
                    <span className="text-zinc-500 font-mono text-xs tracking-widest uppercase shrink-0">ID: {player.id.toString().slice(-6)}</span>
                </div>

                <div className="flex-1 flex flex-col items-center justify-center w-full">
                    <div className="text-center mb-10 w-full">
                    <p className="text-zinc-500 text-sm font-medium uppercase tracking-widest mb-2">تعريف الهوية لـ</p>
                    <h2 className="text-4xl font-black text-white tracking-tight break-words">{player.name}</h2>
                    </div>

                    <div className={`w-full aspect-[4/5] max-w-[280px] rounded-[2rem] border transition-all duration-700 relative overflow-hidden flex flex-col items-center justify-center p-6 ${
                    !hasScanned && !isScanning ? 'border-zinc-800 bg-[#161616]' : 
                    isScanning ? 'border-red-500/50 bg-[#1a0a0a]' : 
                    `${displayRole?.border} ${displayRole?.bg}`
                    }`}>
                    
                    {isScanning && (
                        <div className="absolute left-0 right-0 h-1 bg-red-500/80 shadow-[0_0_20px_rgba(239,68,68,0.8)] animate-[scan_1s_ease-in-out_infinite]"></div>
                    )}

                    {!isScanning && !hasScanned ? (
                        <div className="flex flex-col items-center text-zinc-600">
                        <i className="fa-solid fa-fingerprint text-6xl mb-6 opacity-40"></i>
                        <p className="text-sm font-medium tracking-wide">بانتظار المصادقة</p>
                        </div>
                    ) : (
                        <div className="flex flex-col items-center text-center z-10 w-full animate-fade-in">
                        {displayRole && <i className={`fa-solid ${displayRole.icon} text-6xl mb-8 ${displayRole.color} ${isScanning ? 'opacity-50 blur-[2px]' : 'opacity-100'}`}></i>}
                        <div className="w-full">
                            <p className="text-xs uppercase tracking-widest text-zinc-500 mb-2 font-mono">Role // Assigned</p>
                            <h3 className={`text-3xl font-black ${displayRole?.color} ${isScanning ? 'blur-sm' : ''}`}>
                            {displayRole?.name}
                            </h3>
                        </div>
                        </div>
                    )}
                    </div>
                </div>

                <div className="mt-auto pt-10 pb-8">
                    {!isScanning && !hasScanned ? (
                    <button 
                        onClick={() => setIsScanning(true)}
                        className="w-full bg-red-600 text-white font-bold py-4 rounded-2xl shadow-[0_0_20px_rgba(220,38,38,0.2)] hover:bg-red-500 hover:shadow-[0_0_30px_rgba(220,38,38,0.4)] transition-all text-lg flex items-center justify-center gap-3"
                    >
                        <i className="fa-solid fa-fingerprint w-5 h-5"></i> بدء المسح
                    </button>
                    ) : hasScanned ? (
                    <button 
                        onClick={onNext}
                        className="w-full bg-white text-black font-bold py-4 rounded-2xl hover:bg-zinc-200 transition-all text-lg flex items-center justify-center gap-2"
                    >
                        {isLast ? 'تسليم النظام للحاكم' : 'إخفاء وتمرير الجهاز'} 
                        <i className="fa-solid fa-chevron-left w-5 h-5 mr-2"></i>
                    </button>
                    ) : (
                        <div className="w-full py-4 text-center text-zinc-500 font-mono text-sm tracking-widest animate-pulse">
                        جاري فك التشفير...
                        </div>
                    )}
                </div>
                </div>
            );
        }

        function ModeratorPhase({ players, onGoToElimination, onReset, onManualEnd }) {
            const [showRoles, setShowRoles] = useState(true);
            const [showEndModal, setShowEndModal] = useState(false);

            const aliveCount = players.filter(p => p.isAlive).length;
            const mafiaAlive = players.filter(p => p.isAlive && p.role.id === 'mafia').length;
            const othersAlive = aliveCount - mafiaAlive;

            const handleGoHome = () => {
                if(window.confirm('هل أنت متأكد من العودة للصفحة الرئيسية؟ سيتم إنهاء اللعبة.')) {
                    window.location.href = '1.html';
                }
            };

            return (
                <div className="px-6 pb-32 animate-fade-in h-full flex flex-col">
                <div className="bg-[#161616] border border-zinc-800 rounded-3xl p-6 mb-8 relative overflow-hidden mt-6">
                    <div className="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.02)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.02)_1px,transparent_1px)] bg-[size:16px_16px] pointer-events-none"></div>
                    
                    <div className="relative z-10 flex justify-between items-start mb-6">
                    <div>
                        <h2 className="text-xl font-bold text-white mb-1">لوحة القيادة</h2>
                        <p className="text-zinc-500 text-xs font-mono">SYSTEM // MODERATOR</p>
                    </div>
                    <div className="flex gap-2">
                        <button onClick={handleGoHome} className="w-10 h-10 rounded-xl bg-zinc-800/50 hover:bg-zinc-700 flex items-center justify-center text-zinc-400 hover:text-white transition-colors" title="الرئيسية">
                            <i className="fa-solid fa-house"></i>
                        </button>
                        <button onClick={() => setShowEndModal(true)} className="w-10 h-10 rounded-xl bg-red-900/20 border border-red-900/50 hover:bg-red-900/40 flex items-center justify-center text-red-500 hover:text-red-400 transition-colors" title="إنهاء اللعبة">
                            <i className="fa-solid fa-flag-checkered"></i>
                        </button>
                    </div>
                    </div>
                    
                    <div className="grid grid-cols-2 gap-4 relative z-10">
                    <div className="bg-[#0a0a0a] rounded-2xl p-4 border border-zinc-800/80">
                        <span className="block text-xs text-zinc-500 font-semibold mb-1">عناصر المافيا</span>
                        <div className="flex items-end gap-2">
                        <span className="text-3xl font-black text-red-500 leading-none">{mafiaAlive}</span>
                        <span className="text-sm text-zinc-600 mb-1 font-mono">ALIVE</span>
                        </div>
                    </div>
                    <div className="bg-[#0a0a0a] rounded-2xl p-4 border border-zinc-800/80">
                        <span className="block text-xs text-zinc-500 font-semibold mb-1">المدينة</span>
                        <div className="flex items-end gap-2">
                        <span className="text-3xl font-black text-blue-400 leading-none">{othersAlive}</span>
                        <span className="text-sm text-zinc-600 mb-1 font-mono">ALIVE</span>
                        </div>
                    </div>
                    </div>
                </div>

                <div className="flex justify-between items-end mb-4 px-2">
                    <h3 className="text-sm font-bold text-zinc-400 uppercase tracking-wider">سجل الأفراد ({players.length})</h3>
                    <button 
                    onClick={() => setShowRoles(!showRoles)}
                    className="text-xs font-medium flex items-center text-zinc-400 hover:text-white transition-colors"
                    >
                    {showRoles ? <i className="fa-solid fa-eye-slash w-4 h-4 ml-1.5"></i> : <i className="fa-solid fa-eye w-4 h-4 ml-1.5"></i>}
                    {showRoles ? 'تشفير الهويات' : 'إظهار الهويات'}
                    </button>
                </div>

                <div className="space-y-2 flex-1">
                    {players.map((player) => (
                    <div 
                        key={player.id} 
                        className={`flex items-center justify-between p-3.5 rounded-2xl border transition-all duration-300 ${
                        player.isAlive 
                            ? 'bg-[#161616] border-zinc-800 hover:border-zinc-700' 
                            : 'bg-[#0a0a0a] border-zinc-900 opacity-60'
                        }`}
                    >
                        <div className="flex items-center gap-4 overflow-hidden">
                        <div className={`w-10 h-10 shrink-0 rounded-xl flex items-center justify-center ${player.isAlive ? 'bg-zinc-800' : 'bg-red-950/30'}`}>
                            {player.isAlive ? <i className="fa-solid fa-user text-zinc-400"></i> : <i className="fa-solid fa-skull text-red-500/50"></i>}
                        </div>
                        
                        <div className="min-w-0">
                            <p className={`font-bold text-base truncate ${!player.isAlive ? 'line-through text-zinc-600' : 'text-white'}`}>
                            {player.name}
                            </p>
                            <div className="h-4 mt-0.5 flex items-center">
                            {showRoles ? (
                                <p className={`text-xs ${player.role.color} flex items-center`}>
                                <i className={`fa-solid ${player.role.icon} w-3 h-3 ml-1`}></i> {player.role.name}
                                </p>
                            ) : (
                                <div className="text-xs text-zinc-600 font-mono tracking-widest flex items-center">
                                <span className="w-1.5 h-1.5 rounded-full bg-zinc-600 ml-1.5"></span> CLASSIFIED
                                </div>
                            )}
                            </div>
                        </div>
                        </div>
                        
                        {!player.isAlive && (
                        <div className="shrink-0 text-[10px] font-bold tracking-widest uppercase text-red-500/70 border border-red-500/20 px-2 py-1 rounded bg-red-500/10">
                            ميت
                        </div>
                        )}
                    </div>
                    ))}
                </div>

                <div className="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-[#0a0a0a] via-[#0a0a0a] to-transparent flex gap-3 z-20">
                    <button 
                    onClick={onReset}
                    className="px-6 bg-[#161616] border border-zinc-800 rounded-2xl flex items-center justify-center text-zinc-400 hover:text-white hover:bg-zinc-800 transition-colors shrink-0"
                    title="إعادة ضبط اللعبة"
                    >
                    <i className="fa-solid fa-gear w-5 h-5"></i>
                    </button>
                    <button 
                    onClick={onGoToElimination}
                    className="flex-1 bg-red-600 text-white font-bold py-4 rounded-2xl shadow-[0_0_20px_rgba(220,38,38,0.15)] hover:bg-red-500 transition-colors flex items-center justify-center gap-2 text-lg"
                    >
                    <i className="fa-solid fa-skull w-5 h-5"></i> تنفيذ إقصاء
                    </button>
                </div>

                {showEndModal && (
                    <div className="absolute inset-0 z-50 bg-black/80 flex items-center justify-center p-6 animate-fade-in">
                        <div className="bg-[#161616] border border-zinc-800 rounded-3xl p-6 w-full max-w-sm flex flex-col items-center">
                            <h3 className="text-xl font-bold text-white mb-6">من هو المنتصر؟</h3>
                            <button 
                                onClick={() => onManualEnd('mafia')}
                                className="w-full bg-red-950/40 border border-red-900/50 text-red-500 hover:bg-red-900/40 hover:text-red-400 font-bold py-4 rounded-2xl mb-3 transition-colors flex justify-center items-center gap-2"
                            >
                                <i className="fa-solid fa-crosshairs"></i> فوز المافيا
                            </button>
                            <button 
                                onClick={() => onManualEnd('citizens')}
                                className="w-full bg-blue-950/40 border border-blue-900/50 text-blue-400 hover:bg-blue-900/40 hover:text-blue-300 font-bold py-4 rounded-2xl mb-4 transition-colors flex justify-center items-center gap-2"
                            >
                                <i className="fa-solid fa-shield-halved"></i> فوز المواطنين
                            </button>
                            <button 
                                onClick={() => setShowEndModal(false)}
                                className="text-zinc-500 hover:text-zinc-300 font-medium text-sm transition-colors"
                            >
                                إلغاء
                            </button>
                        </div>
                    </div>
                )}
                </div>
            );
        }

        function EliminationPhase({ players, onEliminate, onCancel }) {
            const alivePlayers = players.filter(p => p.isAlive);

            return (
                <div className="px-6 py-8 h-full flex flex-col animate-fade-in relative min-h-[100dvh] sm:min-h-[750px]">
                
                <div className="text-center mb-10 mt-6">
                    <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-500/10 text-red-500 mb-4 border border-red-500/20">
                        <i className="fa-solid fa-skull text-3xl"></i>
                    </div>
                    <h2 className="text-2xl font-black text-white mb-2 tracking-tight">حدد الهدف للإقصاء</h2>
                    <p className="text-zinc-500 text-sm">اختر اللاعب الذي صوّتت الأغلبية على تصفيته.</p>
                </div>

                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-5 flex-1 content-start">
                    {alivePlayers.map((player) => (
                    <button
                        key={player.id}
                        onClick={() => {
                        if(window.confirm(`تأكيد إقصاء ${player.name} نهائياً؟`)) {
                            onEliminate(player.id);
                        }
                        }}
                        className="bg-[#161616] border border-zinc-800 hover:border-red-500/50 hover:bg-red-950/20 p-5 rounded-3xl flex flex-col items-center justify-center gap-3 transition-all group"
                    >
                        <div className="w-14 h-14 rounded-2xl bg-[#0a0a0a] border border-zinc-800 group-hover:border-red-500/30 group-hover:bg-red-900/20 flex items-center justify-center transition-colors">
                        <i className="fa-solid fa-user text-2xl text-zinc-500 group-hover:text-red-400"></i>
                        </div>
                        <span className="font-bold text-white group-hover:text-red-400 text-center line-clamp-1">{player.name}</span>
                    </button>
                    ))}
                </div>

                <div className="mt-auto pt-8">
                    <button 
                    onClick={onCancel}
                    className="w-full bg-[#161616] border border-zinc-800 text-zinc-300 font-bold py-4 rounded-2xl hover:bg-zinc-800 hover:text-white transition-colors"
                    >
                    إلغاء والعودة للوحة القيادة
                    </button>
                </div>
                </div>
            );
        }

        function GameOverPhase({ winner, onReset }) {
            const [showButton, setShowButton] = useState(false);
            
            useEffect(() => {
                const timer = setTimeout(() => setShowButton(true), 2000);
                return () => clearTimeout(timer);
            }, []);

            const isMafia = winner === 'mafia';

            return (
                <div className="absolute inset-0 z-[100] flex flex-col items-center justify-center p-6 bg-[#050505]">
                    <div className={`absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] ${isMafia ? 'from-red-900/40' : 'from-blue-900/40'} via-[#050505] to-[#050505]`}></div>
                    
                    <div className="relative z-10 flex flex-col items-center text-center animate-fade-scale">
                        <div className={`w-40 h-40 mb-8 rounded-full border flex items-center justify-center relative overflow-hidden ${isMafia ? 'border-red-500/30 bg-red-950/20' : 'border-blue-500/30 bg-blue-950/20'}`}>
                            <div className={`absolute inset-0 border-[4px] rounded-full animate-[spin_3s_linear_infinite] border-t-transparent ${isMafia ? 'border-red-600' : 'border-blue-600'}`}></div>
                            <i className={`fa-solid ${isMafia ? 'fa-crosshairs text-red-500' : 'fa-shield-halved text-blue-400'} text-7xl drop-shadow-[0_0_15px_rgba(255,255,255,0.2)] flex items-center justify-center`}></i>
                        </div>
                        
                        <div className={`uppercase tracking-[0.3em] text-sm font-bold mb-4 ${isMafia ? 'text-red-500/80' : 'text-blue-400/80'}`}>نهاية اللعبة</div>
                        <h2 className="text-5xl md:text-6xl font-black text-white mb-10 tracking-tight">
                            {isMafia ? 'انتصرت المافيا' : 'انتصرت البلدة'}
                        </h2>
                        
                        {showButton && (
                            <button 
                                onClick={onReset}
                                className="animate-fade-in bg-white text-black font-bold py-4 px-8 rounded-2xl hover:bg-zinc-200 transition-all flex items-center gap-3 shadow-[0_0_30px_rgba(255,255,255,0.15)] text-lg"
                            >
                                العودة لتوزيع الأدوار <i className="fa-solid fa-users w-5 h-5 mr-1"></i>
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
