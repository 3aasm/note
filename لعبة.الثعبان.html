<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بروتوكول الأفعى</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            /* يمنع السحب للتحديث في الجوال */
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .animate-fade-scale {
            animation: fadeScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeScale {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* تأثير الشبكة الخلفية */
        .bg-grid-pattern {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* توهج النيون */
        .neon-text-green {
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .neon-shadow-green {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }
    </style>
</head>

<body class="bg-[#0a0a0a] text-zinc-100 font-sans selection:bg-emerald-900 m-0 overflow-hidden">
    <div id="root"></div>

    <!-- الأصوات -->
    <audio id="eatSound" preload="auto"
        src="https://assets.mixkit.co/sfx/preview/mixkit-unlock-game-notification-253.mp3"></audio>
    <audio id="gameOverSound" preload="auto"
        src="https://assets.mixkit.co/sfx/preview/mixkit-retro-game-emergency-alarm-1000.mp3"></audio>
    <audio id="clickSound" preload="auto"
        src="https://assets.mixkit.co/sfx/preview/mixkit-click-release-907.mp3"></audio>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- إعدادات اللعبة الثابتة ---
        const TILE_SIZE = 15;
        const CANVAS_SIZE = 300;

        function playSound(id) {
            const audio = document.getElementById(id);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio play blocked", e));
            }
        }

        function App() {
            const [gameState, setGameState] = useState('start'); // start, playing, game-over
            const [score, setScore] = useState(0);
            const [highScores, setHighScores] = useState([0, 0, 0]);
            const [finalLength, setFinalLength] = useState(0);

            useEffect(() => {
                const saved = localStorage.getItem('cyber_snake_highscores');
                if (saved) setHighScores(JSON.parse(saved));
            }, []);

            const saveHighScore = (newScore) => {
                let scores = [...highScores, newScore];
                scores.sort((a, b) => b - a);
                scores = scores.slice(0, 3);
                setHighScores(scores);
                localStorage.setItem('cyber_snake_highscores', JSON.stringify(scores));
            };

            const startGame = () => {
                playSound('clickSound');
                setScore(0);
                setFinalLength(0);
                setGameState('playing');
            };

            const handleGameOver = (finalScore, length) => {
                playSound('gameOverSound');
                setScore(finalScore);
                setFinalLength(length);
                saveHighScore(finalScore);
                setGameState('game-over');
            };

            return (
                <div className="min-h-[100dvh] w-full flex justify-center items-center relative overflow-hidden bg-grid-pattern">
                    {/* إضاءة خلفية (استبدال الأحمر بالأخضر) */}
                    <div className="absolute top-[-10%] left-[-10%] w-[50%] h-[40%] bg-emerald-900/20 blur-[120px] pointer-events-none"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[30%] bg-blue-900/10 blur-[100px] pointer-events-none"></div>

                    <div className="w-full max-w-[480px] h-[100dvh] sm:h-auto sm:min-h-[800px] sm:border sm:border-zinc-800/50 sm:rounded-[2.5rem] bg-[#111111]/90 backdrop-blur-xl relative flex flex-col shadow-2xl">

                        {/* الهيدر العلوي */}
                        <header className="px-6 pt-8 pb-4 flex items-center justify-between z-10 shrink-0 border-b border-zinc-800/50">
                            <div>
                                <h1 className="text-2xl font-black tracking-tight text-white flex items-center gap-2">
                                    بروتوكول الأفعى <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                </h1>
                                <p className="text-[10px] text-zinc-500 font-mono mt-1 uppercase tracking-widest">SYSTEM // OVERRIDE</p>
                            </div>
                            <div className="w-10 h-10 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center justify-center text-emerald-500">
                                <i className="fa-solid fa-code"></i>
                            </div>
                        </header>

                        <main className="flex-1 overflow-y-auto overflow-x-hidden relative scrollbar-hide flex flex-col">
                            {gameState === 'start' && (
                                <StartScreen highScores={highScores} onStart={startGame} />
                            )}
                            {gameState === 'playing' && (
                                <GameArea onGameOver={handleGameOver} onScoreUpdate={setScore} />
                            )}
                        </main>

                        {gameState === 'game-over' && (
                            <GameOverPhase score={score} length={finalLength} onReset={() => setGameState('start')} onReplay={startGame} />
                        )}
                    </div>
                </div>
            );
        }

        // --- شاشة البداية ---
        function StartScreen({ highScores, onStart }) {
            return (
                <div className="px-6 py-8 space-y-8 animate-fade-in flex-1 flex flex-col">

                    <div className="flex flex-col items-center justify-center py-6 text-center">
                        <div className="w-24 h-24 mb-6 rounded-3xl border border-emerald-500/30 bg-emerald-500/10 flex items-center justify-center relative overflow-hidden neon-shadow-green rotate-3">
                            <i className="fa-solid fa-worm text-5xl text-emerald-400"></i>
                        </div>
                        <h2 className="text-xl font-bold text-zinc-300 mb-2">النظام جاهز للاختراق</h2>
                        <p className="text-sm text-zinc-500 leading-relaxed max-w-[250px]">
                            اجمع البيانات الحمراء لتوسيع نطاق الدودة. تجنب الاصطدام بالجدران النارية أو التداخل مع مسارك.
                        </p>
                    </div>

                    <div className="bg-[#161616] border border-zinc-800 rounded-3xl p-5 relative overflow-hidden">
                        <div className="flex items-center justify-between mb-4">
                            <h3 className="text-xs font-bold text-zinc-400 uppercase tracking-wider flex items-center gap-2">
                                <i className="fa-solid fa-trophy text-yellow-500/80"></i> سجلات النظام
                            </h3>
                        </div>
                        <div className="space-y-2">
                            {highScores.map((score, idx) => (
                                <div key={idx} className="flex justify-between items-center bg-[#0a0a0a] p-3 rounded-2xl border border-zinc-800/80">
                                    <span className="text-zinc-500 font-mono text-xs">RANK_0{idx + 1}</span>
                                    <span className="font-black text-emerald-400 font-mono text-lg">{score}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="mt-auto pt-4">
                        <button
                            onClick={onStart}
                            className="w-full bg-emerald-500/10 backdrop-blur-lg border border-emerald-500/30 text-emerald-400 font-bold py-4 rounded-2xl hover:bg-emerald-500/20 hover:border-emerald-500/50 transition-all flex items-center justify-center gap-2 shadow-[0_8px_32px_rgba(16,185,129,0.15)] text-lg"
                        >
                            تفعيل الدودة <i className="fa-solid fa-power-off ml-2"></i>
                        </button>
                    </div>
                </div>
            );
        }

        // --- شاشة اللعب (محرك اللعبة) ---
        function GameArea({ onGameOver, onScoreUpdate }) {
            const canvasRef = useRef(null);
            const [scoreState, setScoreState] = useState(0);
            const [speedState, setSpeedState] = useState('عادي');

            // متغيرات اللعبة (بدون إعادة تصيير React لتجنب البطء)
            const gameData = useRef({
                snake: [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }],
                food: { x: 5, y: 5 },
                dx: 1,
                dy: 0,
                nextDx: 1,
                nextDy: 0,
                score: 0,
                speed: 130,
                lastTime: 0,
                reqId: null
            });

            // أدوات التحكم
            const changeDirection = (newDx, newDy) => {
                const { dx, dy } = gameData.current;
                // منع الانعكاس المباشر
                if ((newDx === -dx && newDx !== 0) || (newDy === -dy && newDy !== 0)) return;
                gameData.current.nextDx = newDx;
                gameData.current.nextDy = newDy;
                playSound('clickSound');
            };

            const handleControl = (dir) => (e) => {
                e.preventDefault();
                if (dir === 'up') changeDirection(0, -1);
                if (dir === 'down') changeDirection(0, 1);
                if (dir === 'left') changeDirection(-1, 0); // معكوس لـ RTL
                if (dir === 'right') changeDirection(1, 0); // معكوس لـ RTL
            };

            useEffect(() => {
                const handleKeyDown = (e) => {
                    switch (e.key) {
                        case 'ArrowUp': case 'w': changeDirection(0, -1); break;
                        case 'ArrowDown': case 's': changeDirection(0, 1); break;
                        case 'ArrowLeft': case 'a': changeDirection(-1, 0); break;
                        case 'ArrowRight': case 'd': changeDirection(1, 0); break;
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            // توليد الطعام
            const generateFood = () => {
                const { snake } = gameData.current;
                let newFood;
                let isOnSnake = true;
                while (isOnSnake) {
                    newFood = {
                        x: Math.floor(Math.random() * (CANVAS_SIZE / TILE_SIZE)),
                        y: Math.floor(Math.random() * (CANVAS_SIZE / TILE_SIZE))
                    };
                    isOnSnake = snake.some(s => s.x === newFood.x && s.y === newFood.y);
                }
                gameData.current.food = newFood;
            };

            // حلقة اللعبة (Game Loop)
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                generateFood();

                const loop = (time) => {
                    gameData.current.reqId = requestAnimationFrame(loop);

                    const delta = time - gameData.current.lastTime;
                    if (delta < gameData.current.speed) return;
                    gameData.current.lastTime = time;

                    updateGame(ctx);
                };

                gameData.current.reqId = requestAnimationFrame(loop);

                return () => cancelAnimationFrame(gameData.current.reqId);
            }, []);

            const updateGame = (ctx) => {
                const data = gameData.current;
                data.dx = data.nextDx;
                data.dy = data.nextDy;

                const head = { x: data.snake[0].x + data.dx, y: data.snake[0].y + data.dy };

                // التصادم مع الجدران
                if (head.x < 0 || head.x >= CANVAS_SIZE / TILE_SIZE || head.y < 0 || head.y >= CANVAS_SIZE / TILE_SIZE) {
                    cancelAnimationFrame(data.reqId);
                    onGameOver(data.score, data.snake.length);
                    return;
                }

                // التصادم مع النفس
                if (data.snake.some(s => s.x === head.x && s.y === head.y)) {
                    cancelAnimationFrame(data.reqId);
                    onGameOver(data.score, data.snake.length);
                    return;
                }

                data.snake.unshift(head);

                // أكل الطعام
                if (head.x === data.food.x && head.y === data.food.y) {
                    playSound('eatSound');
                    data.score += 10;
                    data.speed = Math.max(60, data.speed - 2); // زيادة السرعة

                    setScoreState(data.score);
                    onScoreUpdate(data.score);

                    if (data.speed < 80) setSpeedState('خطر');
                    else if (data.speed < 110) setSpeedState('سريع');

                    generateFood();
                } else {
                    data.snake.pop(); // إذا لم يأكل، احذف الذيل
                }

                drawGame(ctx, data);
            };

            const drawGame = (ctx, data) => {
                // مسح الشاشة
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                // رسم الشبكة البسيطة (Cyber style)
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
                ctx.lineWidth = 1;
                for (let i = 0; i <= CANVAS_SIZE; i += TILE_SIZE) {
                    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, CANVAS_SIZE); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(CANVAS_SIZE, i); ctx.stroke();
                }

                // رسم الطعام (Data packet - Red Neon)
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ef4444';
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(data.food.x * TILE_SIZE + 2, data.food.y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);

                // رسم الثعبان (Cyber Worm - Green Neon)
                ctx.shadowColor = '#10b981';
                data.snake.forEach((segment, index) => {
                    const isHead = index === 0;
                    ctx.fillStyle = isHead ? '#10b981' : '#059669';
                    ctx.shadowBlur = isHead ? 15 : 5;

                    // شكل القطع
                    ctx.beginPath();
                    ctx.roundRect(segment.x * TILE_SIZE + 1, segment.y * TILE_SIZE + 1, TILE_SIZE - 2, TILE_SIZE - 2, isHead ? 4 : 2);
                    ctx.fill();
                });
                ctx.shadowBlur = 0; // إعادة تعيين
            };

            return (
                <div className="px-6 py-4 animate-fade-in flex flex-col h-full">
                    {/* لوحة المعلومات العلوية (Dashboard) */}
                    <div className="bg-[#161616] border border-zinc-800 rounded-3xl p-4 mb-6 relative overflow-hidden">
                        <div className="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.02)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.02)_1px,transparent_1px)] bg-[size:10px_10px] pointer-events-none"></div>
                        <div className="grid grid-cols-3 gap-3 relative z-10 text-center">
                            <div className="bg-[#0a0a0a] rounded-2xl p-2 border border-zinc-800/80">
                                <span className="block text-[10px] text-zinc-500 font-mono mb-1">DATA</span>
                                <span className="text-xl font-black text-emerald-400 leading-none">{scoreState}</span>
                            </div>
                            <div className="bg-[#0a0a0a] rounded-2xl p-2 border border-zinc-800/80">
                                <span className="block text-[10px] text-zinc-500 font-mono mb-1">NODES</span>
                                <span className="text-xl font-black text-zinc-300 leading-none">{Math.floor(scoreState / 10) + 3}</span>
                            </div>
                            <div className="bg-[#0a0a0a] rounded-2xl p-2 border border-zinc-800/80">
                                <span className="block text-[10px] text-zinc-500 font-mono mb-1">SPEED</span>
                                <span className={`text-sm font-bold mt-1 block leading-none ${speedState === 'خطر' ? 'text-red-500 animate-pulse' : 'text-blue-400'}`}>
                                    {speedState}
                                </span>
                            </div>
                        </div>
                    </div>

                    {/* مساحة اللعب */}
                    <div className="flex-1 flex flex-col items-center justify-center">
                        <div className="relative p-2 bg-[#161616] border border-zinc-800 rounded-3xl shadow-[0_0_30px_rgba(0,0,0,0.5)]">
                            <canvas
                                ref={canvasRef}
                                width={CANVAS_SIZE}
                                height={CANVAS_SIZE}
                                className="bg-[#0a0a0a] rounded-2xl block"
                            ></canvas>
                        </div>
                    </div>

                    {/* أزرار التحكم (D-PAD الزجاجية) */}
                    <div className="mt-8 mb-4 flex justify-center w-full">
                        <div className="grid grid-cols-3 gap-2 w-[220px]">
                            <div></div>
                            <button onPointerDown={handleControl('up')} className="aspect-square bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl flex items-center justify-center text-2xl text-zinc-400 hover:text-white hover:bg-white/10 active:bg-emerald-500/20 active:border-emerald-500/50 transition-all touch-none">
                                <i className="fa-solid fa-chevron-up"></i>
                            </button>
                            <div></div>
                            <button onPointerDown={handleControl('right')} className="aspect-square bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl flex items-center justify-center text-2xl text-zinc-400 hover:text-white hover:bg-white/10 active:bg-emerald-500/20 active:border-emerald-500/50 transition-all touch-none">
                                <i className="fa-solid fa-chevron-right"></i>
                            </button>
                            <button onPointerDown={handleControl('down')} className="aspect-square bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl flex items-center justify-center text-2xl text-zinc-400 hover:text-white hover:bg-white/10 active:bg-emerald-500/20 active:border-emerald-500/50 transition-all touch-none">
                                <i className="fa-solid fa-chevron-down"></i>
                            </button>
                            <button onPointerDown={handleControl('left')} className="aspect-square bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl flex items-center justify-center text-2xl text-zinc-400 hover:text-white hover:bg-white/10 active:bg-emerald-500/20 active:border-emerald-500/50 transition-all touch-none">
                                <i className="fa-solid fa-chevron-left"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- شاشة النهاية (تشبه شاشة الإقصاء في المافيا) ---
        function GameOverPhase({ score, length, onReset, onReplay }) {
            return (
                <div className="absolute inset-0 z-50 bg-[#050505] flex flex-col items-center justify-center p-6">
                    <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-red-900/30 via-[#050505] to-[#050505]"></div>

                    <div className="relative z-10 flex flex-col items-center text-center animate-fade-scale w-full">
                        <div className="w-32 h-32 mb-8 rounded-full border border-red-500/30 bg-red-950/20 flex items-center justify-center relative overflow-hidden">
                            <div className="absolute inset-0 border-[4px] border-red-600 rounded-full animate-[spin_3s_linear_infinite] border-t-transparent"></div>
                            <i className="fa-solid fa-triangle-exclamation w-16 h-16 text-6xl text-red-500 drop-shadow-[0_0_15px_rgba(220,38,38,0.5)] flex items-center justify-center"></i>
                        </div>

                        <div className="uppercase tracking-[0.3em] text-red-500/80 text-sm font-mono mb-2">CRITICAL ERROR</div>
                        <h2 className="text-4xl font-black text-white mb-8 tracking-tight">تم تدمير الدودة</h2>

                        <div className="w-full max-w-[280px] space-y-3 mb-10">
                            <div className="flex items-center justify-between bg-zinc-900/80 px-5 py-4 rounded-2xl border border-zinc-800">
                                <span className="text-zinc-400 text-sm">البيانات المستخرجة:</span>
                                <span className="font-black text-2xl text-emerald-400 font-mono">{score}</span>
                            </div>
                            <div className="flex items-center justify-between bg-zinc-900/80 px-5 py-4 rounded-2xl border border-zinc-800">
                                <span className="text-zinc-400 text-sm">طول العقدة:</span>
                                <span className="font-black text-xl text-zinc-200 font-mono">{length}</span>
                            </div>
                        </div>

                        <div className="flex flex-col gap-3 w-full max-w-[280px]">
                            <button
                                onClick={onReplay}
                                className="w-full bg-emerald-500/10 backdrop-blur-lg border border-emerald-500/30 text-emerald-400 font-bold py-4 rounded-2xl hover:bg-emerald-500/20 hover:border-emerald-500/50 transition-all flex items-center justify-center gap-3 shadow-[0_8px_32px_rgba(16,185,129,0.15)] text-lg animate-fade-in opacity-0"
                                style={{ animationDelay: '0.5s', animationFillMode: 'forwards' }}
                            >
                                إعادة الاتصال <i className="fa-solid fa-rotate-right ml-1"></i>
                            </button>
                            <button
                                onClick={onReset}
                                className="w-full bg-white/5 backdrop-blur-lg border border-white/10 text-zinc-300 font-bold py-4 rounded-2xl hover:bg-white/10 hover:border-white/20 transition-all flex items-center justify-center gap-3 text-sm animate-fade-in opacity-0"
                                style={{ animationDelay: '0.7s', animationFillMode: 'forwards' }}
                            >
                                إنهاء النظام <i className="fa-solid fa-power-off ml-1"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
